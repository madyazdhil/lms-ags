<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syllabus Presentation — Python Foundations to Interactive Streamlit Web App (16 Sessions)</title>
  
  <!-- Google Fonts: Fredoka for cheerful & impactful headings, Poppins for clean prose, Fira Code for code -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Fira+Code:wght@500;600&display=swap" rel="stylesheet">
  
  <!-- Pyodide: In-browser Python runtime -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>

  <style>
    :root {
      /* Warm Modern Workspace Palette */
      --bg-workspace: #F3EFE9;
      --bg-slide: #FFFDF9;
      
      /* Vibrant Accent Colors */
      --c-yellow: #E8AA24;
      --c-orange: #EF6C35;
      --c-pink: #E0356D;       
      --c-light-pink: #F47C9E;
      --c-purple: #9A53E0;
      --c-blue: #447EE0;
      --c-light-blue: #4AB2D9;
      --c-green: #48A850;
      --c-streamlit: #FF4B4B;
      
      /* Typography Colors */
      --text-dark: #2A2A35;
      --text-muted: #6C6C82;

      /* Dark IDE Colors */
      --ide-bg: #1A1A28;
      --ide-text: #A6E22E;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-workspace);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    #app-wrapper {
      width: 96vw;
      max-width: 1600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    #presentation-container {
      width: 100%;
      height: 85vh;
      background-color: var(--bg-slide);
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(42, 42, 53, 0.08);
      border-radius: 36px; 
      overflow: hidden;
      border: 2px solid #EBE6DF;
    }

    .slide {
      position: absolute;
      inset: 0;
      padding: clamp(28px, 3.8vw, 52px);
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform: scale(0.97) translateY(12px);
      overflow-y: auto; 
      overflow-x: hidden;
    }

    .slide::-webkit-scrollbar { width: 8px; }
    .slide::-webkit-scrollbar-thumb {
      background: #D8D8E5;
      border-radius: 20px;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1) translateY(0);
      z-index: 10;
    }

    /* Headings & Text */
    h1, h2, h3, h4 { font-family: 'Fredoka', sans-serif; font-weight: 700; color: var(--text-dark); }
    h1 { font-size: clamp(2.5rem, 4.2vw, 4rem); line-height: 1.08; margin-bottom: 14px; }
    h2 { font-size: clamp(1.9rem, 2.9vw, 2.5rem); line-height: 1.18; margin-bottom: 10px; }
    h3 { font-size: clamp(1.2rem, 1.6vw, 1.45rem); margin-bottom: 6px; }
    h4 { font-size: 1.05rem; }
    p { font-size: clamp(0.94rem, 1.15vw, 1.05rem); line-height: 1.65; color: var(--text-muted); font-weight: 500; }
    .lead { font-size: clamp(1.05rem, 1.35vw, 1.25rem); color: var(--text-muted); line-height: 1.6; }
    strong { color: var(--text-dark); font-weight: 700; }

    /* Layout Primitives */
    .row { display: flex; flex-direction: row; }
    .col { display: flex; flex-direction: column; }
    .center { align-items: center; justify-content: center; }
    .align-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .h-full { height: 100%; }
    .w-full { width: 100%; }
    .w-half { width: 50%; }
    .w-60 { width: 58%; }
    .w-40 { width: 42%; }
    .gap-sm { gap: 10px; }
    .gap-md { gap: 18px; }
    .gap-lg { gap: 28px; }
    .text-center { text-align: center; }

    /* Badges & Tag Pills */
    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 18px;
      border-radius: 30px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 14px;
      width: fit-content;
    }
    .tag-blue { background: rgba(68, 126, 224, 0.12); color: var(--c-blue); }
    .tag-pink { background: rgba(224, 53, 109, 0.12); color: var(--c-pink); }
    .tag-purple { background: rgba(154, 83, 224, 0.12); color: var(--c-purple); }
    .tag-green { background: rgba(72, 168, 80, 0.12); color: var(--c-green); }
    .tag-orange { background: rgba(239, 108, 53, 0.12); color: var(--c-orange); }
    .tag-yellow { background: rgba(232, 170, 36, 0.15); color: #B37B00; }
    .tag-streamlit { background: rgba(255, 75, 75, 0.14); color: var(--c-streamlit); }

    /* Grids & Cards */
    .cards-grid { display: grid; gap: 18px; width: 100%; margin-top: 14px; }
    .cards-2 { grid-template-columns: repeat(2, 1fr); }
    .cards-3 { grid-template-columns: repeat(3, 1fr); }
    .cards-4 { grid-template-columns: repeat(4, 1fr); }
    .cards-5 { grid-template-columns: repeat(5, 1fr); }

    .card {
      background: #FFFFFF;
      padding: 22px;
      border-radius: 26px;
      border: 1px solid #EFEAE3;
      box-shadow: 0 10px 28px rgba(42, 42, 53, 0.04);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 36px rgba(42, 42, 53, 0.08);
    }

    .icon-box {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    .callout {
      padding: 16px 20px;
      border-radius: 20px;
      background: #F8FAFC;
      border-left: 6px solid var(--c-blue);
      margin-top: 14px;
      font-size: 0.92rem;
    }
    .callout.green { background: #ECFDF5; border-left-color: var(--c-green); }
    .callout.streamlit { background: #FFF5F5; border-left-color: var(--c-streamlit); }
    .callout.orange { background: #FFF7ED; border-left-color: var(--c-orange); }

    /* Timeline Stepper Component */
    .timeline-strip {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      width: 100%;
      margin: 20px 0;
      position: relative;
    }
    .timeline-step {
      background: white;
      border-radius: 22px;
      padding: 18px 16px;
      border: 1px solid #ECE7DF;
      border-top: 6px solid var(--c-blue);
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.03);
      transition: all 0.2s ease;
    }
    .timeline-step:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 28px rgba(0,0,0,0.06);
    }
    .step-pill {
      font-family: 'Fredoka', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 14px;
      width: fit-content;
    }

    /* Session Detailed Breakdown Card */
    .session-item-card {
      background: white;
      border-radius: 20px;
      padding: 16px 20px;
      border: 1px solid #ECE7DF;
      border-left: 6px solid var(--c-blue);
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.03);
    }
    .session-badge {
      font-family: 'Fredoka', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      width: fit-content;
    }

    /* Comparison Box */
    .vs-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      width: 100%;
      margin-top: 15px;
    }
    .vs-box {
      background: white;
      border-radius: 24px;
      padding: 24px;
      border: 2px solid #E2E8F0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .vs-box.highlight {
      border-color: var(--c-streamlit);
      background: #FFFDFC;
      box-shadow: 0 12px 30px rgba(255, 75, 75, 0.08);
    }

    /* Mascot Scene */
    .scene {
      position: relative;
      height: 100%;
      min-height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .blob {
      width: min(340px, 90%);
      filter: drop-shadow(0 16px 25px rgba(42,42,53,0.12));
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }
    .bubble {
      position: absolute;
      background: white;
      padding: 12px 18px;
      border-radius: 22px;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text-dark);
      border: 1px solid #ECE7DF;
      box-shadow: 0 12px 28px rgba(0,0,0,0.08);
      max-width: 250px;
      z-index: 5;
    }
    .bubble.top-right { top: 6%; right: 6%; }
    .bubble.bottom-left { bottom: 6%; left: 6%; }

    /* Interactive IDE Container */
    .ide-container {
      display: flex;
      gap: 16px;
      width: 100%;
      height: 270px;
      margin-top: 10px;
    }
    .ide-window {
      flex: 1;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #E2E8F0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .ide-header {
      height: 36px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-r { background: #FF5F56; }
    .dot-y { background: #FFBD2E; }
    .dot-g { background: #27C93F; }

    .ide-editor {
      background: var(--ide-bg);
      color: var(--ide-text);
      padding: 14px;
      font-family: 'Fira Code', monospace;
      font-size: 0.88rem;
      line-height: 1.5;
      flex: 1;
      border: 0;
      outline: 0;
      resize: none;
      white-space: pre;
    }
    .ide-output {
      background: #F8FAFC;
      border: 2px dashed #CBD5E1;
      padding: 14px;
      font-family: 'Fira Code', monospace;
      font-size: 0.88rem;
      color: #334155;
      flex: 1;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .btn-run {
      align-self: flex-start;
      margin-top: 10px;
      background: var(--c-green);
      color: white;
      border: 0;
      padding: 9px 24px;
      border-radius: 50px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(72, 168, 80, 0.3);
      transition: transform 0.15s;
    }
    .btn-run:hover { transform: translateY(-2px); }
    .btn-run:disabled { background: #CBD5E1; cursor: wait; box-shadow: none; transform: none; }

    /* Streamlit Realistic Browser Mockup */
    .st-browser-frame {
      background: white;
      border-radius: 22px;
      border: 2px solid #E2E8F0;
      box-shadow: 0 18px 40px rgba(0,0,0,0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 320px;
      position: relative;
    }
    .st-topbar {
      height: 38px;
      background: #F8FAFC;
      border-bottom: 1px solid #E2E8F0;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
      position: relative;
    }
    .st-red-line {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #FF4B4B, #FF9B9B, #FFAE42);
    }
    .st-url {
      background: white;
      border: 1px solid #CBD5E1;
      border-radius: 10px;
      padding: 2px 12px;
      font-size: 0.76rem;
      font-family: 'Fira Code', monospace;
      color: #64748B;
      margin-left: 6px;
      flex: 1;
    }
    .st-viewport {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .st-mockup-sidebar {
      width: 32%;
      background: #F8FAFC;
      border-right: 1px solid #E2E8F0;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.8rem;
    }
    .st-mockup-main {
      width: 68%;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .st-input-box {
      width: 100%;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #CBD5E1;
      font-size: 0.82rem;
      font-family: 'Poppins', sans-serif;
      outline: none;
    }
    .st-input-box:focus { border-color: var(--c-streamlit); }
    .st-action-btn {
      background: var(--c-streamlit);
      color: white;
      border: 0;
      padding: 7px 16px;
      border-radius: 8px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 75, 75, 0.25);
      align-self: flex-start;
      transition: all 0.2s;
    }
    .st-action-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(255, 75, 75, 0.35); }
    .st-alert-pill {
      background: #ECFDF5;
      border: 1px solid #A7F3D0;
      color: #065F46;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Floating Balloons for Streamlit */
    .balloon-particle {
      position: absolute;
      font-size: 2.2rem;
      animation: floatUp 3s ease-out forwards;
      pointer-events: none;
      z-index: 999;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.6); }
      100% { opacity: 0; transform: translateY(-220px) scale(1.2); }
    }

    /* Bottom Navigation Bar */
    #bottom-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }
    .slide-indicator {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
    }
    .logo-mark {
      width: 32px;
      height: 32px;
      background: var(--c-streamlit);
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 1.1rem;
      transform: rotate(10deg);
    }
    .nav-controls { display: flex; gap: 12px; }
    .nav-btn {
      border: none;
      border-radius: 50px;
      padding: 10px 26px;
      background: var(--text-dark);
      color: white;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(42,42,53,0.12);
      transition: all 0.2s ease;
    }
    .nav-btn-primary {
      background: var(--c-streamlit);
      box-shadow: 0 6px 18px rgba(255, 75, 75, 0.3);
    }
    .nav-btn:hover:not(:disabled) { transform: translateY(-2px); }
    .nav-btn:disabled { background: #D8D8E5; color: #A0A0B5; cursor: not-allowed; box-shadow: none; }

    .progress-track {
      position: absolute;
      left: 0; bottom: 0; width: 100%;
      height: 6px;
      background: #EBE6DF;
      z-index: 20;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--c-blue), var(--c-purple), var(--c-streamlit));
      transition: width 0.35s ease;
    }

    @media (max-width: 1024px) {
      .cards-4, .cards-5, .timeline-strip { grid-template-columns: repeat(2, 1fr); }
      .vs-container { grid-template-columns: 1fr; }
      .row { flex-direction: column; }
      .w-half, .w-60, .w-40 { width: 100%; }
      .ide-container { flex-direction: column; height: auto; }
    }
  </style>
</head>
<body>

  <div id="app-wrapper">
    <div id="presentation-container">
      <div id="slides-root"></div>
      <div class="progress-track"><div class="progress-bar" id="progress"></div></div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div id="bottom-bar">
      <div class="slide-indicator">
        <a href="../index.html" style="display:inline-flex; align-items:center; text-decoration:none;" title="To LMS Dashboard">
          <div class="logo-mark">🚀</div>
        </a>
        <span>Slide <span id="current-page">1</span> / <span id="total-page">20</span></span>
      </div>
      <div class="nav-controls">
        <a href="../index.html" class="nav-btn" style="text-decoration: none; background: #E2E8F0; color: #334155; display: inline-flex; align-items: center; gap: 6px;">🏠 Dashboard</a>
        <button class="nav-btn" id="prev-btn" disabled>Back</button>
        <button class="nav-btn nav-btn-primary" id="next-btn">Next ➞</button>
      </div>
    </div>
  </div>

  <script>
    // --- Helper Components ---
    const mascot = (color = 'var(--c-blue)', crown = false) => `
      <svg class="blob" viewBox="0 0 320 320" aria-hidden="true">
        <circle cx="270" cy="50" r="24" fill="var(--c-yellow)" opacity="0.6"/>
        <path d="M 65 82 C 103 25, 225 30, 266 88 C 301 137, 289 241, 236 278 C 188 312, 82 301, 46 250 C 10 200, 27 139, 65 82 Z" fill="${color}"/>
        <ellipse cx="125" cy="145" rx="22" ry="32" fill="white"/>
        <ellipse cx="205" cy="145" rx="22" ry="32" fill="white"/>
        <circle cx="132" cy="151" r="13" fill="#20202A"/>
        <circle cx="198" cy="151" r="13" fill="#20202A"/>
        <circle cx="127" cy="145" r="4" fill="white"/>
        <circle cx="193" cy="145" r="4" fill="white"/>
        <path d="M 135 210 Q 165 235 195 210" fill="none" stroke="#20202A" stroke-width="8" stroke-linecap="round"/>
        ${crown ? `
          <!-- Streamlit Crown -->
          <polygon points="165,30 205,95 240,55 250,115 125,115 140,70" fill="var(--c-streamlit)"/>
          <circle cx="165" cy="26" r="6" fill="var(--c-yellow)"/>
          <circle cx="240" cy="51" r="5" fill="var(--c-yellow)"/>
        ` : ''}
      </svg>`;

    // --- 20 MASTER ENGLISH SLIDES ---
    const slides = [
      // 1. Cover Slide
      `<div class="row h-full align-center justify-between">
        <div class="col w-60">
          <span class="tag-pill tag-streamlit">🚀 16-Session Complete Syllabus</span>
          <h1>Python Foundations to <span style="color: var(--c-streamlit);">Streamlit</span> Web App</h1>
          <p class="lead" style="margin-top: 10px;">
            A structured, hands-on journey from zero coding experience to deploying real, interactive web applications in the cloud using pure Python and Streamlit.
          </p>
          <div class="row gap-md" style="margin-top: 26px;">
            <div class="card" style="padding: 12px 18px; border-left: 5px solid var(--c-purple);">
              <strong style="color: var(--c-purple); font-size: 0.95rem;">🎯 Target Audience</strong>
              <span style="font-size: 0.88rem; font-weight: 600;">Middle & High School (Beginners)</span>
            </div>
            <div class="card" style="padding: 12px 18px; border-left: 5px solid var(--c-orange);">
              <strong style="color: var(--c-orange); font-size: 0.95rem;">⏱️ Learning Model</strong>
              <span style="font-size: 0.88rem; font-weight: 600;">16 Sessions @ 90 Mins (Scaffolding)</span>
            </div>
            <div class="card" style="padding: 12px 18px; border-left: 5px solid var(--c-streamlit);">
              <strong style="color: var(--c-streamlit); font-size: 0.95rem;">🌐 Final Output</strong>
              <span style="font-size: 0.88rem; font-weight: 600;">Live Interactive Web App</span>
            </div>
          </div>
        </div>
        <div class="w-40 scene">
          ${mascot('var(--c-blue)', true)}
          <div class="bubble top-right">Hi! I'm Byte! 🤖<br><small style="color:var(--text-muted)">Ready to build real web apps?</small></div>
          <div class="bubble bottom-left">100% Cloud Coding in the Browser! ✨</div>
        </div>
      </div>`,

      // 2. The Core Vision: Why Python + Streamlit?
      `<div>
        <span class="tag-pill tag-streamlit">Curriculum Innovation</span>
        <h2>Why Bridge Python to Streamlit Web Apps? 💡</h2>
        <p class="lead">Overcoming the traditional friction in introductory coding courses for young minds.</p>
        <div class="vs-container">
          <div class="vs-box">
            <div class="row align-center gap-sm">
              <span style="font-size: 2rem;">⬛</span>
              <div>
                <h3 style="color: #64748B;">Traditional Way (Terminal-Only CLI)</h3>
                <span style="font-size: 0.8rem; color: #94A3B8;">16 Sessions restricted to black console screens</span>
              </div>
            </div>
            <p style="font-size: 0.88rem;">
              Students only see plain text printouts. After weeks of hard work, they cannot share their creations with family or friends in an engaging way, causing drop-offs in motivation.
            </p>
            <div class="callout" style="border-left-color: #94A3B8; margin-top: auto;">
              <span style="font-size: 0.82rem; font-weight: 600; color: #64748B;">❌ Outcome: High cognitive effort, low visual satisfaction.</span>
            </div>

        ${html}
      </section>
    `).join('');

    // --- Navigation Logic ---
    const allSlides = document.querySelectorAll('.slide');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const currentPage = document.getElementById('current-page');
    const totalPage = document.getElementById('total-page');
    const progressBar = document.getElementById('progress');
    let currentSlideIndex = 0;

    totalPage.textContent = allSlides.length;

    function updateSlideView() {
      allSlides.forEach((slide, i) => {
        slide.classList.toggle('active', i === currentSlideIndex);
      });
      currentPage.textContent = currentSlideIndex + 1;
      progressBar.style.width = ((currentSlideIndex + 1) / allSlides.length * 100) + '%';

      prevBtn.disabled = currentSlideIndex === 0;

      if (currentSlideIndex === allSlides.length - 1) {
        nextBtn.disabled = true;
        nextBtn.textContent = 'Completed 🎉';
        nextBtn.classList.remove('nav-btn-primary');
      } else {
        nextBtn.disabled = false;
        nextBtn.textContent = 'Next ➞';
        nextBtn.classList.add('nav-btn-primary');
      }
    }

    function move(step) {
      const nextIndex = currentSlideIndex + step;
      if (nextIndex >= 0 && nextIndex < allSlides.length) {
        currentSlideIndex = nextIndex;
        updateSlideView();
      }
    }

    prevBtn.addEventListener('click', () => move(-1));
    nextBtn.addEventListener('click', () => move(1));

    document.addEventListener('keydown', (e) => {
      if (e.target.matches('textarea, input, select')) return;
      if (e.key === 'ArrowRight' || e.key === 'Space') {
        e.preventDefault();
        move(1);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        move(-1);
      }
    });

    updateSlideView();

    // --- Universal Pyodide Python Runner ---
    let pyodideInstance = null;
    let pyodidePromise = initPyodide();

    async function initPyodide() {
      try {
        pyodideInstance = await loadPyodide();
        document.querySelectorAll('.btn-run').forEach(b => {
          b.disabled = false;
          b.textContent = 'Run Code ▶️';
        });
        return pyodideInstance;
      } catch (err) {
        console.error('Pyodide failed to load:', err);
        document.querySelectorAll('.btn-run').forEach(b => {
          b.textContent = 'Failed to Load Python ❌';
        });
      }
    }

    async function runPythonEngine(editorId, outputId, btn) {
      if (!pyodideInstance) {
        const p = await pyodidePromise;
        if (!p) return;
      }

      const editor = document.getElementById(editorId);
      const out = document.getElementById(outputId);
      if (!editor || !out) return;

      btn.disabled = true;
      btn.textContent = 'Running... ⚙️';
      out.textContent = '';

      const lines = [];
      pyodideInstance.setStdout({ batched: (msg) => lines.push(msg) });

      try {
        await pyodideInstance.runPythonAsync(editor.value);
        out.textContent = lines.join('\n') || 'Program executed successfully with no output.';
        out.style.color = '#1E293B';
      } catch (err) {
        out.textContent = `Oops, there is a bug 🐛:\n\n${err.message}`;
