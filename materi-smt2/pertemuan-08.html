splay:flex;flex-direction:column;overflow:hidden;box-shadow:0 15px 40px #00000014}.ide-head{height:44px;display:flex;align-items:center;padding:0 18px;gap:8px;font-weight:600;background:#2D2D44;color:#fff}.dot{width:12px;height:12px;border-radius:50%}.editor{background:var(--ide);color:#A6E22E;padding:20px;font:500 .88rem/1.45 'Fira Code';flex:1;border:0;outline:0;resize:none}.output{background:#F8F9FA;border:4px dashed #E2E8F0;padding:20px;font:500 .9rem/1.5 'Fira Code';flex:1;color:#334155;overflow:auto;white-space:pre-wrap}.run{align-self:center;margin-top:12px;background:var(--green);color:#fff;border:0;padding:13px 32px;border-radius:50px;font:700 1.15rem Fredoka;cursor:pointer;box-shadow:0 10px 25px #48A85055}.run:disabled{background:#CBD5E1;cursor:wait;box-shadow:none}#bar{display:flex;justify-content:space-between;align-items:center;padding:0 36px}.indicator{display:flex;align-items:center;gap:13px;font:700 1.15rem Fredoka}.logo{width:34px;height:34px;background:var(--pink);border-radius:12px;transform:rotate(15deg)}.nav{display:flex;gap:14px}.btn{border:0;border-radius:50px;padding:13px 34px;background:var(--dark);color:#fff;font:600 1.15rem Fredoka;cursor:pointer;box-shadow:0 10px 20px #2A2A3526}.primary{background:var(--blue)}.btn:disabled{background:#D8D8E5;color:#A0A0B5;box-shadow:none}.track{position:absolute;bottom:0;width:100%;height:7px;background:#EEEAF0;z-index:5}.progress{height:100%;background:linear-gradient(90deg,var(--pink),var(--telegram));transition:.35s}

<script>

const split=(tag,title,text,art,c='var(--telegram)')=>`<div class="row center full gap"><div class="half col"><span class="tag ${tag}">${tag}</span><h2>${title}</h2><p class="lead">${text}</p></div><div class="half scene">${art||blob(c)}</div></div>`;

const slides=[
// Slide 1
`<div class="row center full gap"><div class="half"><span class="tag tg-tag">Meeting 08 • Natural Chat</span><h1>The Echo Bot & <br><span style="color:var(--telegram)">Smart Filters</span></h1><p class="lead" style="margin-top:22px">Teach your bot to read everyday chat, cheer you up when you feel lazy, and filter out toxic words!</p></div><div class="half scene">${blob('var(--telegram)')}<div class="bubble top">I can hear everything! 👂</div><div class="bubble bottom">Smart Text Handler Active 🧠</div></div></div>`,

// Slide 2: Mission
cards('blue','Today’s Mission','Moving beyond slash commands into real conversational text.',[['🦜','Echo Bot','var(--blue)','Repeat any message sent by the user.'],['🔥','Motivation Booster','var(--orange)','Detect words like "tired" or "mager" & reply with energy!'],['🛡️','Anti-Toxic Shield','var(--pink)','Warn users when inappropriate words are typed.']]),

// Slide 3: 90-Min Scaffolding
`<span class="tag yellow">Lesson Flow</span><h2>90-Minute Scaffolding Plan ⏱️</h2><div class="cards"><div class="card"><div class="icon" style="background:#EBF3FF;color:var(--blue)">👀</div><h3>15' • I Do</h3><p>Demo of Text Handlers, Lambda filter, and .lower() string trick.</p></div><div class="card"><div class="icon" style="background:#FFF4EE;color:var(--orange)">🤝</div><h3>35' • We Do</h3><p>Live coding Echo Bot + intelligent keyword detection.</p></div><div class="card"><div class="icon" style="background:#EFFFEE;color:var(--green)">🚀</div><h3>30' • You Do</h3><p>Anti-Toxic filter + custom friend greeting personality.</p></div></div><div class="callout"><p><strong>Final 10 Minutes:</strong> Test with unusual word cases and sync to GitHub!</p></div>`,

// Slide 4: Catching Normal Messages
split('tg-tag','Catching Normal Chat','Until now, our bot only answered when messages started with <code>/</code>. What if a user just types <em>"hello"</em> or <em>"I am sleepy"</em>?',`<div style="font-size:7rem">💬 ➜ 🤖 ➜ 💡</div>`),

// Slide 5: The Lambda Trick
code('tg-tag','Catching All Text Messages',`<span class="comment"># This handler triggers for ANY plain text message:</span><br><span class="kw">@bot.message_handler</span>(<span class="var">func</span>=<span class="kw">lambda</span> <span class="var">msg</span>: <span class="kw">True</span>)<br><span class="kw">def</span> <span class="fn">echo_all</span>(<span class="var">message</span>):<br>    <span class="var">user_text</span> = <span class="var">message</span>.<span class="var">text</span><br>    <span class="var">bot</span>.<span class="fn">reply_to</span>(<span class="var">message</span>, <span class="str">f"🦜 You said: {user_text}"</span>)`,'func=lambda msg: True is a gatekeeper that lets every single incoming message pass through!'),

// Slide 6: Case Sensitivity Trap
cards('pink','The Capital Letter Trap','Computers treat uppercase and lowercase letters as completely different characters!',[['❌','mager == Mager','var(--pink)','Returns False! The bot fails to detect.'],['❌','HELLO == hello','var(--orange)','Returns False! Misses the greeting.'],['✅','.lower()','var(--green)','Converts all characters to lowercase first!']]),

// Slide 7: The .lower() Secret Weapon
code('green','Normalizing Text with .lower()',`<span class="var">raw_text</span> = <span class="str">"Saya Lagi MAGER Banget!"</span><br><span class="var">clean_text</span> = <span class="var">raw_text</span>.<span class="fn">lower</span>()<br><br><span class="fn">print</span>(<span class="var">clean_text</span>)<br><span class="comment"># Output: 'saya lagi mager banget!'</span><br><br><span class="comment"># Now we can easily check with 'in':</span><br><span class="kw">if</span> <span class="str">"mager"</span> <span class="kw">in</span> <span class="var">clean_text</span>:<br>    <span class="fn">print</span>(<span class="str">"🔥 Semangat dong! Masa depanmu cerah!"</span>)`,'Using the "in" keyword checks if a word exists anywhere inside a long sentence!'),

// Slide 8: Interactive Pyodide Sandbox
`<span class="tag green">Interactive Python Arena</span><h2>Test Smart Keyword Responders</h2><div class="ide-wrap"><div class="ide-window"><div class="ide-head"><i class="dot" style="background:#FF5F56"></i><i class="dot" style="background:#FFBD2E"></i><i class="dot" style="background:#27C93F"></i><span>smart_filter.py</span></div><textarea id="python-code" class="editor" spellcheck="false">def bot_respond(user_message):
    text = user_message.lower()
    
    # Check for negative/lazy words
    if "mager" in text or "tired" in text or "capek" in text:
        return "🔥 Bangun bro! 5 menit belajar lebih baik daripada rebahan seharian!"
    
    # Check for greetings
    elif "halo" in text or "hello" in text or "hi" in text:
        return "👋 Halo sahabat coding! Siap bikin proyek seru hari ini?"
        
    # Check for toxic words
    elif "jelek" in text or "bodoh" in text:
        return "⚠️ Jaga ketikanmu ya bro! Mari saling menyemangati 🤝"
        
    else:
        return f"🦜 Beo Bot: '{user_message}'"

print("Test 1:", bot_respond("Aduh capek banget belajar"))
print("Test 2:", bot_respond("HALO bot apa kabar"))
print("Test 3:", bot_respond("Dasar bot jelek"))
print("Test 4:", bot_respond("Hari ini cuaca cerah ya"))</textarea></div><div class="ide-window"><div class="ide-head" style="background:#E2E8F0;color:#475569">Terminal Output</div><div id="python-output" class="output">Click 'Run Simulation' to test bot responses…</div></div></div><button id="run-btn" class="run" disabled>Loading Python… ⏳</button>`,

// Slide 9: Building the Motivational Responder in Telebot
code('orange','Connecting to Telegram Bot',`<span class="kw">@bot.message_handler</span>(<span class="var">func</span>=<span class="kw">lambda</span> <span class="var">msg</span>: <span class="kw">True</span>)<br><span class="kw">def</span> <span class="fn">handle_chat</span>(<span class="var">message</span>):<br>    <span class="var">text</span> = <span class="var">message</span>.<span class="var">text</span>.<span class="fn">lower</span>()<br>    <br>    <span class="kw">if</span> <span class="str">"mager"</span> <span class="kw">in</span> <span class="var">text</span> <span class="kw">or</span> <span class="str">"capek"</span> <span class="kw">in</span> <span class="var">text</span>:<br>        <span class="var">bot</span>.<span class="fn">reply_to</span>(<span class="var">message</span>, <span class="str">"💪 Jangan menyerah! Istirahat 5 menit, lalu lanjut lagi!"</span>)<br>    <span class="kw">elif</span> <span class="str">"pagi"</span> <span class="kw">in</span> <span class="var">text</span>:<br>        <span class="var">bot</span>.<span class="fn">reply_to</span>(<span class="var">message</span>, <span class="str">"☀️ Selamat pagi! Hari yang hebat untuk belajar!"</span>)<br>    <span class="kw">else</span>:<br>        <span class="var">bot</span>.<span class="fn">reply_to</span>(<span class="var">message</span>, <span class="str">f"🤖 Aku mendengar: '{message.text}'"</span>)`,'Notice how the bot replies with customized emotions based on what the user said!'),

// Slide 10: Anti-Toxic Filter Design
cards('pink','Designing the Anti-Toxic Filter','Help create a friendly, positive atmosphere in group chats.',[['🚫','Toxic List','var(--pink)','bad_words = ["kasar1", "kasar2", "jelek"]'],['🔎','For Loop Check','var(--orange)','Iterate through the list to catch any violation.'],['🚨','Gentle Warning','var(--purple)','Send a reminder to keep the chat respectful.']]),

// Slide 11: Multi-word Filter Code
code('purple','List-based Toxic Detection',`<span class="var">bad_words</span> = [<span class="str">"bodoh"</span>, <span class="str">"jelek"</span>, <span class="str">"malas"</span>]<br><br><span class="kw">@bot.message_handler</span>(<span class="var">func</span>=<span class="kw">lambda</span> <span class="var">msg</span>: <span class="kw">True</span>)<br><span class="kw">def</span> <span class="fn">filter_chat</span>(<span class="var">message</span>):<br>    <span class="var">text</span> = <span class="var">message</span>.<span class="var">text</span>.<span class="fn">lower</span>()<br>    <br>    <span class="kw">for</span> <span class="var">bad</span> <span class="kw">in</span> <span class="var">bad_words</span>:<br>        <span class="kw">if</span> <span class="var">bad</span> <span class="kw">in</span> <span class="var">text</span>:<br>            <span class="var">bot</span>.<span class="fn">reply_to</span>(<span class="var">message</span>, <span class="str">"⚠️ Tolong gunakan kata-kata yang baik ya sahabat!"</span>)<br>            <span class="kw">return</span> <span class="comment"># Stop checking further</span><br>            <br>    <span class="var">bot</span>.<span class="fn">reply_to</span>(<span class="var">message</span>, <span class="str">f"✨ Menarik! Kamu bilang: {message.text}"</span>)`,'The "return" keyword immediately finishes the function once a bad word is caught.'),

// Slide 12: You Do - Hands-on Mission
`<span class="tag purple">Hands-on Mission (30 Mins)</span><h2>Build Your Smart Responder Personality! 🌟</h2><div class="cards"><div class="card"><h3>Level 1: Mood Booster</h3><p>Detect 3 study mood words (e.g. <em>"ujian"</em>, <em>"pr"</em>, <em>"ngantuk"</em>) with helpful advice.</p></div><div class="card"><h3>Level 2: Slang Translator</h3><p>Detect slang words (e.g. <em>"otw"</em> -> <em>"On The Way"</em>, <em>"gws"</em> -> <em>"Get Well Soon"</em>).</p></div><div class="card"><h3>Level 3: Anti-Toxic Shield</h3><p>Build a list of 5 prohibited words with dynamic warning emojis.</p></div></div>`,

// Slide 13: Save Game Ritual
`<span class="tag blue">Save Game Ritual</span><h2>Commit & Sync to Cloud</h2><div class="steps"><div class="step"><span class="n" style="background:var(--pink)">1</span><p>Test your bot in Telegram with lowercase, UPPERCASE, and sentences.</p></div><div class="step"><span class="n" style="background:var(--purple)">2</span><p>Commit message: <code>feat: implement text responder and anti-toxic filter</code></p></div><div class="step"><span class="n" style="background:var(--blue)">3</span><p>Click <strong>Commit & Sync</strong> to save your progress in GitHub!</p></div></div>`,

// Slide 14: Next Meeting Preview
`<div class="col center full text-center"><span class="tag yellow" style="align-self:center">Meeting 09 Preview</span><h2>BOT 0: The Smart Calculator 🧮</h2><p class="lead">Next meeting, we will teach our bot to calculate math, split commands, and calculate discounts in seconds!</p><div style="font-size:7rem;margin-top:28px">➕ ➖ ✖️ ➗</div></div>`
];

const root=document.getElementById('root');root.innerHTML=slides.map((x,i)=>`<section class="slide${i===0?' active':''}" id="slide-${i+1}">${x}</section>`).join('');
const all=[...document.querySelectorAll('.slide')],prev=document.getElementById('prev'),next=document.getElementById('next'),page=document.getElementById('page'),total=document.getElementById('total'),progress=document.getElementById('progress');let current=0;total.textContent=all.length;
function indexFromHash(){const match=location.hash.match(/^#slide-(\d+)$/);if(!match)return 0;const index=Number(match[1])-1;return index>=0&&index<all.length?index:0}
function update(syncHash=true){all.forEach((x,i)=>x.classList.toggle('active',i===current));page.textContent=current+1;progress.style.width=`${(current+1)/all.length*100}%`;prev.disabled=current===0;const done=current===all.length-1;next.disabled=done;next.textContent=done?'Finish':'Next ➞';next.classList.toggle('primary',!done);if(syncHash&&location.hash!==`#slide-${current+1}`)history.replaceState(null,'',`#slide-${current+1}`)}
function move(d){if(current+d>=0&&current+d<all.length){current+=d;update()}}prev.onclick=()=>move(-1);next.onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.target.matches('textarea,input'))return;if(e.key==='ArrowRight'||e.key==='PageDown')move(1);if(e.key==='ArrowLeft'||e.key==='PageUp')move(-1)});window.addEventListener('hashchange',()=>{current=indexFromHash();update(false)});current=indexFromHash();update();

const run=document.getElementById('run-btn'),out=document.getElementById('python-output'),editor=document.getElementById('python-code');let ready=init();async function init(){try{const p=await loadPyodide();run.disabled=false;run.textContent='Run Simulation ▶';out.textContent='Python engine ready! Click the button above to execute.';return p}catch(e){run.textContent='Failed to load Python';out.textContent='Check internet connection.';out.style.color='var(--pink)';throw e}}
async function execute(){run.disabled=true;run.textContent='Running…';out.textContent='';try{const p=await ready,lines=[];p.setStdout({batched:m=>lines.push(m)});await p.runPythonAsync(editor.value);out.textContent=lines.join('\n')||'Code ran with no output.';out.style.color='#334155'}catch(e){out.textContent=`Oops, found a bug 🐛\n\n${e.message}`;out.style.color='var(--pink)'}finally{run.disabled=false;run.textContent='Run Simulation ▶'}}run.onclick=execute;
</script></body></html>
