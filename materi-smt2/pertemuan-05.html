<style>
:root{--bg:#F3EFE9;--slide:#FFFDF9;--yellow:#E8AA24;--orange:#EF6C35;--pink:#E0356D;--light-pink:#F47C9E;--purple:#9A53E0;--blue:#447EE0;--sky:#4AB2D9;--green:#48A850;--dark:#2A2A35;--muted:#6C6C82;--ide:#1E1E2E}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Poppins,sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}#app{width:96vw;max-width:1600px;display:flex;flex-direction:column;gap:20px}#deck{height:82vh;background:var(--slide);border-radius:40px;position:relative;overflow:hidden;box-shadow:0 25px 50px #2A2A3514}.slide{position:absolute;inset:0;padding:clamp(34px,5vw,70px);display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:scale(.95) translateY(20px);transition:opacity .6s,transform .6s cubic-bezier(.34,1.56,.64,1);overflow:auto}.slide.active{opacity:1;visibility:visible;transform:none;z-index:2}.slide::-webkit-scrollbar{width:16px}.slide::-webkit-scrollbar-thumb{background:#D8D8E5;border:5px solid var(--slide);border-radius:20px}h1,h2,h3{font-family:Fredoka,sans-serif;font-weight:700}h1{font-size:clamp(3rem,5.2vw,5.2rem);line-height:1.05}h2{font-size:clamp(2.2rem,3.7vw,3.8rem);line-height:1.12;margin-bottom:22px}h3{font-size:1.65rem;margin-bottom:10px}p,li,label{font-size:clamp(1rem,1.3vw,1.24rem);line-height:1.7;color:var(--muted);font-weight:500}.lead{font-size:clamp(1.15rem,1.6vw,1.45rem)}strong{color:var(--dark)}code{font-family:'Fira Code';color:var(--purple)}.row{display:flex}.col{display:flex;flex-direction:column}.center{align-items:center;justify-content:center}.half{width:50%}.full{min-height:100%}.gap{gap:clamp(25px,4vw,60px)}.text-center{text-align:center}.tag{align-self:flex-start;padding:9px 22px;border-radius:30px;font:700 1rem Fredoka;text-transform:uppercase;letter-spacing:.8px;margin-bottom:18px}.blue{background:#447EE01A;color:var(--blue)}.pink{background:#E0356D1A;color:var(--pink)}.purple{background:#9A53E01A;color:var(--purple)}.green{background:#48A8501A;color:var(--green)}.orange{background:#EF6C351A;color:var(--orange)}.yellow{background:#E8AA241A;color:#A56E00}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;margin-top:18px}.cards.two{grid-template-columns:repeat(2,1fr)}.card{background:#fff;padding:30px;border-radius:32px;box-shadow:0 15px 40px #0000000A;transition:.3s}.card:hover{transform:translateY(-7px)}.icon{width:74px;height:74px;border-radius:24px;display:grid;place-items:center;font-size:2.2rem;margin-bottom:18px}.scene{position:relative;min-height:350px;display:grid;place-items:center}.blob{width:min(320px,80%);animation:float 6s ease-in-out infinite;filter:drop-shadow(0 18px 18px #2A2A351A)}@keyframes float{50%{transform:translateY(-15px) rotate(2deg)}}.bubble{position:absolute;background:#fff;padding:18px 24px;border-radius:26px;box-shadow:0 15px 35px #00000012;font-weight:700;max-width:285px}.top{top:2%;right:0}.bottom{bottom:2%;left:0}.code{background:var(--ide);color:#F8F8F2;border-radius:24px;padding:24px;font:500 1.04rem/1.7 'Fira Code';white-space:pre-wrap;box-shadow:0 16px 36px #1E1E2E29}.fn{color:#50FA7B}.str{color:#F1FA8C}.var{color:#8BE9FD}.numc{color:#BD93F9}.kw{color:#FF79C6}.comment{color:#8D93B8}.steps{display:flex;flex-direction:column;gap:16px;margin-top:15px}.step{display:flex;align-items:center;gap:20px;background:#fff;padding:18px 24px;border-radius:50px;box-shadow:0 12px 30px #0000000A}.n{flex:0 0 48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 1.2rem Fredoka}.callout{padding:22px 27px;border-radius:25px;background:#E8AA241A;border-left:8px solid var(--yellow);margin-top:22px}.check{list-style:none}.check li{margin:12px 0;padding-left:34px;position:relative}.check li:before{content:'✓';position:absolute;left:0;color:var(--green);font-weight:800}.formula{font:700 clamp(2rem,4vw,4rem) Fredoka;color:var(--blue)}.flow{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;margin-top:30px}.flow-box{padding:24px 28px;background:#fff;border-radius:28px;box-shadow:0 12px 30px #0000000A;text-align:center;min-width:180px}.arrow{font-size:2.5rem;color:var(--orange)}.ide-wrap{display:flex;gap:20px;min-height:285px;flex:1}.ide-window{flex:1;border-radius:25px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 15px 40px #00000014}.ide-head{height:44px;display:flex;align-items:center;padding:0 18px;gap:8px;font-weight:600;background:#2D2D44;color:#fff}.dot{width:12px;height:12px;border-radius:50%}.editor{background:var(--ide);color:#A6E22E;padding:20px;font:500 .92rem/1.5 'Fira Code';flex:1;border:0;outline:0;resize:none}.output{background:#F8F9FA;border:4px dashed #E2E8F0;padding:20px;font:500 .92rem/1.5 'Fira Code';flex:1;color:#334155;overflow:auto;white-space:pre-wrap}.input-panel{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}.input-panel label{font-size:.85rem;color:var(--dark)}.answer{width:100%;padding:10px 13px;border:2px solid #D8D8E5;border-radius:14px;font:500 .95rem Poppins;outline:none}.answer:focus{border-color:var(--blue)}.run{align-self:center;margin-top:12px;background:var(--green);color:#fff;border:0;padding:13px 32px;border-radius:50px;font:700 1.15rem Fredoka;cursor:pointer;box-shadow:0 10px 25px #48A85055}.run:disabled{background:#CBD5E1;cursor:wait;box-shadow:none}#bar{display:flex;justify-content:space-between;align-items:center;padding:0 36px}.indicator{display:flex;align-items:center;gap:13px;font:700 1.15rem Fredoka}.logo{width:34px;height:34px;background:var(--pink);border-radius:12px;transform:rotate(15deg)}.nav{display:flex;gap:14px}.btn{border:0;border-radius:50px;padding:13px 34px;background:var(--dark);color:#fff;font:600 1.15rem Fredoka;cursor:pointer;box-shadow:0 10px 20px #2A2A3526}.primary{background:var(--blue)}.btn:disabled{background:#D8D8E5;color:#A0A0B5;box-shadow:none}.track{position:absolute;bottom:0;width:100%;height:7px;background:#EEEAF0;z-index:5}.progress{height:100%;background:linear-gradient(90deg,var(--pink),var(--blue));transition:.35s}.badge{display:grid;place-items:center;width:58px;height:58px;border-radius:20px;background:var(--purple);color:#fff;font:700 1.6rem Fredoka;margin-bottom:16px}@media(max-width:800px){#deck{height:80vh;border-radius:25px}.slide{padding:28px}.row{flex-direction:column}.half{width:100%}.scene{min-height:225px}.blob{width:180px}.cards,.cards.two,.input-panel{grid-template-columns:1fr}.card{padding:22px}.ide-wrap{flex-direction:column}.ide-window{min-height:210px}#bar{padding:0 8px}.btn{padding:11px 18px}.bubble{font-size:.8rem}.flow{gap:10px}.flow-box{padding:15px;min-width:130px}}
</style>
</head>
<body><main id="app"><section id="deck"><div id="root"></div><div class="track"><div id="progress" class="progress"></div></div></section><nav id="bar" aria-label="Slide navigation"><div class="indicator"><span class="logo"></span>Page <span id="page">1</span> / <span id="total">54</span></div><div class="nav"><button id="prev" class="btn">Back</button><button id="next" class="btn primary">Next ➞</button></div></nav></main>
<script>
const blob=(c='var(--blue)')=>`<svg class="blob" viewBox="0 0 320 320" aria-label="Friendly Blob character"><path d="M65 82C103 25 225 30 266 88c35 49 23 153-30 190-48 34-154 23-190-28C10 200 27 139 65 82Z" fill="${c}"/><ellipse cx="125" cy="145" rx="24" ry="35" fill="white"/><ellipse cx="205" cy="145" rx="24" ry="35" fill="white"/><circle cx="132" cy="151" r="14" fill="#20202A"/><circle cx="198" cy="151" r="14" fill="#20202A"/><circle cx="127" cy="145" r="4" fill="white"/><circle cx="193" cy="145" r="4" fill="white"/><path d="M135 211q25 22 50 0" fill="none" stroke="#20202A" stroke-width="9" stroke-linecap="round"/></svg>`;
const split=(tag,title,text,art,c='var(--blue)')=>`<div class="row center full gap"><div class="half col"><span class="tag ${tag}">${tag}</span><h2>${title}</h2><p class="lead">${text}</p></div><div class="half scene">${art||blob(c)}</div></div>`;
const cards=(tag,title,intro,items)=>`<span class="tag ${tag}">${tag}</span><h2>${title}</h2><p class="lead">${intro}</p><div class="cards">${items.map(x=>`<article class="card"><div class="icon" style="background:${x[2]}1A;color:${x[2]}">${x[0]}</div><h3>${x[1]}</h3><p>${x[3]}</p></article>`).join('')}</div>`;
const code=(tag,title,body,note)=>`<span class="tag ${tag}">Python Code</span><h2>${title}</h2><div class="code">${body}</div><div class="callout"><p>${note}</p></div>`;
const slides=[
`<div class="row center full gap"><div class="half"><span class="tag pink">Meeting 05</span><h1>Python Makes<br><span style="color:var(--blue)">Decisions</span></h1><p class="lead" style="margin-top:22px">Use Boolean questions and branches to make programs choose what happens next.</p></div><div class="half scene">${blob('var(--pink)')}<div class="bubble top">Is it true or false?</div><div class="bubble bottom">I can choose a path! 🛤️</div></div></div>`,
cards('blue','Today’s Mission','We will teach Byte to inspect a situation before responding.',[['✅','Boolean','var(--green)','Represent True or False.'],['🔎','Comparison','var(--blue)','Ask questions about values.'],['🛤️','Branching','var(--pink)','Choose code with if, elif, and else.']]),
split('pink','Two Doors, One Choice','Byte reaches two doors. The blue door opens for students aged 17 or older. Which door should Byte choose?',`${blob('var(--pink)')}<div class="bubble top">age = 16</div><div class="bubble bottom">Which way?</div>`,'var(--pink)'),
`<div class="col center full text-center"><span class="tag green" style="align-self:center">Learning Goals</span><h2>By the End, You Can…</h2><ul class="check" style="text-align:left"><li>Explain Boolean values in your own words.</li><li>Build comparison questions.</li><li>Write correctly indented if, elif, and else blocks.</li><li>Create a small number-guessing program.</li></ul></div>`,
`<div class="col center full text-center"><span class="tag purple" style="align-self:center">Subtopic 1</span><h2>Boolean Values</h2><p class="lead">A data type with only two possible values.</p><div class="formula" style="margin-top:28px;color:var(--purple)">True &nbsp; | &nbsp; False</div></div>`,
cards('purple','Yes-or-No Facts','Many everyday statements can be checked as true or false.',[['🌧️','Is It Raining?','var(--blue)','True when rain is falling.'],['🔋','Is Battery Empty?','var(--orange)','False when power remains.'],['🔐','Is Password Correct?','var(--green)','True only when it matches.']]),
split('purple','Analogy: A Light Switch','A switch has two clear states: on or off. A Boolean also stores one of two states: True or False.',`<div style="font-size:8rem">💡 🎚️</div>`,'var(--purple)'),
code('purple','Boolean Variables',`<span class="var">is_raining</span> = <span class="kw">True</span><br><span class="var">homework_done</span> = <span class="kw">False</span><br><br><span class="fn">print</span>(<span class="var">is_raining</span>)`,'Python writes True and False with capital first letters and without quotation marks.'),
code('pink','Common Boolean Bugs',`<span class="var">ready</span> = <span style="color:#FF5555">true</span> <span class="comment"># NameError</span><br><span class="var">ready</span> = <span class="str">"True"</span> <span class="comment"># String, not Boolean</span>`,'Use the exact Boolean value True, not lowercase true and not the text "True".'),
`<span class="tag green">Quick Check</span><h2>Boolean or Not?</h2><div class="cards"><div class="card"><h3>False</h3><p><strong>Boolean</strong></p></div><div class="card"><h3>"False"</h3><p><strong>String</strong></p></div><div class="card"><h3>0</h3><p><strong>Integer</strong></p></div></div>`,
code('purple','Check a Type',`<span class="var">game_over</span> = <span class="kw">False</span><br><span class="fn">print</span>(<span class="fn">type</span>(<span class="var">game_over</span>))<br><span class="comment"># &lt;class 'bool'&gt;</span>`,'The official Python type name for Boolean is bool.'),
split('blue','Where Do Booleans Come From?','We can write True directly, but comparisons can produce Boolean results automatically.',`${blob('var(--blue)')}<div class="bubble top">14 &gt;= 13</div><div class="bubble bottom">True!</div>`),
`<div class="col center full text-center"><span class="tag blue" style="align-self:center">Subtopic 2</span><h2>Comparison Questions</h2><p class="lead">Python compares two values and answers True or False.</p><div class="formula" style="margin-top:28px">left value &nbsp; ? &nbsp; right value</div></div>`,
cards('blue','Comparison Operators','Read each symbol as a question.',[['==','Equal To','var(--green)','Are both values equal?'],['!=','Not Equal To','var(--pink)','Are the values different?'],['>','Greater Than','var(--orange)','Is the left value larger?']]),
cards('blue','More Comparisons','The equal sign can be added to include the boundary.',[['<','Less Than','var(--blue)','Is the left value smaller?'],['>=','At Least','var(--purple)','Greater than or equal to.'],['<=','At Most','var(--yellow)','Less than or equal to.']]),
split('blue','Analogy: Height Checker','A ride requires height of at least 140 cm. The checker asks height >= 140 before opening the gate.',`<div style="font-size:8rem">🎢📏</div>`),
code('blue','Comparisons Return Boolean',`<span class="fn">print</span>(<span class="numc">15</span> &gt; <span class="numc">12</span>) <span class="comment"># True</span><br><span class="fn">print</span>(<span class="numc">15</span> == <span class="numc">12</span>) <span class="comment"># False</span><br><span class="fn">print</span>(<span class="numc">15</span> != <span class="numc">12</span>) <span class="comment"># True</span>`,'Each comparison becomes one Boolean result.'),
code('blue','Compare Variables',`<span class="var">age</span> = <span class="numc">16</span><br><span class="var">can_apply</span> = <span class="var">age</span> &gt;= <span class="numc">17</span><br><span class="fn">print</span>(<span class="var">can_apply</span>) <span class="comment"># False</span>`,'The result of a comparison can be saved in a Boolean variable.'),
code('pink','One Equals or Two?',`<span class="var">score</span> = <span class="numc">10</span> <span class="comment"># assign 10</span><br><span class="var">score</span> == <span class="numc">10</span> <span class="comment"># ask if equal</span>`,'One equals sign assigns a value. Two equals signs compare values.'),
`<span class="tag green">Predict First</span><h2>What Will Python Answer?</h2><div class="cards"><div class="card"><h3>8 &lt; 10</h3><p><strong>True</strong></p></div><div class="card"><h3>8 &gt;= 8</h3><p><strong>True</strong></p></div><div class="card"><h3>"cat" == "Cat"</h3><p><strong>False</strong></p></div></div>`,
code('blue','Strings Can Be Compared',`<span class="var">answer</span> = <span class="str">"python"</span><br><span class="fn">print</span>(<span class="var">answer</span> == <span class="str">"python"</span>) <span class="comment"># True</span><br><span class="fn">print</span>(<span class="var">answer</span> == <span class="str">"Python"</span>) <span class="comment"># False</span>`,'String comparison is case-sensitive: uppercase and lowercase letters are different.'),
split('orange','A Question Is Not Enough','Byte can answer True or False, but now we want different actions for different answers.',`${blob('var(--orange)')}<div class="bubble top">If True… do this!</div>`,'var(--orange)'),
`<div class="col center full text-center"><span class="tag orange" style="align-self:center">Subtopic 3</span><h2>The if Statement</h2><p class="lead">Run a block of code only when a condition is True.</p><div class="formula" style="margin-top:28px;color:var(--orange)">if condition:</div></div>`,
`<span class="tag orange">Decision Flow</span><h2>How if Works</h2><div class="flow"><div class="flow-box"><h3>Ask</h3><p>age &gt;= 17</p></div><div class="arrow">➜</div><div class="flow-box"><h3>True?</h3><p>Check result</p></div><div class="arrow">➜</div><div class="flow-box"><h3>Run</h3><p>Indented block</p></div></div><div class="callout"><p>If the answer is False, Python skips the indented block.</p></div>`,
split('orange','Analogy: School Gate','If a student shows a valid card, the gate opens. Otherwise, the gate does nothing yet.',`<div style="font-size:8rem">🎫 ➜ 🚪</div>`,'var(--orange)'),
code('orange','First if Statement',`<span class="var">age</span> = <span class="numc">18</span><br><br><span class="kw">if</span> <span class="var">age</span> &gt;= <span class="numc">17</span>:<br>    <span class="fn">print</span>(<span class="str">"You can apply for a driving licence."</span>)`,'The colon starts the branch. The four spaces before print() show that it belongs inside the if block.'),
code('orange','Indentation Has Meaning',`<span class="kw">if</span> <span class="var">weather</span> == <span class="str">"rainy"</span>:<br>    <span class="fn">print</span>(<span class="str">"Bring an umbrella."</span>)<br><span class="fn">print</span>(<span class="str">"Have a great day!"</span>)`,'The first print is conditional. The second print is outside the branch, so it always runs.'),
code('pink','Bug: Missing Indentation',`<span class="kw">if</span> <span class="var">score</span> &gt;= <span class="numc">75</span>:<br><span style="color:#FF5555"><span class="fn">print</span>(<span class="str">"Passed"</span>)</span><br><span class="comment"># IndentationError</span>`,'Python expects an indented block after a line ending with a colon.'),
code('pink','Bug: Missing Colon',`<span class="kw">if</span> <span class="var">score</span> &gt;= <span class="numc">75</span><span style="color:#FF5555"> ◀</span><br>    <span class="fn">print</span>(<span class="str">"Passed"</span>)`,'Every if condition ends with a colon.'),
`<span class="tag green">Trace the Code</span><h2>Which Lines Run?</h2><div class="code"><span class="var">coins</span> = <span class="numc">5</span><br><span class="kw">if</span> <span class="var">coins</span> &gt;= <span class="numc">10</span>:<br>    <span class="fn">print</span>(<span class="str">"Buy the cape"</span>)<br><span class="fn">print</span>(<span class="str">"Visit complete"</span>)</div><div class="callout"><p>Only <strong>Visit complete</strong> appears because the condition is False.</p></div>`,
split('pink','What About Every Other Case?','An if block handles one path. else gives us a fallback, and elif checks extra choices.',`${blob('var(--pink)')}<div class="bubble top">True path or fallback?</div>`,'var(--pink)'),
`<div class="col center full text-center"><span class="tag pink" style="align-self:center">Subtopic 4</span><h2>elif and else</h2><p class="lead">Build two-way and multi-way decisions.</p><div class="formula" style="margin-top:28px;color:var(--pink)">if ➜ elif ➜ else</div></div>`,
code('pink','Two-Way Decision',`<span class="kw">if</span> <span class="var">age</span> &gt;= <span class="numc">17</span>:<br>    <span class="fn">print</span>(<span class="str">"You can apply."</span>)<br><span class="kw">else</span>:<br>    <span class="fn">print</span>(<span class="str">"You need to wait a little longer."</span>)`,'Exactly one branch runs: the if block when True, otherwise the else block.'),
code('pink','Three-Way Decision',`<span class="kw">if</span> <span class="var">score</span> &gt;= <span class="numc">90</span>:<br>    <span class="fn">print</span>(<span class="str">"Excellent"</span>)<br><span class="kw">elif</span> <span class="var">score</span> &gt;= <span class="numc">75</span>:<br>    <span class="fn">print</span>(<span class="str">"Passed"</span>)<br><span class="kw">else</span>:<br>    <span class="fn">print</span>(<span class="str">"Keep practising"</span>)`,'Python checks from top to bottom and stops at the first True branch.'),
`<span class="tag blue">Order Matters</span><h2>Check the Hardest Rule First</h2><div class="cards two"><div class="card"><h3 style="color:var(--green)">Good Order</h3><p>Check score &gt;= 90 before score &gt;= 75.</p></div><div class="card"><h3 style="color:var(--pink)">Bad Order</h3><p>If &gt;= 75 comes first, a score of 95 never reaches the excellent branch.</p></div></div>`,
code('purple','Input Joins the Decision',`<span class="var">age</span> = <span class="fn">int</span>(<span class="fn">input</span>(<span class="str">"How old are you? "</span>))<br><br><span class="kw">if</span> <span class="var">age</span> &gt;= <span class="numc">17</span>:<br>    <span class="fn">print</span>(<span class="str">"You can apply."</span>)<br><span class="kw">else</span>:<br>    <span class="fn">print</span>(<span class="str">f"Wait {17 - age} more year(s)."</span>)`,'input() collects text, int() converts it, and if decides which reply to show.'),
`<span class="tag green">Interactive Python Arena</span><h2>Driving Licence Checker</h2><div class="ide-wrap"><div class="ide-window"><div class="ide-head"><i class="dot" style="background:#FF5F56"></i><i class="dot" style="background:#FFBD2E"></i><i class="dot" style="background:#27C93F"></i><span>main.py</span></div><textarea id="python-code" class="editor" spellcheck="false">age = int(input("How old are you? "))

if age >= 17:
    print("You can apply for a driving licence.")
else:
    years_left = 17 - age
    print(f"Wait {years_left} more year(s).")</textarea></div><div class="ide-window"><div class="ide-head" style="background:#E2E8F0;color:#475569">Terminal Output</div><div id="python-output" class="output">Preparing Python engine…</div></div></div><div class="input-panel" style="grid-template-columns:1fr"><label>Your age<input id="answer-1" class="answer" value="16"></label></div><button id="run-btn" class="run" disabled>Loading Python… ⏳</button>`,
`<span class="tag green">Code Breakdown</span><h2>Four Jobs in One Program</h2><div class="steps"><div class="step"><span class="n" style="background:var(--blue)">1</span><p><strong>Input:</strong> ask for age.</p></div><div class="step"><span class="n" style="background:var(--purple)">2</span><p><strong>Convert:</strong> turn text into Integer.</p></div><div class="step"><span class="n" style="background:var(--orange)">3</span><p><strong>Compare:</strong> ask whether age is at least 17.</p></div><div class="step"><span class="n" style="background:var(--green)">4</span><p><strong>Branch:</strong> display the matching reply.</p></div></div>`,

const root=document.getElementById('root');root.innerHTML=slides.map((x,i)=>`<section class="slide${i===0?' active':''}" id="slide-${i+1}">${x}</section>`).join('');
const all=[...document.querySelectorAll('.slide')],prev=document.getElementById('prev'),next=document.getElementById('next'),page=document.getElementById('page'),total=document.getElementById('total'),progress=document.getElementById('progress');let current=0;total.textContent=all.length;
function indexFromHash(){const match=location.hash.match(/^#slide-(\d+)$/);if(!match)return 0;const index=Number(match[1])-1;return index>=0&&index<all.length?index:0}
function update(syncHash=true){all.forEach((x,i)=>x.classList.toggle('active',i===current));page.textContent=current+1;progress.style.width=`${(current+1)/all.length*100}%`;prev.disabled=current===0;const done=current===all.length-1;next.disabled=done;next.textContent=done?'Finish':'Next ➞';next.classList.toggle('primary',!done);if(syncHash&&location.hash!==`#slide-${current+1}`)history.replaceState(null,'',`#slide-${current+1}`)}
function move(d){if(current+d>=0&&current+d<all.length){current+=d;update()}}prev.onclick=()=>move(-1);next.onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.target.matches('textarea,input'))return;if(e.key==='ArrowRight'||e.key==='PageDown')move(1);if(e.key==='ArrowLeft'||e.key==='PageUp')move(-1)});window.addEventListener('hashchange',()=>{current=indexFromHash();update(false)});current=indexFromHash();update();
const run=document.getElementById('run-btn'),out=document.getElementById('python-output'),editor=document.getElementById('python-code');let ready=init();async function init(){try{const p=await loadPyodide();run.disabled=false;run.textContent='Run Code ▶';out.textContent='Python ready! Enter an age, then run the code.';return p}catch(e){run.textContent='Failed to load Python';out.textContent='Check your internet connection, then reload.';out.style.color='var(--pink)';throw e}}
async function execute(){run.disabled=true;run.textContent='Running…';out.textContent='';try{const p=await ready,lines=[],answers=[document.getElementById('answer-1').value];p.setStdout({batched:m=>lines.push(m)});const setup=`import builtins\n__browser_answers = iter(${JSON.stringify(answers)})\ndef __browser_input(prompt=''):\n    print(prompt, end='')\n    return next(__browser_answers)\nbuiltins.input = __browser_input\n`;await p.runPythonAsync(setup+editor.value);out.textContent=lines.join('\n')||'Code ran successfully with no output.';out.style.color='#334155'}catch(e){out.textContent=`Oops, found a bug 🐛\n\n${e.message}`;out.style.color='var(--pink)'}finally{run.disabled=false;run.textContent='Run Code ▶'}}run.onclick=execute;
</script></body></html>
