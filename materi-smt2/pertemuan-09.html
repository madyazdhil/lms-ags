code('purple','Splitting the Chat String',`<span class="var">chat_text</span> = <span class="str">"/tambah 50 25"</span><br><span class="var">parts</span> = <span class="var">chat_text</span>.<span class="fn">split</span>()<br><br><span class="fn">print</span>(<span class="var">parts</span>)      <span class="comment"># ['/tambah', '50', '25']</span><br><span class="fn">print</span>(<span class="var">parts</span>[<span class="numc">0</span>])   <span class="comment"># '/tambah'</span><br><span class="fn">print</span>(<span class="var">parts</span>[<span class="numc">1</span>])   <span class="comment"># '50'</span><br><span class="fn">print</span>(<span class="var">parts</span>[<span class="numc">2</span>])   <span class="comment"># '25'</span>`,'parts[1] and parts[2] are still Strings! We must wrap them in float() or int().'),

// Slide 7: Interactive Pyodide Sandbox
`<span class="tag green">Interactive Python Arena</span><h2>Test .split() & Calculation Logic</h2><div class="ide-wrap"><div class="ide-window"><div class="ide-head"><i class="dot" style="background:#FF5F56"></i><i class="dot" style="background:#FFBD2E"></i><i class="dot" style="background:#27C93F"></i><span>calc_logic.py</span></div><textarea id="python-code" class="editor" spellcheck="false">def process_calc(chat_message):
    parts = chat_message.split()
    cmd = parts[0]
    
    if len(parts) < 3:
        return "⚠️ Format salah! Contoh: /tambah 10 20"
        
    num1 = float(parts[1])
    num2 = float(parts[2])
    
    if cmd == "/tambah":
        return f"💡 {num1} + {num2} = {num1 + num2:g}"
    elif cmd == "/kali":
        return f"💡 {num1} × {num2} = {num1 * num2:g}"
    elif cmd == "/bagi":
        if num2 == 0:
            return "❌ Error: Angka tidak bisa dibagi 0!"
        return f"💡 {num1} ÷ {num2} = {num1 / num2:g}"

print(process_calc("/tambah 15.5 10"))
print(process_calc("/kali 12 5"))
print(process_calc("/bagi 100 0"))
print(process_calc("/bagi 100 4"))</textarea></div><div class="ide-window"><div class="ide-head" style="background:#E2E8F0;color:#475569">Terminal Output</div><div id="python-output" class="output">Click 'Run Simulation' to test calculator…</div></div></div><button id="run-btn" class="run" disabled>Loading Python… ⏳</button>`,

code('blue','The /tambah Command Handler',`<span class="kw">@bot.message_handler</span>(<span class="var">commands</span>=[<span class="str">'tambah'</span>])<br><span class="kw">def</span> <span class="fn">handle_add</span>(<span class="var">message</span>):<br>    <span class="var">parts</span> = <span class="var">message</span>.<span class="var">text</span>.<span class="fn">split</span>()<br>    <span class="kw">if</span> <span class="fn">len</span>(<span class="var">parts</span>) != <span class="numc">3</span>:<br>        <span class="var">bot</span>.<span class="fn">reply_to</span>(<span class="var">message</span>, <span class="str">"⚠️ Format: /tambah [angka1] [angka2]\nContoh: /tambah 10 20"</span>)<br>        <span class="kw">return</span><br>        <br>    <span class="var">hasil</span> = <span class="fn">float</span>(<span class="var">parts</span>[<span class="numc">1</span>]) + <span class="fn">float</span>(<span class="var">parts</span>[<span class="numc">2</span>])<br>    <span class="var">bot</span>.<span class="fn">reply_to</span>(<span class="var">message</span>, <span class="str">f"✅ Hasil: **{hasil:g}**"</span>, <span class="var">parse_mode</span>=<span class="str">"Markdown"</span>)`,'The formatting :g automatically cleans up unnecessary trailing zeros like 30.0 -> 30!'),

// Slide 9: The Zero Division Shield
cards('pink','Handling Division by Zero','In mathematics and programming, dividing by 0 crashes the server!',[['💥','10 / 0','var(--pink)','ZeroDivisionError will stop your bot instantly!'],['🛡️','The If Check','var(--green)','Check if num2 == 0 BEFORE doing the division.'],['💬','Polite Message','var(--blue)','Tell the user: "Cannot divide by zero!"']]),

code('green','Building the /diskon Command',`<span class="kw">@bot.message_handler</span>(<span class="var">commands</span>=[<span class="str">'diskon'</span>])<br><span class="kw">def</span> <span class="fn">handle_discount</span>(<span class="var">message</span>):<br>    <span class="var">parts</span> = <span class="var">message</span>.<span class="var">text</span>.<span class="fn">split</span>()<br>    <span class="kw">if</span> <span class="fn">len</span>(<span class="var">parts</span>) != <span class="numc">3</span>:<br>        <span class="var">bot</span>.<span class="fn">reply_to</span>(<span class="var">message</span>, <span class="str">"⚠️ Format: /diskon [harga] [persen]\nContoh: /diskon 100000 20"</span>)<br>        <span class="kw">return</span><br>        <br>    <span class="var">harga</span> = <span class="fn">float</span>(<span class="var">parts</span>[<span class="numc">1</span>])<br>    <span class="var">persen</span> = <span class="fn">float</span>(<span class="var">parts</span>[<span class="numc">2</span>])<br>    <span class="var">hemat</span> = <span class="var">harga</span> * (<span class="var">persen</span> / <span class="numc">100</span>)<br>    <span class="var">bayar</span> = <span class="var">harga</span> - <span class="var">hemat</span><br>    <br>    <span class="var">reply</span> = <span class="str">f"""🏷️ **STRUK DISKON BELANJA:**<br>• Harga Asli: Rp {harga:,.0f}<br>• Diskon ({persen}%): -Rp {hemat:,.0f}<br>• **Total Bayar: Rp {bayar:,.0f}** 💰"""</span><br>    <span class="var">bot</span>.<span class="fn">reply_to</span>(<span class="var">message</span>, <span class="var">reply</span>, <span class="var">parse_mode</span>=<span class="str">"Markdown"</span>)`,'Notice the neat thousand-separator formatting with {:,.0f} (e.g. 100000 -> 100,000)!'),

const root=document.getElementById('root');root.innerHTML=slides.map((x,i)=>`<section class="slide${i===0?' active':''}" id="slide-${i+1}">${x}</section>`).join('');
const all=[...document.querySelectorAll('.slide')],prev=document.getElementById('prev'),next=document.getElementById('next'),page=document.getElementById('page'),total=document.getElementById('total'),progress=document.getElementById('progress');let current=0;total.textContent=all.length;
function indexFromHash(){const match=location.hash.match(/^#slide-(\d+)$/);if(!match)return 0;const index=Number(match[1])-1;return index>=0&&index<all.length?index:0}
function update(syncHash=true){all.forEach((x,i)=>x.classList.toggle('active',i===current));page.textContent=current+1;progress.style.width=`${(current+1)/all.length*100}%`;prev.disabled=current===0;const done=current===all.length-1;next.disabled=done;next.textContent=done?'Finish':'Next ➞';next.classList.toggle('primary',!done);if(syncHash&&location.hash!==`#slide-${current+1}`)history.replaceState(null,'',`#slide-${current+1}`)}
function move(d){if(current+d>=0&&current+d<all.length){current+=d;update()}}prev.onclick=()=>move(-1);next.onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.target.matches('textarea,input'))return;if(e.key==='ArrowRight'||e.key==='PageDown')move(1);if(e.key==='ArrowLeft'||e.key==='PageUp')move(-1)});window.addEventListener('hashchange',()=>{current=indexFromHash();update(false)});current=indexFromHash();update();

const run=document.getElementById('run-btn'),out=document.getElementById('python-output'),editor=document.getElementById('python-code');let ready=init();async function init(){try{const p=await loadPyodide();run.disabled=false;run.textContent='Run Simulation ▶';out.textContent='Python engine ready! Click the button above to execute.';return p}catch(e){run.textContent='Failed to load Python';out.textContent='Check internet connection.';out.style.color='var(--pink)';throw e}}
async function execute(){run.disabled=true;run.textContent='Running…';out.textContent='';try{const p=await ready,lines=[];p.setStdout({batched:m=>lines.push(m)});await p.runPythonAsync(editor.value);out.textContent=lines.join('\n')||'Code ran with no output.';out.style.color='#334155'}catch(e){out.textContent=`Oops, found a bug 🐛\n\n${e.message}`;out.style.color='var(--pink)'}finally{run.disabled=false;run.textContent='Run Simulation ▶'}}run.onclick=execute;
