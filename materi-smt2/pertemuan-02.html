<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Meeting 02 — Sync Ritual & Data Boxes</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;500;600;800&family=Fira+Code:wght@500&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
<style>
:root{--bg-workspace:#F3EFE9;--bg-slide:#FFFDF9;--c-yellow:#E8AA24;--c-orange:#EF6C35;--c-pink:#E0356D;--c-purple:#9A53E0;--c-blue:#447EE0;--c-light-blue:#4AB2D9;--c-green:#48A850;--text-dark:#2A2A35;--text-muted:#6C6C82;--ide-bg:#1E1E2E;--ide-text:#A6E22E}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Poppins,sans-serif;background:var(--bg-workspace);color:var(--text-dark);min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center}#app-wrapper{width:96vw;max-width:1600px;display:flex;flex-direction:column;gap:20px;align-items:center}#presentation-container{width:100%;height:82vh;background:var(--bg-slide);position:relative;border-radius:40px;overflow:hidden;box-shadow:0 25px 50px -12px #2A2A3514}.slide{position:absolute;inset:0;padding:clamp(34px,5vw,70px);display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:scale(.95) translateY(20px);transition:opacity .6s,transform .6s cubic-bezier(.34,1.56,.64,1);overflow:auto}.slide.active{opacity:1;visibility:visible;transform:none;z-index:2}.slide::-webkit-scrollbar{width:16px}.slide::-webkit-scrollbar-thumb{background:#D8D8E5;border:5px solid var(--bg-slide);border-radius:20px}h1,h2,h3,h4{font-family:Fredoka,sans-serif;font-weight:700}h1{font-size:clamp(3rem,5.2vw,5.2rem);line-height:1.05}h2{font-size:clamp(2.2rem,3.7vw,3.8rem);line-height:1.12;margin-bottom:22px}h3{font-size:1.65rem;margin-bottom:10px}p,li{font-size:clamp(1rem,1.3vw,1.24rem);line-height:1.7;color:var(--text-muted);font-weight:500}.lead{font-size:clamp(1.15rem,1.6vw,1.45rem)}strong{color:var(--text-dark)}code{font-family:'Fira Code';color:var(--c-purple)}.row{display:flex}.col{display:flex;flex-direction:column}.center{align-items:center;justify-content:center}.h-full{min-height:100%}.w-half{width:50%}.gap{gap:clamp(24px,4vw,60px)}.text-center{text-align:center}.tag-pill{align-self:flex-start;padding:9px 22px;border-radius:30px;font-family:Fredoka;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:18px}.tag-blue{background:#447EE01A;color:var(--c-blue)}.tag-pink{background:#E0356D1A;color:var(--c-pink)}.tag-purple{background:#9A53E01A;color:var(--c-purple)}.tag-green{background:#48A8501A;color:var(--c-green)}.tag-orange{background:#EF6C351A;color:var(--c-orange)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;width:100%;margin-top:18px}.cards.two{grid-template-columns:repeat(2,1fr)}.card{background:#fff;padding:30px;border-radius:32px;box-shadow:0 15px 40px #0000000A}.icon{width:74px;height:74px;border-radius:24px;display:grid;place-items:center;font-size:2.2rem;margin-bottom:18px}.steps{display:flex;flex-direction:column;gap:16px;width:100%;margin-top:15px}.step{display:flex;align-items:center;gap:20px;background:#fff;padding:18px 24px;border-radius:50px;box-shadow:0 12px 30px #0000000A}.num{flex:0 0 48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 1.2rem Fredoka}.scene{position:relative;min-height:360px;display:grid;place-items:center}.blob{width:min(320px,80%);animation:float 6s ease-in-out infinite;filter:drop-shadow(0 18px 18px #2A2A351A)}@keyframes float{50%{transform:translateY(-15px) rotate(2deg)}}.bubble{position:absolute;background:#fff;padding:18px 24px;border-radius:26px;box-shadow:0 15px 35px #00000012;font-weight:700;max-width:260px}.bubble.top{top:2%;right:0}.bubble.bottom{bottom:2%;left:0}.code{background:var(--ide-bg);color:#F8F8F2;border-radius:24px;padding:24px;font:500 1.1rem/1.7 'Fira Code';white-space:pre-wrap;box-shadow:0 16px 36px #1E1E2E29}.fn{color:#50FA7B}.str{color:#F1FA8C}.comment{color:#8D93B8}.var{color:#8BE9FD}.callout{padding:22px 27px;border-radius:25px;background:#E8AA241A;border-left:8px solid var(--c-yellow);margin-top:22px}.check{list-style:none}.check li{margin:12px 0;padding-left:34px;position:relative}.check li:before{content:'✓';position:absolute;left:0;color:var(--c-green);font-weight:800}.ide-container{display:flex;gap:24px;min-height:330px;width:100%;flex:1}.ide-window{flex:1;border-radius:25px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 15px 40px #00000014}.ide-header{height:45px;display:flex;align-items:center;padding:0 18px;gap:8px;font-weight:600;background:#2D2D44;color:#fff}.dot{width:12px;height:12px;border-radius:50%}.ide-editor{background:var(--ide-bg);color:var(--ide-text);padding:22px;font:500 1rem/1.55 'Fira Code';flex:1;border:0;outline:0;resize:none}.ide-output{background:#F8F9FA;border:4px dashed #E2E8F0;padding:22px;font:500 1rem/1.55 'Fira Code';flex:1;color:#334155;overflow:auto;white-space:pre-wrap}.btn-run{align-self:center;margin-top:16px;background:var(--c-green);color:#fff;border:0;padding:14px 34px;border-radius:50px;font:700 1.2rem Fredoka;cursor:pointer;box-shadow:0 10px 25px #48A85055}.btn-run:disabled{background:#CBD5E1;cursor:wait;box-shadow:none}#bottom-bar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:0 36px}.slide-indicator{display:flex;align-items:center;gap:13px;font:700 1.15rem Fredoka}.logo-mark{width:34px;height:34px;background:var(--c-pink);border-radius:12px;transform:rotate(15deg)}.nav-controls{display:flex;gap:14px}.btn{border:0;border-radius:50px;padding:13px 34px;background:var(--text-dark);color:#fff;font:600 1.15rem Fredoka;cursor:pointer;box-shadow:0 10px 20px #2A2A3526}.btn-primary{background:var(--c-blue)}.btn:disabled{background:#D8D8E5;color:#A0A0B5;box-shadow:none;cursor:not-allowed}.progress-track{position:absolute;left:0;bottom:0;width:100%;height:7px;background:#EEEAF0;z-index:5}.progress{height:100%;background:linear-gradient(90deg,var(--c-pink),var(--c-blue));transition:width .35s}.badge{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:20px;background:var(--c-purple);color:#fff;font:700 1.6rem Fredoka;margin-bottom:16px}.compare{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;margin-top:22px}.arrow{font-size:3rem;color:var(--c-blue)}
@media(max-width:800px){#presentation-container{height:80vh;border-radius:25px}.slide{padding:28px}.row{flex-direction:column}.w-half{width:100%}.scene{min-height:230px}.blob{width:180px}.cards,.cards.two,.compare{grid-template-columns:1fr}.arrow{transform:rotate(90deg);text-align:center}.card{padding:22px}.ide-container{flex-direction:column}.ide-window{min-height:220px}#bottom-bar{padding:0 8px}.btn{padding:11px 18px}.bubble{font-size:.8rem}}
</style></head><body><main id="app-wrapper"><section id="presentation-container" aria-label="Meeting 2 Materials"><div id="slides-root"></div><div class="progress-track"><div class="progress" id="progress"></div></div></section><nav id="bottom-bar" aria-label="Slide navigation"><div class="slide-indicator"><span class="logo-mark"></span>Page <span id="current-page">1</span> / <span id="total-page">50</span></div><div class="nav-controls"><button class="btn" id="prev-btn">Back</button><button class="btn btn-primary" id="next-btn">Next ➞</button></div></nav></main>
<script>
const blob=(color='var(--c-blue)')=>`<svg class="blob" viewBox="0 0 320 320" aria-hidden="true"><path d="M65 82C103 25 225 30 266 88c35 49 23 153-30 190-48 34-154 23-190-28C10 200 27 139 65 82Z" fill="${color}"/><ellipse cx="125" cy="145" rx="24" ry="35" fill="white"/><ellipse cx="205" cy="145" rx="24" ry="35" fill="white"/><circle cx="132" cy="151" r="14" fill="#20202A"/><circle cx="198" cy="151" r="14" fill="#20202A"/><circle cx="127" cy="145" r="4" fill="white"/><circle cx="193" cy="145" r="4" fill="white"/><path d="M135 211q25 22 50 0" fill="none" stroke="#20202A" stroke-width="9" stroke-linecap="round"/></svg>`;
const split=(tag,title,text,art,color='var(--c-blue)')=>`<div class="row center h-full gap"><div class="w-half col"><span class="tag-pill ${tag}">${tag.replace('tag-','')}</span><h2>${title}</h2><p class="lead">${text}</p></div><div class="w-half scene">${art||blob(color)}</div></div>`;
const cards=(tag,title,intro,items)=>`<span class="tag-pill ${tag}">${tag.replace('tag-','')}</span><h2>${title}</h2><p class="lead">${intro}</p><div class="cards">${items.map(x=>`<article class="card"><div class="icon" style="background:${x[2]}1A;color:${x[2]}">${x[0]}</div><h3>${x[1]}</h3><p>${x[3]}</p></article>`).join('')}</div>`;
const codeSlide=(tag,title,code,caption)=>`<span class="tag-pill ${tag}">Python Code</span><h2>${title}</h2><div class="code">${code}</div><div class="callout"><p>${caption}</p></div>`;
const slides=[
`<div class="row center h-full gap"><div class="w-half"><span class="tag-pill tag-pink">Meeting 02</span><h1>Sync <span style="color:var(--c-blue)">Ritual</span><br>& Data Boxes</h1><p class="lead" style="margin-top:22px">Saving progress like a save game, then creating magic boxes called variables.</p></div><div class="w-half scene">${blob('var(--c-purple)')}<div class="bubble top">Save successful! 💾</div><div class="bubble bottom">name = "Byte"</div></div></div>`,
cards('tag-blue','Today\'s Mission','Continuing our cloud base from the first meeting.',[['📝','Making Changes','var(--c-orange)','Modifying main.py and reading change indicators.'],['💾','Commit & Sync','var(--c-blue)','Saving a checkpoint then sending it to GitHub.'],['📦','Using Variables','var(--c-purple)','Storing name, age, and other data in Python.']]),
split('tag-pink','Byte Has New Progress','Byte added a cool message to main.py. But those changes only exist in Codespace!',`${blob('var(--c-pink)')}<div class="bubble top">Is it safe if the tab closes?</div>`,'var(--c-pink)'),
split('tag-blue','Need a Save Game','Just like a game, projects need checkpoints. Git uses commit, while Sync sends checkpoints to GitHub.',`<div style="font-size:8rem">🎮💾</div><div class="bubble bottom">Don't forget to save!</div>`),
`<div class="col center h-full text-center"><span class="tag-pill tag-orange" style="align-self:center">Subtopic 1</span><h2>File Changes</h2><p class="lead">How does Codespaces know our code has changed?</p><div style="font-size:7rem;margin-top:24px">📄 ✨</div></div>`,
cards('tag-orange','Three File States','Git distinguishes file states so we know what needs to be saved.',[['U','Untracked','var(--c-orange)','New file never tracked by Git yet.'],['M','Modified','var(--c-blue)','Existing file whose content has changed.'],['✓','Saved','var(--c-green)','Editor content saved in Codespace.']]),
split('tag-orange','Analogy: Workbook','Writing in a book is like file changes. Placing a bookmark helps us remember which part changed.',`<div style="font-size:8rem">📖🖍️</div>`,'var(--c-orange)'),
`<span class="tag-pill tag-orange">Practice</span><h2>Modify main.py</h2><div class="code"><span class="fn">print</span>(<span class="str">"Hello again from the server!"</span>)<br><span class="fn">print</span>(<span class="str">"Today I learned to save progress."</span>)</div><div class="callout"><p>After typing, notice the <strong>M</strong> mark next to the filename in the Explorer.</p></div>`,
split('tag-orange','Save Locally First','Press <strong>Ctrl + S</strong> or <strong>Cmd + S</strong>. This saves the editor contents to Codespace, but hasn\'t sent them to GitHub yet.',`<div style="font-size:8rem">⌨️💾</div>`,'var(--c-orange)'),
`<span class="tag-pill tag-green">Check Understanding</span><h2>Already pressed Ctrl + S. Is it on GitHub yet?</h2><div class="cards two"><div class="card"><h3>Not Yet</h3><p>Changes are only saved in the Codespace environment.</p></div><div class="card"><h3>Next Step</h3><p>Create a commit, then perform Sync Changes.</p></div></div>`,
split('tag-purple','Checkpoint for Code','Byte wants to name today\'s progress so it\'s easy to find later.',`${blob('var(--c-purple)')}<div class="bubble top">checkpoint: add greeting</div>`,'var(--c-purple)'),
`<div class="col center h-full text-center"><span class="tag-pill tag-purple" style="align-self:center">Subtopic 2</span><h2>Commit = Checkpoint</h2><p class="lead">A neat note describing the completed changes.</p><div style="font-size:7rem;margin-top:24px">🏁 📝</div></div>`,
cards('tag-purple','Anatomy of a Commit','A good commit consists of three parts.',[['📄','Changes','var(--c-blue)','Selected files to be recorded.'],['✍️','Message','var(--c-purple)','A brief summary of what changed.'],['🕒','Time','var(--c-orange)','Git records when the checkpoint was created.']]),
split('tag-purple','Analogy: LEGO Progress Photo','A commit is like taking a photo of a LEGO build at a specific stage. We can see the project journey photo by photo.',`<div style="font-size:8rem">🧱📸</div>`,'var(--c-purple)'),
`<span class="tag-pill tag-purple">Open Source Control</span><h2>All via UI</h2><div class="steps"><div class="step"><span class="num" style="background:var(--c-blue)">1</span><p>Click the <strong>Source Control</strong> icon on the left side of Codespaces.</p></div><div class="step"><span class="num" style="background:var(--c-purple)">2</span><p>Look at the list of files under <strong>Changes</strong>.</p></div><div class="step"><span class="num" style="background:var(--c-green)">3</span><p>Make sure only exercise files you want to save are selected.</p></div></div>`,
`<span class="tag-pill tag-purple">Write Commit Message</span><h2>Clear Messages</h2><div class="compare"><div class="card"><h3 style="color:var(--c-pink)">Unclear</h3><div class="code">update<br>fix<br>asdf</div></div><div class="arrow">➜</div><div class="card"><h3 style="color:var(--c-green)">Clear</h3><div class="code">Add server greeting<br>Create student profile data</div></div></div>`,
split('tag-purple','Commit Message Formula','Start with a verb, then state the result of the change. Keep it concise yet meaningful.',`<div class="code"><span class="fn">Add</span> + what?<br><span class="fn">Fix</span> + what?<br><span class="fn">Change</span> + what?</div>`,'var(--c-purple)'),
`<span class="tag-pill tag-purple">Create Checkpoint</span><h2>Click Commit</h2><div class="steps"><div class="step"><span class="num" style="background:var(--c-purple)">1</span><p>Type message: <strong>Add server greeting</strong>.</p></div><div class="step"><span class="num" style="background:var(--c-green)">2</span><p>Click the <strong>Commit</strong> button.</p></div><div class="step"><span class="num" style="background:var(--c-blue)">3</span><p>If prompted to stage changes, select according to instructor guidance.</p></div></div>`,
`<span class="tag-pill tag-green">Check Understanding</span><h2>What does a Commit do?</h2><div class="callout"><p><strong>A commit records a checkpoint of changes in Git history.</strong> A commit does not automatically mean changes have been sent to GitHub yet.</p></div><div style="font-size:7rem;text-align:center;margin-top:35px">📸 ≠ ☁️</div>`,
split('tag-blue','Checkpoint Still in Codespace','Now Byte has a commit, but GitHub outside Codespace hasn\'t received that checkpoint yet.',`${blob('var(--c-blue)')}<div class="bubble top">Time to send to the cloud!</div>`),
`<div class="col center h-full text-center"><span class="tag-pill tag-blue" style="align-self:center">Subtopic 3</span><h2>Sync Changes</h2><p class="lead">Sending commits to GitHub and pulling the latest updates.</p><div style="font-size:7rem;margin-top:24px">💻 🔄 ☁️</div></div>`,
cards('tag-blue','What Happens During Sync?','One button helps synchronize two locations.',[['⬆️','Push','var(--c-blue)','Sends commits from Codespace to GitHub.'],['⬇️','Pull','var(--c-green)','Fetches latest changes from GitHub.'],['🔄','Sync','var(--c-purple)','Helps perform both sequentially.']]),
split('tag-blue','Analogy: Online Game Save','Commit creates a save point. Sync uploads that save point to a cloud account so it can be retrieved again.',`<div style="font-size:8rem">🎮⬆️☁️</div>`),
`<span class="tag-pill tag-blue">Guided Practice</span><h2>Commit & Sync via UI</h2><div class="steps"><div class="step"><span class="num" style="background:var(--c-purple)">1</span><p>After committing, look for the <strong>Sync Changes</strong> button.</p></div><div class="step"><span class="num" style="background:var(--c-blue)">2</span><p>Click the button and wait for the process to complete.</p></div><div class="step"><span class="num" style="background:var(--c-green)">3</span><p>Ensure the Changes list becomes clean again.</p></div></div>`,
`<span class="tag-pill tag-blue">Verification</span><h2>Check on GitHub</h2><div class="steps"><div class="step"><span class="num" style="background:var(--c-blue)">1</span><p>Open the GitHub repository page.</p></div><div class="step"><span class="num" style="background:var(--c-orange)">2</span><p>Refresh the repository page.</p></div><div class="step"><span class="num" style="background:var(--c-green)">3</span><p>Open <strong>main.py</strong> and check its latest contents.</p></div></div>`,
cards('tag-pink','Before Closing the Tab','Use a safe ritual at the end of every class.',[['▶️','Run','var(--c-orange)','Run code and make sure there are no errors.'],['📸','Commit','var(--c-purple)','Create a checkpoint with a clear message.'],['🔄','Sync','var(--c-blue)','Send checkpoint and verify on GitHub.']]),
`<span class="tag-pill tag-pink">Common Pitfalls</span><h2>“I Already Saved!”</h2><div class="compare"><div class="card"><h3>Ctrl + S</h3><p>Saves editor content in Codespace.</p></div><div class="arrow">≠</div><div class="card"><h3>Commit & Sync</h3><p>Records changes and sends them to GitHub.</p></div></div>`,
`<span class="tag-green tag-pill">Check Understanding</span><h2>Order the Ritual</h2><div class="steps"><div class="step"><span class="num" style="background:var(--c-orange)">1</span><p>Run and test the code.</p></div><div class="step"><span class="num" style="background:var(--c-purple)">2</span><p>Write a message then Commit.</p></div><div class="step"><span class="num" style="background:var(--c-blue)">3</span><p>Click Sync Changes.</p></div><div class="step"><span class="num" style="background:var(--c-green)">4</span><p>Verify files on GitHub.</p></div></div>`,
split('tag-pink','Boxes for Data','After securing progress, Byte wants to store a name and age without typing them repeatedly.',`${blob('var(--c-pink)')}<div class="bubble top">Is there a magic box?</div>`,'var(--c-pink)'),
`<div class="col center h-full text-center"><span class="tag-pill tag-orange" style="align-self:center">Subtopic 4</span><h2>Python Variables</h2><p class="lead">A name pointing to a value in computer memory.</p><div style="font-size:7rem;margin-top:24px">🏷️ 📦</div></div>`,
split('tag-orange','Analogy: Labeled Box','Imagine a box labeled "name". We put the text "Byte" inside, then retrieve it whenever needed.',`<div class="code"><span class="var">name</span> = <span class="str">"Byte"</span><br>🏷️      📦</div>`,'var(--c-orange)'),
cards('tag-orange','Anatomy of a Variable','A simple single line has three parts.',[['🏷️','Variable Name','var(--c-blue)','The label we create, e.g., name.'],['=','Equals Sign','var(--c-purple)','Assigns or puts in a value.'],['📦','Value','var(--c-orange)','The data stored, e.g., "Byte".']]),
codeSlide('tag-orange','Storing Name & Age',`<span class="var">name</span> = <span class="str">"Byte"</span><br><span class="var">age</span> = <span style="color:#BD93F9">14</span><br><br><span class="fn">print</span>(<span class="var">name</span>)<br><span class="fn">print</span>(<span class="var">age</span>)`,'Text uses quotes. Numbers do not use quotes so they can be calculated later.'),
`<span class="tag-pill tag-orange">How to Read</span><h2>Read from Right to Left</h2><div class="code"><span class="var">hobby</span> = <span class="str">"drawing"</span></div><div class="steps"><div class="step"><span class="num" style="background:var(--c-orange)">1</span><p>Prepare the value <strong>"drawing"</strong>.</p></div><div class="step"><span class="num" style="background:var(--c-purple)">2</span><p>Put that value into the variable <strong>hobby</strong>.</p></div></div>`,
cards('tag-orange','Variable Naming Rules','Neat names make code easy to read.',[['✓','Allowed','var(--c-green)','name, age, my_school, score2'],['✕','Not Allowed','var(--c-pink)','2name, my-school, full name'],['💡','Recommended','var(--c-blue)','Lowercase letters and underscores as separators.']]),
codeSlide('tag-pink','Variables Can Change',`<span class="var">level</span> = <span style="color:#BD93F9">1</span><br><span class="fn">print</span>(<span class="var">level</span>)<br><br><span class="var">level</span> = <span style="color:#BD93F9">2</span><br><span class="fn">print</span>(<span class="var">level</span>)`,'The newest value replaces the old value. That\'s why it\'s called a variable: its value can vary.'),
codeSlide('tag-pink','Text + Variable',`<span class="var">name</span> = <span class="str">"Byte"</span><br><span class="fn">print</span>(<span class="str">"Hello, "</span> + <span class="var">name</span>)`,'The <strong>+</strong> sign joins text with text stored inside a variable.'),
`<span class="tag-pill tag-green">Python Playground</span><h2>Try Your Variables</h2><p style="margin-bottom:14px">Change name, age, and hobby. Then run it.</p><div class="ide-container"><div class="ide-window"><div class="ide-header"><i class="dot" style="background:#FF5F56"></i><i class="dot" style="background:#FFBD2E"></i><i class="dot" style="background:#27C93F"></i><span>main.py</span></div><textarea id="python-code" class="ide-editor" spellcheck="false">name = "Byte"
age = 14
hobby = "drawing"

print("Name:", name)
print("Age:", age)
print("Hobby:", hobby)</textarea></div><div class="ide-window"><div class="ide-header" style="background:#E2E8F0;color:#475569">Terminal Output</div><div id="python-output" class="ide-output">Preparing Python engine…</div></div></div><button id="run-btn" class="btn-run" disabled>Loading Python… ⏳</button>`,
codeSlide('tag-pink','Bug: Undefined Variable',`<span class="fn">print</span>(<span class="var">food</span>)<br><br><span style="color:#FF5555">NameError: name 'food' is not defined</span>`,'Python does not recognize the variable food yet. Create the variable before using it.'),

const root=document.getElementById('slides-root');root.innerHTML=slides.map((content,index)=>`<section class="slide${index===0?' active':''}" id="slide-${index+1}" aria-label="Slide ${index+1} of ${slides.length}">${content}</section>`).join('');
const allSlides=[...document.querySelectorAll('.slide')],prevBtn=document.getElementById('prev-btn'),nextBtn=document.getElementById('next-btn'),page=document.getElementById('current-page'),total=document.getElementById('total-page'),progress=document.getElementById('progress');let currentSlideIndex=0;total.textContent=allSlides.length;
function updateSlides(){allSlides.forEach((slide,i)=>slide.classList.toggle('active',i===currentSlideIndex));page.textContent=currentSlideIndex+1;progress.style.width=`${((currentSlideIndex+1)/allSlides.length)*100}%`;prevBtn.disabled=currentSlideIndex===0;const done=currentSlideIndex===allSlides.length-1;nextBtn.disabled=done;nextBtn.textContent=done?'Finish':'Next ➞';nextBtn.classList.toggle('btn-primary',!done)}function move(delta){const target=currentSlideIndex+delta;if(target>=0&&target<allSlides.length){currentSlideIndex=target;updateSlides()}}prevBtn.addEventListener('click',()=>move(-1));nextBtn.addEventListener('click',()=>move(1));document.addEventListener('keydown',event=>{if(event.target.matches('textarea,input'))return;if(event.key==='ArrowRight'||event.key==='PageDown')move(1);if(event.key==='ArrowLeft'||event.key==='PageUp')move(-1)});updateSlides();
const runBtn=document.getElementById('run-btn'),output=document.getElementById('python-output'),codeInput=document.getElementById('python-code');let pyodideReadyPromise;async function initPyodide(){try{const engine=await loadPyodide();runBtn.disabled=false;runBtn.textContent='Run Code ▶';output.textContent='Python ready! Press the Run Code button.';return engine}catch(error){runBtn.textContent='Failed to load Python';output.textContent='Check internet connection, then reload the page.';output.style.color='var(--c-pink)';throw error}}async function runPythonCode(){runBtn.disabled=true;runBtn.textContent='Running…';output.textContent='';try{const engine=await pyodideReadyPromise,lines=[];engine.setStdout({batched:message=>lines.push(message)});await engine.runPythonAsync(codeInput.value);output.textContent=lines.join('\n')||'Code ran successfully with no output.';output.style.color='#334155'}catch(error){output.textContent=`Oops, found a bug 🐛\n\n${error.message}`;output.style.color='var(--c-pink)'}finally{runBtn.disabled=false;runBtn.textContent='Run Code ▶'}}runBtn.addEventListener('click',runPythonCode);pyodideReadyPromise=initPyodide();
</script></body></html>
