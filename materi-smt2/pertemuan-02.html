<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pertemuan 02 — Ritual Sync & Kotak Data</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;500;600;800&family=Fira+Code:wght@500&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
<style>
:root{--bg-workspace:#F3EFE9;--bg-slide:#FFFDF9;--c-yellow:#E8AA24;--c-orange:#EF6C35;--c-pink:#E0356D;--c-purple:#9A53E0;--c-blue:#447EE0;--c-light-blue:#4AB2D9;--c-green:#48A850;--text-dark:#2A2A35;--text-muted:#6C6C82;--ide-bg:#1E1E2E;--ide-text:#A6E22E}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Poppins,sans-serif;background:var(--bg-workspace);color:var(--text-dark);min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center}#app-wrapper{width:96vw;max-width:1600px;display:flex;flex-direction:column;gap:20px;align-items:center}#presentation-container{width:100%;height:82vh;background:var(--bg-slide);position:relative;border-radius:40px;overflow:hidden;box-shadow:0 25px 50px -12px #2A2A3514}.slide{position:absolute;inset:0;padding:clamp(34px,5vw,70px);display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:scale(.95) translateY(20px);transition:opacity .6s,transform .6s cubic-bezier(.34,1.56,.64,1);overflow:auto}.slide.active{opacity:1;visibility:visible;transform:none;z-index:2}.slide::-webkit-scrollbar{width:16px}.slide::-webkit-scrollbar-thumb{background:#D8D8E5;border:5px solid var(--bg-slide);border-radius:20px}h1,h2,h3,h4{font-family:Fredoka,sans-serif;font-weight:700}h1{font-size:clamp(3rem,5.2vw,5.2rem);line-height:1.05}h2{font-size:clamp(2.2rem,3.7vw,3.8rem);line-height:1.12;margin-bottom:22px}h3{font-size:1.65rem;margin-bottom:10px}p,li{font-size:clamp(1rem,1.3vw,1.24rem);line-height:1.7;color:var(--text-muted);font-weight:500}.lead{font-size:clamp(1.15rem,1.6vw,1.45rem)}strong{color:var(--text-dark)}code{font-family:'Fira Code';color:var(--c-purple)}.row{display:flex}.col{display:flex;flex-direction:column}.center{align-items:center;justify-content:center}.h-full{min-height:100%}.w-half{width:50%}.gap{gap:clamp(24px,4vw,60px)}.text-center{text-align:center}.tag-pill{align-self:flex-start;padding:9px 22px;border-radius:30px;font-family:Fredoka;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:18px}.tag-blue{background:#447EE01A;color:var(--c-blue)}.tag-pink{background:#E0356D1A;color:var(--c-pink)}.tag-purple{background:#9A53E01A;color:var(--c-purple)}.tag-green{background:#48A8501A;color:var(--c-green)}.tag-orange{background:#EF6C351A;color:var(--c-orange)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;width:100%;margin-top:18px}.cards.two{grid-template-columns:repeat(2,1fr)}.card{background:#fff;padding:30px;border-radius:32px;box-shadow:0 15px 40px #0000000A}.icon{width:74px;height:74px;border-radius:24px;display:grid;place-items:center;font-size:2.2rem;margin-bottom:18px}.steps{display:flex;flex-direction:column;gap:16px;width:100%;margin-top:15px}.step{display:flex;align-items:center;gap:20px;background:#fff;padding:18px 24px;border-radius:50px;box-shadow:0 12px 30px #0000000A}.num{flex:0 0 48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 1.2rem Fredoka}.scene{position:relative;min-height:360px;display:grid;place-items:center}.blob{width:min(320px,80%);animation:float 6s ease-in-out infinite;filter:drop-shadow(0 18px 18px #2A2A351A)}@keyframes float{50%{transform:translateY(-15px) rotate(2deg)}}.bubble{position:absolute;background:#fff;padding:18px 24px;border-radius:26px;box-shadow:0 15px 35px #00000012;font-weight:700;max-width:260px}.bubble.top{top:2%;right:0}.bubble.bottom{bottom:2%;left:0}.code{background:var(--ide-bg);color:#F8F8F2;border-radius:24px;padding:24px;font:500 1.1rem/1.7 'Fira Code';white-space:pre-wrap;box-shadow:0 16px 36px #1E1E2E29}.fn{color:#50FA7B}.str{color:#F1FA8C}.comment{color:#8D93B8}.var{color:#8BE9FD}.callout{padding:22px 27px;border-radius:25px;background:#E8AA241A;border-left:8px solid var(--c-yellow);margin-top:22px}.check{list-style:none}.check li{margin:12px 0;padding-left:34px;position:relative}.check li:before{content:'✓';position:absolute;left:0;color:var(--c-green);font-weight:800}.ide-container{display:flex;gap:24px;min-height:330px;width:100%;flex:1}.ide-window{flex:1;border-radius:25px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 15px 40px #00000014}.ide-header{height:45px;display:flex;align-items:center;padding:0 18px;gap:8px;font-weight:600;background:#2D2D44;color:#fff}.dot{width:12px;height:12px;border-radius:50%}.ide-editor{background:var(--ide-bg);color:var(--ide-text);padding:22px;font:500 1rem/1.55 'Fira Code';flex:1;border:0;outline:0;resize:none}.ide-output{background:#F8F9FA;border:4px dashed #E2E8F0;padding:22px;font:500 1rem/1.55 'Fira Code';flex:1;color:#334155;overflow:auto;white-space:pre-wrap}.btn-run{align-self:center;margin-top:16px;background:var(--c-green);color:#fff;border:0;padding:14px 34px;border-radius:50px;font:700 1.2rem Fredoka;cursor:pointer;box-shadow:0 10px 25px #48A85055}.btn-run:disabled{background:#CBD5E1;cursor:wait;box-shadow:none}#bottom-bar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:0 36px}.slide-indicator{display:flex;align-items:center;gap:13px;font:700 1.15rem Fredoka}.logo-mark{width:34px;height:34px;background:var(--c-pink);border-radius:12px;transform:rotate(15deg)}.nav-controls{display:flex;gap:14px}.btn{border:0;border-radius:50px;padding:13px 34px;background:var(--text-dark);color:#fff;font:600 1.15rem Fredoka;cursor:pointer;box-shadow:0 10px 20px #2A2A3526}.btn-primary{background:var(--c-blue)}.btn:disabled{background:#D8D8E5;color:#A0A0B5;box-shadow:none;cursor:not-allowed}.progress-track{position:absolute;left:0;bottom:0;width:100%;height:7px;background:#EEEAF0;z-index:5}.progress{height:100%;background:linear-gradient(90deg,var(--c-pink),var(--c-blue));transition:width .35s}.badge{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:20px;background:var(--c-purple);color:#fff;font:700 1.6rem Fredoka;margin-bottom:16px}.compare{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;margin-top:22px}.arrow{font-size:3rem;color:var(--c-blue)}
@media(max-width:800px){#presentation-container{height:80vh;border-radius:25px}.slide{padding:28px}.row{flex-direction:column}.w-half{width:100%}.scene{min-height:230px}.blob{width:180px}.cards,.cards.two,.compare{grid-template-columns:1fr}.arrow{transform:rotate(90deg);text-align:center}.card{padding:22px}.ide-container{flex-direction:column}.ide-window{min-height:220px}#bottom-bar{padding:0 8px}.btn{padding:11px 18px}.bubble{font-size:.8rem}}
</style></head><body><main id="app-wrapper"><section id="presentation-container" aria-label="Materi pertemuan 2"><div id="slides-root"></div><div class="progress-track"><div class="progress" id="progress"></div></div></section><nav id="bottom-bar" aria-label="Navigasi slide"><div class="slide-indicator"><span class="logo-mark"></span>Hal. <span id="current-page">1</span> / <span id="total-page">50</span></div><div class="nav-controls"><button class="btn" id="prev-btn">Kembali</button><button class="btn btn-primary" id="next-btn">Lanjut ➞</button></div></nav></main>
<script>
const blob=(color='var(--c-blue)')=>`<svg class="blob" viewBox="0 0 320 320" aria-hidden="true"><path d="M65 82C103 25 225 30 266 88c35 49 23 153-30 190-48 34-154 23-190-28C10 200 27 139 65 82Z" fill="${color}"/><ellipse cx="125" cy="145" rx="24" ry="35" fill="white"/><ellipse cx="205" cy="145" rx="24" ry="35" fill="white"/><circle cx="132" cy="151" r="14" fill="#20202A"/><circle cx="198" cy="151" r="14" fill="#20202A"/><circle cx="127" cy="145" r="4" fill="white"/><circle cx="193" cy="145" r="4" fill="white"/><path d="M135 211q25 22 50 0" fill="none" stroke="#20202A" stroke-width="9" stroke-linecap="round"/></svg>`;
const split=(tag,title,text,art,color='var(--c-blue)')=>`<div class="row center h-full gap"><div class="w-half col"><span class="tag-pill ${tag}">${tag.replace('tag-','')}</span><h2>${title}</h2><p class="lead">${text}</p></div><div class="w-half scene">${art||blob(color)}</div></div>`;
const cards=(tag,title,intro,items)=>`<span class="tag-pill ${tag}">${tag.replace('tag-','')}</span><h2>${title}</h2><p class="lead">${intro}</p><div class="cards">${items.map(x=>`<article class="card"><div class="icon" style="background:${x[2]}1A;color:${x[2]}">${x[0]}</div><h3>${x[1]}</h3><p>${x[3]}</p></article>`).join('')}</div>`;
const codeSlide=(tag,title,code,caption)=>`<span class="tag-pill ${tag}">Kode Python</span><h2>${title}</h2><div class="code">${code}</div><div class="callout"><p>${caption}</p></div>`;
const slides=[
`<div class="row center h-full gap"><div class="w-half"><span class="tag-pill tag-pink">Pertemuan 02</span><h1>Ritual <span style="color:var(--c-blue)">Sync</span><br>& Kotak Data</h1><p class="lead" style="margin-top:22px">Menyimpan progres seperti save game, lalu membuat kotak ajaib bernama variabel.</p></div><div class="w-half scene">${blob('var(--c-purple)')}<div class="bubble top">Save berhasil! 💾</div><div class="bubble bottom">nama = "Byte"</div></div></div>`,
cards('tag-blue','Misi Hari Ini','Kita melanjutkan markas cloud dari pertemuan pertama.',[['📝','Membuat Perubahan','var(--c-orange)','Mengubah main.py dan membaca penanda perubahan.'],['💾','Commit & Sync','var(--c-blue)','Menyimpan checkpoint lalu mengirimnya ke GitHub.'],['📦','Memakai Variabel','var(--c-purple)','Menyimpan nama, umur, dan data lain di Python.']]),
split('tag-pink','Byte Punya Progres Baru','Byte menambahkan pesan keren ke main.py. Namun perubahan itu baru ada di Codespace!',`${blob('var(--c-pink)')}<div class="bubble top">Kalau tab tertutup, aman tidak?</div>`,'var(--c-pink)'),
split('tag-blue','Butuh Save Game','Seperti game, proyek juga memerlukan checkpoint. Git memakai commit, sedangkan Sync mengirim checkpoint ke GitHub.',`<div style="font-size:8rem">🎮💾</div><div class="bubble bottom">Jangan lupa save!</div>`),
`<div class="col center h-full text-center"><span class="tag-pill tag-orange" style="align-self:center">Subtopik 1</span><h2>Perubahan pada File</h2><p class="lead">Bagaimana Codespaces tahu bahwa kode kita berubah?</p><div style="font-size:7rem;margin-top:24px">📄 ✨</div></div>`,
cards('tag-orange','Tiga Kondisi File','Git membedakan kondisi file agar kita tahu apa yang perlu disimpan.',[['U','Untracked','var(--c-orange)','File baru yang belum pernah dicatat Git.'],['M','Modified','var(--c-blue)','File lama yang isinya sudah berubah.'],['✓','Saved','var(--c-green)','Isi editor sudah tersimpan di Codespace.']]),
split('tag-orange','Analogi: Buku Tugas','Menulis di buku adalah perubahan file. Menaruh penanda halaman membantu kita ingat bagian yang berubah.',`<div style="font-size:8rem">📖🖍️</div>`,'var(--c-orange)'),
`<span class="tag-pill tag-orange">Praktik</span><h2>Ubah main.py</h2><div class="code"><span class="fn">print</span>(<span class="str">"Halo lagi dari server!"</span>)<br><span class="fn">print</span>(<span class="str">"Hari ini aku belajar menyimpan progres."</span>)</div><div class="callout"><p>Setelah mengetik, perhatikan tanda <strong>M</strong> di samping nama file pada Explorer.</p></div>`,
split('tag-orange','Save Lokal Dulu','Tekan <strong>Ctrl + S</strong> atau <strong>Cmd + S</strong>. Ini menyimpan isi editor ke Codespace, tetapi belum mengirimkannya ke GitHub.',`<div style="font-size:8rem">⌨️💾</div>`,'var(--c-orange)'),
`<span class="tag-pill tag-green">Cek Pemahaman</span><h2>Sudah menekan Ctrl + S. Apakah sudah ada di GitHub?</h2><div class="cards two"><div class="card"><h3>Belum</h3><p>Perubahan baru tersimpan pada lingkungan Codespace.</p></div><div class="card"><h3>Langkah berikutnya</h3><p>Buat commit, kemudian lakukan Sync Changes.</p></div></div>`,
split('tag-purple','Checkpoint untuk Kode','Byte ingin memberi nama pada progres hari ini agar mudah ditemukan kembali.',`${blob('var(--c-purple)')}<div class="bubble top">checkpoint: tambah salam</div>`,'var(--c-purple)'),
`<div class="col center h-full text-center"><span class="tag-pill tag-purple" style="align-self:center">Subtopik 2</span><h2>Commit = Checkpoint</h2><p class="lead">Satu catatan rapi tentang perubahan yang selesai dikerjakan.</p><div style="font-size:7rem;margin-top:24px">🏁 📝</div></div>`,
cards('tag-purple','Isi Sebuah Commit','Commit yang baik memiliki tiga bagian.',[['📄','Perubahan','var(--c-blue)','File yang dipilih untuk dicatat.'],['✍️','Pesan','var(--c-purple)','Ringkasan singkat tentang apa yang berubah.'],['🕒','Waktu','var(--c-orange)','Git mencatat kapan checkpoint dibuat.']]),
split('tag-purple','Analogi: Foto Progres LEGO','Commit seperti memotret bentuk LEGO pada satu tahap. Kita dapat melihat perjalanan proyek dari foto ke foto.',`<div style="font-size:8rem">🧱📸</div>`,'var(--c-purple)'),
`<span class="tag-pill tag-purple">Buka Source Control</span><h2>Semua lewat UI</h2><div class="steps"><div class="step"><span class="num" style="background:var(--c-blue)">1</span><p>Klik ikon <strong>Source Control</strong> di sisi kiri Codespaces.</p></div><div class="step"><span class="num" style="background:var(--c-purple)">2</span><p>Lihat daftar file pada bagian <strong>Changes</strong>.</p></div><div class="step"><span class="num" style="background:var(--c-green)">3</span><p>Pastikan hanya file latihan yang ingin disimpan.</p></div></div>`,
`<span class="tag-pill tag-purple">Tulis Pesan Commit</span><h2>Pesan yang Jelas</h2><div class="compare"><div class="card"><h3 style="color:var(--c-pink)">Kurang jelas</h3><div class="code">update<br>fix<br>asdf</div></div><div class="arrow">➜</div><div class="card"><h3 style="color:var(--c-green)">Lebih jelas</h3><div class="code">Tambah salam server<br>Buat data profil siswa</div></div></div>`,
split('tag-purple','Rumus Pesan Commit','Mulai dengan kata kerja, lalu sebutkan hasil perubahan. Buat singkat tetapi bermakna.',`<div class="code"><span class="fn">Tambah</span> + apa?<br><span class="fn">Perbaiki</span> + apa?<br><span class="fn">Ubah</span> + apa?</div>`,'var(--c-purple)'),
`<span class="tag-pill tag-purple">Buat Checkpoint</span><h2>Klik Commit</h2><div class="steps"><div class="step"><span class="num" style="background:var(--c-purple)">1</span><p>Ketik pesan: <strong>Tambah salam server</strong>.</p></div><div class="step"><span class="num" style="background:var(--c-green)">2</span><p>Klik tombol <strong>Commit</strong>.</p></div><div class="step"><span class="num" style="background:var(--c-blue)">3</span><p>Jika diminta stage changes, pilih sesuai arahan instruktur.</p></div></div>`,
`<span class="tag-pill tag-green">Cek Pemahaman</span><h2>Apa yang dilakukan Commit?</h2><div class="callout"><p><strong>Commit mencatat checkpoint perubahan di riwayat Git.</strong> Commit belum selalu berarti perubahan sudah terkirim ke GitHub.</p></div><div style="font-size:7rem;text-align:center;margin-top:35px">📸 ≠ ☁️</div>`,
split('tag-blue','Checkpoint Masih di Codespace','Sekarang Byte punya commit, tetapi GitHub di luar Codespace belum menerima checkpoint tersebut.',`${blob('var(--c-blue)')}<div class="bubble top">Saatnya kirim ke cloud!</div>`),
`<div class="col center h-full text-center"><span class="tag-pill tag-blue" style="align-self:center">Subtopik 3</span><h2>Sync Changes</h2><p class="lead">Mengirim commit ke GitHub dan mengambil pembaruan terbaru.</p><div style="font-size:7rem;margin-top:24px">💻 🔄 ☁️</div></div>`,
cards('tag-blue','Apa yang Terjadi Saat Sync?','Satu tombol membantu menyamakan dua tempat.',[['⬆️','Push','var(--c-blue)','Mengirim commit dari Codespace ke GitHub.'],['⬇️','Pull','var(--c-green)','Mengambil perubahan terbaru dari GitHub.'],['🔄','Sync','var(--c-purple)','Membantu melakukan keduanya secara berurutan.']]),
split('tag-blue','Analogi: Save Game Online','Commit membuat save point. Sync mengunggah save point itu ke akun cloud agar bisa ditemukan lagi.',`<div style="font-size:8rem">🎮⬆️☁️</div>`),
`<span class="tag-pill tag-blue">Praktik Terbimbing</span><h2>Commit & Sync lewat UI</h2><div class="steps"><div class="step"><span class="num" style="background:var(--c-purple)">1</span><p>Setelah commit, cari tombol <strong>Sync Changes</strong>.</p></div><div class="step"><span class="num" style="background:var(--c-blue)">2</span><p>Klik tombol tersebut dan tunggu proses selesai.</p></div><div class="step"><span class="num" style="background:var(--c-green)">3</span><p>Pastikan daftar Changes kembali bersih.</p></div></div>`,
`<span class="tag-pill tag-blue">Verifikasi</span><h2>Cek di GitHub</h2><div class="steps"><div class="step"><span class="num" style="background:var(--c-blue)">1</span><p>Buka halaman repository GitHub.</p></div><div class="step"><span class="num" style="background:var(--c-orange)">2</span><p>Refresh halaman repository.</p></div><div class="step"><span class="num" style="background:var(--c-green)">3</span><p>Buka <strong>main.py</strong> dan cocokkan isi terbarunya.</p></div></div>`,
cards('tag-pink','Sebelum Menutup Tab','Gunakan ritual aman setiap akhir kelas.',[['▶️','Run','var(--c-orange)','Jalankan kode dan pastikan tidak error.'],['📸','Commit','var(--c-purple)','Buat checkpoint dengan pesan jelas.'],['🔄','Sync','var(--c-blue)','Kirim checkpoint dan cek kembali di GitHub.']]),
`<span class="tag-pill tag-pink">Jebakan Umum</span><h2>“Aku Sudah Save!”</h2><div class="compare"><div class="card"><h3>Ctrl + S</h3><p>Menyimpan isi editor pada Codespace.</p></div><div class="arrow">≠</div><div class="card"><h3>Commit & Sync</h3><p>Mencatat perubahan dan mengirimkannya ke GitHub.</p></div></div>`,
`<span class="tag-green tag-pill">Cek Pemahaman</span><h2>Urutkan Ritualnya</h2><div class="steps"><div class="step"><span class="num" style="background:var(--c-orange)">1</span><p>Jalankan dan periksa kode.</p></div><div class="step"><span class="num" style="background:var(--c-purple)">2</span><p>Tulis pesan lalu Commit.</p></div><div class="step"><span class="num" style="background:var(--c-blue)">3</span><p>Klik Sync Changes.</p></div><div class="step"><span class="num" style="background:var(--c-green)">4</span><p>Verifikasi file di GitHub.</p></div></div>`,
split('tag-pink','Kotak untuk Data','Setelah progres aman, Byte ingin menyimpan nama dan umur tanpa mengetiknya berulang kali.',`${blob('var(--c-pink)')}<div class="bubble top">Ada kotak ajaib?</div>`,'var(--c-pink)'),
`<div class="col center h-full text-center"><span class="tag-pill tag-orange" style="align-self:center">Subtopik 4</span><h2>Variabel Python</h2><p class="lead">Nama yang menunjuk pada sebuah nilai di memori komputer.</p><div style="font-size:7rem;margin-top:24px">🏷️ 📦</div></div>`,
split('tag-orange','Analogi: Kotak Berlabel','Bayangkan kotak bertuliskan “nama”. Kita memasukkan teks “Byte” ke dalamnya, lalu mengambilnya kapan pun dibutuhkan.',`<div class="code"><span class="var">nama</span> = <span class="str">"Byte"</span><br>🏷️      📦</div>`,'var(--c-orange)'),
cards('tag-orange','Anatomi Variabel','Satu baris sederhana memiliki tiga bagian.',[['🏷️','Nama Variabel','var(--c-blue)','Label yang kita buat, misalnya nama.'],['=','Tanda Sama Dengan','var(--c-purple)','Memberi atau memasukkan nilai.'],['📦','Nilai','var(--c-orange)','Data yang disimpan, misalnya "Byte".']]),
codeSlide('tag-orange','Menyimpan Nama & Umur',`<span class="var">nama</span> = <span class="str">"Byte"</span><br><span class="var">umur</span> = <span style="color:#BD93F9">14</span><br><br><span class="fn">print</span>(<span class="var">nama</span>)<br><span class="fn">print</span>(<span class="var">umur</span>)`,'Teks memakai tanda petik. Angka tidak memakai tanda petik agar nanti dapat dihitung.'),
`<span class="tag-pill tag-orange">Cara Membaca</span><h2>Baca dari Kanan ke Kiri</h2><div class="code"><span class="var">hobi</span> = <span class="str">"menggambar"</span></div><div class="steps"><div class="step"><span class="num" style="background:var(--c-orange)">1</span><p>Siapkan nilai <strong>"menggambar"</strong>.</p></div><div class="step"><span class="num" style="background:var(--c-purple)">2</span><p>Masukkan nilai itu ke variabel <strong>hobi</strong>.</p></div></div>`,

const root=document.getElementById('slides-root');root.innerHTML=slides.map((content,index)=>`<section class="slide${index===0?' active':''}" id="slide-${index+1}" aria-label="Slide ${index+1} dari ${slides.length}">${content}</section>`).join('');
const allSlides=[...document.querySelectorAll('.slide')],prevBtn=document.getElementById('prev-btn'),nextBtn=document.getElementById('next-btn'),page=document.getElementById('current-page'),total=document.getElementById('total-page'),progress=document.getElementById('progress');let currentSlideIndex=0;total.textContent=allSlides.length;
function updateSlides(){allSlides.forEach((slide,i)=>slide.classList.toggle('active',i===currentSlideIndex));page.textContent=currentSlideIndex+1;progress.style.width=`${((currentSlideIndex+1)/allSlides.length)*100}%`;prevBtn.disabled=currentSlideIndex===0;const done=currentSlideIndex===allSlides.length-1;nextBtn.disabled=done;nextBtn.textContent=done?'Selesai':'Lanjut ➞';nextBtn.classList.toggle('btn-primary',!done)}function move(delta){const target=currentSlideIndex+delta;if(target>=0&&target<allSlides.length){currentSlideIndex=target;updateSlides()}}prevBtn.addEventListener('click',()=>move(-1));nextBtn.addEventListener('click',()=>move(1));document.addEventListener('keydown',event=>{if(event.target.matches('textarea,input'))return;if(event.key==='ArrowRight'||event.key==='PageDown')move(1);if(event.key==='ArrowLeft'||event.key==='PageUp')move(-1)});updateSlides();
const runBtn=document.getElementById('run-btn'),output=document.getElementById('python-output'),codeInput=document.getElementById('python-code');let pyodideReadyPromise;async function initPyodide(){try{const engine=await loadPyodide();runBtn.disabled=false;runBtn.textContent='Jalankan Kode ▶';output.textContent='Python siap! Tekan tombol Jalankan Kode.';return engine}catch(error){runBtn.textContent='Python gagal dimuat';output.textContent='Periksa koneksi internet, lalu muat ulang halaman.';output.style.color='var(--c-pink)';throw error}}async function runPythonCode(){runBtn.disabled=true;runBtn.textContent='Menjalankan…';output.textContent='';try{const engine=await pyodideReadyPromise,lines=[];engine.setStdout({batched:message=>lines.push(message)});await engine.runPythonAsync(codeInput.value);output.textContent=lines.join('\n')||'Kode berhasil dijalankan tanpa output.';output.style.color='#334155'}catch(error){output.textContent=`Oops, ada bug 🐛\n\n${error.message}`;output.style.color='var(--c-pink)'}finally{runBtn.disabled=false;runBtn.textContent='Jalankan Kode ▶'}}runBtn.addEventListener('click',runPythonCode);pyodideReadyPromise=initPyodide();
