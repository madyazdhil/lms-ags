<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting 01 — Coding HQ in the Cloud</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;500;600;800&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
  <style>
    :root{--bg-workspace:#F3EFE9;--bg-slide:#FFFDF9;--c-yellow:#E8AA24;--c-orange:#EF6C35;--c-pink:#E0356D;--c-light-pink:#F47C9E;--c-purple:#9A53E0;--c-blue:#447EE0;--c-light-blue:#4AB2D9;--c-green:#48A850;--text-dark:#2A2A35;--text-muted:#6C6C82;--ide-bg:#1E1E2E;--ide-text:#A6E22E}
    *{box-sizing:border-box;margin:0;padding:0} body{font-family:Poppins,sans-serif;background:var(--bg-workspace);color:var(--text-dark);min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center}
    #app-wrapper{width:96vw;max-width:1600px;display:flex;flex-direction:column;gap:20px;align-items:center} #presentation-container{width:100%;height:82vh;background:var(--bg-slide);position:relative;border-radius:40px;overflow:hidden;box-shadow:0 25px 50px -12px rgba(42,42,53,.08)}
    .slide{position:absolute;inset:0;padding:clamp(34px,5vw,70px);display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:scale(.95) translateY(20px);transition:opacity .6s,transform .6s cubic-bezier(.34,1.56,.64,1);overflow:auto}.slide.active{opacity:1;visibility:visible;transform:none;z-index:2}.slide::-webkit-scrollbar{width:16px}.slide::-webkit-scrollbar-thumb{background:#D8D8E5;border:5px solid var(--bg-slide);border-radius:20px}
    h1,h2,h3,h4{font-family:Fredoka,sans-serif;font-weight:700}h1{font-size:clamp(3rem,5.2vw,5.2rem);line-height:1.05}h2{font-size:clamp(2.2rem,3.7vw,3.8rem);line-height:1.12;margin-bottom:22px}h3{font-size:1.65rem;margin-bottom:10px}p,li{font-size:clamp(1rem,1.3vw,1.24rem);line-height:1.7;color:var(--text-muted);font-weight:500}.lead{font-size:clamp(1.15rem,1.6vw,1.45rem)}strong{color:var(--text-dark)}
    .row{display:flex}.col{display:flex;flex-direction:column}.center{align-items:center;justify-content:center}.between{justify-content:space-between}.h-full{min-height:100%}.w-half{width:50%}.gap{gap:clamp(24px,4vw,60px)}.text-center{text-align:center}.tag-pill{align-self:flex-start;padding:9px 22px;border-radius:30px;font-family:Fredoka;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:18px}.tag-blue{background:#447EE01A;color:var(--c-blue)}.tag-pink{background:#E0356D1A;color:var(--c-pink)}.tag-purple{background:#9A53E01A;color:var(--c-purple)}.tag-green{background:#48A8501A;color:var(--c-green)}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;width:100%;margin-top:18px}.cards.two{grid-template-columns:repeat(2,1fr)}.card{background:#fff;padding:30px;border-radius:32px;box-shadow:0 15px 40px rgba(0,0,0,.04)}.card.accent{background:#447EE012}.icon{width:74px;height:74px;border-radius:24px;display:grid;place-items:center;font-size:2.2rem;margin-bottom:18px}.steps{display:flex;flex-direction:column;gap:16px;width:100%;margin-top:15px}.step{display:flex;align-items:center;gap:20px;background:#fff;padding:18px 24px;border-radius:50px;box-shadow:0 12px 30px rgba(0,0,0,.04)}.num{flex:0 0 48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 1.25rem Fredoka}
    .scene{position:relative;min-height:360px;display:grid;place-items:center}.blob{width:min(320px,80%);animation:float 6s ease-in-out infinite;filter:drop-shadow(0 18px 18px rgba(42,42,53,.1))}@keyframes float{50%{transform:translateY(-15px) rotate(2deg)}}.bubble{position:absolute;background:#fff;padding:18px 24px;border-radius:26px;box-shadow:0 15px 35px rgba(0,0,0,.07);font-weight:700;max-width:240px}.bubble.top{top:2%;right:0}.bubble.bottom{bottom:2%;left:0}
    .code{background:var(--ide-bg);color:#F8F8F2;border-radius:24px;padding:24px;font:500 1.12rem/1.7 'Fira Code';white-space:pre-wrap;box-shadow:0 16px 36px rgba(30,30,46,.16)}.kw{color:#FF79C6}.str{color:#F1FA8C}.fn{color:#50FA7B}.comment{color:#8D93B8}.callout{padding:22px 27px;border-radius:25px;background:#E8AA241A;border-left:8px solid var(--c-yellow);margin-top:22px}.check{list-style:none}.check li{margin:12px 0;padding-left:34px;position:relative}.check li:before{content:'✓';position:absolute;left:0;color:var(--c-green);font-weight:800}
    .ide-container{display:flex;gap:24px;min-height:330px;width:100%;flex:1}.ide-window{flex:1;border-radius:25px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 15px 40px rgba(0,0,0,.08)}.ide-header{height:45px;display:flex;align-items:center;padding:0 18px;gap:8px;font-weight:600;background:#2D2D44;color:#fff}.dot{width:12px;height:12px;border-radius:50%}.ide-editor{background:var(--ide-bg);color:var(--ide-text);padding:22px;font:500 1rem/1.55 'Fira Code';flex:1;border:0;outline:0;resize:none}.ide-output{background:#F8F9FA;border:4px dashed #E2E8F0;padding:22px;font:500 1rem/1.55 'Fira Code';flex:1;color:#334155;overflow:auto;white-space:pre-wrap}.btn-run{align-self:center;margin-top:16px;background:var(--c-green);color:#fff;border:0;padding:14px 34px;border-radius:50px;font:700 1.2rem Fredoka;cursor:pointer;box-shadow:0 10px 25px #48A85055}.btn-run:disabled{background:#CBD5E1;cursor:wait;box-shadow:none}
    #bottom-bar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:0 36px}.slide-indicator{display:flex;align-items:center;gap:13px;font:700 1.15rem Fredoka}.logo-mark{width:34px;height:34px;background:var(--c-pink);border-radius:12px;transform:rotate(15deg)}.nav-controls{display:flex;gap:14px}.btn{border:0;border-radius:50px;padding:13px 34px;background:var(--text-dark);color:#fff;font:600 1.15rem Fredoka;cursor:pointer;box-shadow:0 10px 20px rgba(42,42,53,.15)}.btn-primary{background:var(--c-blue)}.btn:disabled{background:#D8D8E5;color:#A0A0B5;box-shadow:none;cursor:not-allowed}.progress-track{position:absolute;left:0;bottom:0;width:100%;height:7px;background:#EEEAF0;z-index:5}.progress{height:100%;background:linear-gradient(90deg,var(--c-pink),var(--c-blue));transition:width .35s}
    .challenge{border-top:10px solid var(--c-purple)}.badge{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:20px;background:var(--c-purple);color:#fff;font:700 1.6rem Fredoka;margin-bottom:16px}.tiny{font-size:.9rem}.kbd{display:inline-block;padding:3px 10px;border-radius:8px;background:#fff;border:2px solid #ddd;box-shadow:0 3px 0 #ccc;font:600 .9rem 'Fira Code'}
    @media(max-width:800px){#presentation-container{height:80vh;border-radius:25px}.slide{padding:28px}.row{flex-direction:column}.w-half{width:100%}.scene{min-height:240px}.blob{width:190px}.cards,.cards.two{grid-template-columns:1fr}.card{padding:22px}.ide-container{flex-direction:column}.ide-window{min-height:220px}#bottom-bar{padding:0 8px}.btn{padding:11px 18px}.bubble{font-size:.8rem}body{overflow:hidden}}
  </style>
</head>
<body>
  <main id="app-wrapper">
    <section id="presentation-container" aria-label="Materi pertemuan 1">
      <div id="slides-root"></div>
      <div class="progress-track"><div class="progress" id="progress"></div></div>
    </section>
    <nav id="bottom-bar" aria-label="Navigasi slide">
      <div class="slide-indicator"><span class="logo-mark"></span>Hal. <span id="current-page">1</span> / <span id="total-page">50</span></div>
      <div class="nav-controls"><button class="btn" id="prev-btn" type="button">Kembali</button><button class="btn btn-primary" id="next-btn" type="button">Lanjut ➞</button></div>
    </nav>
  </main>
  <script>
    const blob=(color='var(--c-blue)')=>`<svg class="blob" viewBox="0 0 320 320" aria-hidden="true"><path d="M65 82C103 25 225 30 266 88c35 49 23 153-30 190-48 34-154 23-190-28C10 200 27 139 65 82Z" fill="${color}"/><ellipse cx="125" cy="145" rx="24" ry="35" fill="white"/><ellipse cx="205" cy="145" rx="24" ry="35" fill="white"/><circle cx="132" cy="151" r="14" fill="#20202A"/><circle cx="198" cy="151" r="14" fill="#20202A"/><circle cx="127" cy="145" r="4" fill="white"/><circle cx="193" cy="145" r="4" fill="white"/><path d="M135 211q25 22 50 0" fill="none" stroke="#20202A" stroke-width="9" stroke-linecap="round"/></svg>`;
    const split=(tag,title,text,art,color='var(--c-blue)')=>`<div class="row center h-full gap"><div class="w-half col"><span class="tag-pill ${tag}">${tag.replace('tag-','')}</span><h2>${title}</h2><p class="lead">${text}</p></div><div class="w-half scene">${art||blob(color)}</div></div>`;
    const cards=(tag,title,intro,items)=>`<span class="tag-pill ${tag}">${tag.replace('tag-','')}</span><h2>${title}</h2><p class="lead">${intro}</p><div class="cards">${items.map((x,i)=>`<article class="card"><div class="icon" style="background:${x[2]}1A;color:${x[2]}">${x[0]}</div><h3>${x[1]}</h3><p>${x[3]}</p></article>`).join('')}</div>`;
    const codeSlide=(tag,title,code,caption)=>`<span class="tag-pill ${tag}">Kode Python</span><h2>${title}</h2><div class="code">${code}</div><div class="callout"><p>${caption}</p></div>`;
    const slides=[
      `<div class="row center h-full gap"><div class="w-half"><span class="tag-pill tag-pink">Pertemuan 01</span><h1>Markas Coding<br>di <span style="color:var(--c-blue)">Cloud!</span></h1><p class="lead" style="margin-top:22px">Membangun rumah pertama untuk kode kita bersama GitHub, Codespaces, dan Python.</p></div><div class="w-half scene">${blob('var(--c-pink)')}<div class="bubble top">☁️ Markas siap!</div><div class="bubble bottom">print("Halo!")</div></div></div>`,
      cards('tag-blue','Misi Kita Hari Ini','Di akhir pertemuan, kamu akan bisa…',[['☁️','Memahami Cloud','var(--c-blue)','Menjelaskan bedanya laptop sendiri dan komputer di internet.'],['📦','Membuat Repository','var(--c-orange)','Menyiapkan kotak proyek baru di GitHub.'],['🚀','Menyalakan Codespace','var(--c-green)','Membuka IDE dan menjalankan Python pertama.']]),
      split('tag-pink','Kenalan dengan Byte','Byte ingin membuat robot penyapa. Masalahnya, laptop Byte tertinggal di rumah!',`${blob('var(--c-pink)')}<div class="bubble top">Aduh, kodenya di laptop rumah…</div>`,'var(--c-pink)'),
      split('tag-blue','Ada Komputer di Internet?','Blob Biru memberi ide: “Simpan dan jalankan kodemu di komputer yang bisa diakses lewat internet!”',`${blob('var(--c-blue)')}<div class="bubble bottom">Kita pakai cloud! ☁️</div>`),
      `<div class="col center h-full text-center"><span class="tag-pill tag-blue" style="align-self:center">Subtopik 1</span><h2>Cloud & Server</h2><p class="lead">Apa sebenarnya “komputer di internet” itu?</p><div style="font-size:7rem;margin-top:25px">💻 ➜ ☁️</div></div>`,
      cards('tag-blue','Cloud Itu Apa?','Cloud bukan awan sungguhan. Cloud adalah layanan komputer yang dapat kita akses melalui internet.',[['🖥️','Komputer','var(--c-blue)','Mesin yang memproses perintah dan menyimpan file.'],['🌐','Internet','var(--c-purple)','Jalan yang menghubungkan perangkat kita ke layanan lain.'],['☁️','Cloud','var(--c-light-blue)','Komputer jarak jauh yang tersedia melalui internet.']]),
      split('tag-blue','Server: Komputer yang Melayani','Server adalah komputer yang menunggu permintaan, mengerjakan tugas, lalu mengirimkan hasil.',`<div class="code"><span class="comment">Permintaan</span> ➜ 🖥️<br>             SERVER<br><span class="fn">Hasil</span>      ⬅</div>`),
      cards('tag-blue','Contoh Cloud di Sekitar Kita','Kamu mungkin sudah menggunakannya setiap hari.',[['▶️','Streaming Video','var(--c-pink)','Video dikirim dari server ke perangkatmu.'],['🎮','Game Online','var(--c-green)','Server menyimpan dunia dan progres pemain.'],['📄','Dokumen Online','var(--c-yellow)','File bisa dibuka dari perangkat berbeda.']]),
      split('tag-blue','Analogi: Sewa Meja Belajar','Codespace seperti meja belajar lengkap di perpustakaan. Kita datang, membuka proyek, lalu semua alat sudah tersedia.',`<div style="font-size:8rem">🧑‍💻</div><div class="bubble top">Meja + alat siap!</div>`),
      `<span class="tag-pill tag-green">Cek Pemahaman</span><h2>Mana yang disebut server?</h2><div class="cards"><div class="card"><div class="icon">A</div><h3>Komputer jarak jauh</h3><p>Memberi layanan melalui internet.</p></div><div class="card"><div class="icon">B</div><h3>Kabel charger</h3><p>Mengisi daya baterai.</p></div><div class="card"><div class="icon">C</div><h3>Mouse</h3><p>Menggerakkan pointer.</p></div></div><div class="callout"><p><strong>Jawaban: A.</strong> Server adalah komputer yang melayani permintaan perangkat lain.</p></div>`,
      split('tag-orange','Dari Cloud ke Markas Proyek','Sekarang Byte butuh tempat yang rapi untuk menyimpan file, catatan, dan riwayat perubahan kode.',`${blob('var(--c-orange)')}<div class="bubble top">Jangan sampai file tercecer!</div>`,'var(--c-orange)'),
      `<div class="col center h-full text-center"><span class="tag-pill tag-purple" style="align-self:center">Subtopik 2</span><h2>Repository GitHub</h2><p class="lead">Kotak proyek yang rapi, aman, dan punya riwayat.</p><div style="font-size:7rem;margin-top:25px">📦 🐙</div></div>`,
      cards('tag-purple','GitHub & Repository','Dua istilah penting sebelum kita membuat markas.',[['🐙','GitHub','var(--c-purple)','Platform untuk menyimpan dan bekerja dengan proyek kode.'],['📦','Repository','var(--c-orange)','Folder proyek yang punya file dan riwayat perubahan.'],['🧭','Main','var(--c-blue)','Nama cabang utama tempat versi utama proyek berada.']]),
      split('tag-purple','Analogi: Kotak LEGO','Satu repository seperti satu kotak LEGO khusus. Semua keping untuk satu proyek disimpan bersama agar tidak tercampur.',`<div style="font-size:8rem">🧱📦</div>`,'var(--c-purple)'),
      `<span class="tag-pill tag-purple">Praktik Terbimbing</span><h2>Membuat Repository Baru</h2><div class="steps"><div class="step"><span class="num" style="background:var(--c-blue)">1</span><p>Buka <strong>github.com</strong> dan masuk ke akunmu.</p></div><div class="step"><span class="num" style="background:var(--c-purple)">2</span><p>Klik tombol <strong>New repository</strong>.</p></div><div class="step"><span class="num" style="background:var(--c-orange)">3</span><p>Beri nama <strong>bot-telegram-ku</strong>.</p></div></div>`,
      `<span class="tag-pill tag-purple">Praktik Terbimbing</span><h2>Pengaturan yang Kita Pilih</h2><div class="cards"><div class="card"><h3>Repository name</h3><div class="code">bot-telegram-ku</div></div><div class="card"><h3>Visibility</h3><p><strong>Public</strong> untuk latihan kelas. Jangan menyimpan token rahasia di dalam kode.</p></div><div class="card"><h3>README</h3><p>Boleh dicentang agar repository langsung memiliki catatan pembuka.</p></div></div>`,
      split('tag-pink','Aturan Nama yang Rapi','Gunakan huruf kecil dan tanda hubung. Nama yang rapi lebih mudah dibaca dan dibagikan.',`<div class="code"><span class="fn">bagus:</span> bot-telegram-ku<br><span style="color:#FF5555">hindari:</span> Proyek Aku!!!</div>`,'var(--c-pink)'),
      `<span class="tag-pill tag-green">Cek Sebelum Klik</span><h2>Checklist Repository</h2><ul class="check"><li>Nama proyek sudah benar.</li><li>Tidak ada password atau token di nama/deskripsi.</li><li>Visibility mengikuti arahan instruktur.</li><li>Klik <strong>Create repository</strong> hanya setelah semuanya dicek.</li></ul><div class="callout"><p>Repository adalah markas proyek; buat satu repository untuk satu tujuan yang jelas.</p></div>`,
      split('tag-green','Markas Sudah Jadi!','Repository Byte sudah tersedia. Namun isinya belum punya komputer kerja untuk menjalankan Python.',`${blob('var(--c-green)')}<div class="bubble top">Sekarang nyalakan Codespace!</div>`,'var(--c-green)'),
      `<div class="col center h-full text-center"><span class="tag-pill tag-green" style="align-self:center">Subtopik 3</span><h2>GitHub Codespaces</h2><p class="lead">Ruang coding lengkap yang berjalan di cloud.</p><div style="font-size:7rem;margin-top:25px">☁️ + 🧰</div></div>`,
      cards('tag-green','Apa yang Disiapkan Codespaces?','Kita mendapat lingkungan kerja langsung dari browser.',[['🗂️','Explorer','var(--c-blue)','Melihat folder dan file proyek.'],['📝','Editor','var(--c-purple)','Tempat membaca dan mengetik kode.'],['⌨️','Terminal','var(--c-green)','Tempat memberi perintah kepada komputer cloud.']]),
      `<span class="tag-pill tag-green">Praktik Terbimbing</span><h2>Meluncurkan Codespace</h2><div class="steps"><div class="step"><span class="num" style="background:var(--c-green)">1</span><p>Di halaman repository, klik tombol <strong>Code</strong>.</p></div><div class="step"><span class="num" style="background:var(--c-blue)">2</span><p>Pilih tab <strong>Codespaces</strong>.</p></div><div class="step"><span class="num" style="background:var(--c-purple)">3</span><p>Klik <strong>Create codespace on main</strong>.</p></div></div>`,
      split('tag-green','Tunggu Markas Disiapkan','GitHub sedang menyalakan komputer cloud dan memasang alat kerja. Proses ini bisa memerlukan beberapa saat.',`${blob('var(--c-light-blue)')}<div class="bubble top">Menyiapkan meja coding… ⏳</div>`,'var(--c-light-blue)'),
      `<span class="tag-pill tag-blue">Kenali IDE</span><h2>Tiga Area Utama</h2><div class="cards"><div class="card"><div class="icon" style="background:#447EE01A">①</div><h3>Explorer</h3><p>Panel kiri untuk file dan folder.</p></div><div class="card"><div class="icon" style="background:#9A53E01A">②</div><h3>Editor</h3><p>Area tengah untuk menulis kode.</p></div><div class="card"><div class="icon" style="background:#48A8501A">③</div><h3>Terminal</h3><p>Panel bawah untuk menjalankan perintah.</p></div></div>`,
      split('tag-blue','Analogi: Meja Coder','Explorer adalah laci, Editor adalah buku kerja, dan Terminal adalah interkom untuk memberi perintah ke komputer.',`<div style="font-size:7rem">🗄️ 📝 🎙️</div>`),
      `<span class="tag-pill tag-blue">Gerakan Pertama</span><h2>Membuka Terminal</h2><div class="code"><span class="comment">Menu:</span> Terminal → New Terminal<br><br><span class="comment">Shortcut umum:</span> <span class="str">Ctrl + &#96;</span></div><div class="callout"><p>Terminal bukan tempat menulis isi program. Terminal dipakai untuk menjalankan perintah, misalnya <strong>python main.py</strong>.</p></div>`,
      `<span class="tag-pill tag-green">Cek Pemahaman</span><h2>Pasangkan Area dan Tugasnya</h2><div class="steps"><div class="step"><span class="num" style="background:var(--c-blue)">E</span><p><strong>Explorer</strong> → mencari dan membuat file.</p></div><div class="step"><span class="num" style="background:var(--c-purple)">Ed</span><p><strong>Editor</strong> → mengetik isi <code>main.py</code>.</p></div><div class="step"><span class="num" style="background:var(--c-green)">T</span><p><strong>Terminal</strong> → menjalankan file Python.</p></div></div>`,
      split('tag-orange','Byte Siap Menulis Pesan','Komputer cloud menyala, repository terbuka, dan IDE siap. Saatnya membuat program pertama!',`${blob('var(--c-orange)')}<div class="bubble top">Halo Dunia Server!</div>`,'var(--c-orange)'),
      `<div class="col center h-full text-center"><span class="tag-pill tag-orange" style="align-self:center;background:#EF6C351A;color:var(--c-orange)">Subtopik 4</span><h2>File Python & print()</h2><p class="lead">Memberi komputer perintah untuk menampilkan pesan.</p><div style="font-size:7rem;margin-top:25px">🐍 💬</div></div>`,
      `<span class="tag-pill tag-orange" style="background:#EF6C351A;color:var(--c-orange)">Praktik Terbimbing</span><h2>Membuat <code>main.py</code></h2><div class="steps"><div class="step"><span class="num" style="background:var(--c-blue)">1</span><p>Di Explorer, klik ikon <strong>New File</strong>.</p></div><div class="step"><span class="num" style="background:var(--c-orange)">2</span><p>Ketik nama <strong>main.py</strong>, lalu tekan Enter.</p></div><div class="step"><span class="num" style="background:var(--c-green)">3</span><p>Pastikan file terbuka di area Editor.</p></div></div>`,
      split('tag-orange','Kenapa Akhirnya .py?','Ekstensi <strong>.py</strong> memberi tahu editor bahwa file ini berisi kode Python—seperti label pada kotak.',`<div style="font-size:8rem">📄<span style="font:700 3rem Fira Code;color:var(--c-blue)">.py</span></div>`,'var(--c-orange)'),
      codeSlide('tag-orange','Perintah Pertama',`<span class="fn">print</span>(<span class="str">"Halo Dunia Server!"</span>)`,'<strong>print()</strong> meminta Python menampilkan sesuatu ke terminal.'),
      cards('tag-orange','Bedah Satu Baris Kode','Setiap simbol punya tugas.',[['🟢','print','var(--c-green)','Nama fungsi untuk menampilkan output.'],['( )','Kurung','var(--c-purple)','Tempat kita memasukkan data untuk fungsi.'],['" "','Tanda Petik','var(--c-yellow)','Menandai teks atau string.']]),
      codeSlide('tag-orange','Huruf Besar Harus Tepat',`<span style="color:#FF5555">Print</span>(<span class="str">"Halo"</span>)  <span class="comment"># salah</span><br><span class="fn">print</span>(<span class="str">"Halo"</span>)  <span class="comment"># benar</span>`,'Python <strong>case-sensitive</strong>: huruf besar dan kecil dianggap berbeda.'),
