split('purple','Asynchronous Alarm Clock','<code>threading.Timer(detik, fungsi_alarm)</code> tells Python: <em>"Set a clock for X seconds. Meanwhile, keep chatting with users. When the clock rings, run the alarm function!"</em>',`<div style="font-size:7.5rem">⏰ ➜ ☁️ ➜ 🔔</div>`),

// Slide 7: Interactive Pyodide Sandbox
`<span class="tag green">Interactive Python Arena</span><h2>Simulate the Background Timer</h2><div class="ide-wrap"><div class="ide-window"><div class="ide-head"><i class="dot" style="background:#FF5F56"></i><i class="dot" style="background:#FFBD2E"></i><i class="dot" style="background:#27C93F"></i><span>timer_sim.py</span></div><textarea id="python-code" class="editor" spellcheck="false"># Timer Logic Simulation
user_streaks = {}

def start_focus(user_id, minutes):
    user_streaks[user_id] = user_streaks.get(user_id, 0) + 1
    streak = user_streaks[user_id]
    
    start_msg = f"🎯 [START] Mode fokus {minutes} menit dimulai! Taruh HP-mu ya!"
    finish_msg = f"🔔 [RING!] Waktu belajar {minutes} menit selesai!\n🔥 Streak Hari Ini: {streak} sesi fokus!"
    
    return start_msg, finish_msg

# Test starting a session
msg1, msg2 = start_focus(999, 25)
print(msg1)
print("\n... (Waktu 25 menit berlalu di background) ...\n")
print(msg2)</textarea></div><div class="ide-window"><div class="ide-head" style="background:#E2E8F0;color:#475569">Terminal Output</div><div id="python-output" class="output">Click 'Run Simulation' to test timer logic…</div></div></div><button id="run-btn" class="run" disabled>Loading Python… ⏳</button>`,

code('orange','Step 1: The Alarm Callback Function',`<span class="kw">import</span> <span class="var">threading</span><br><br><span class="kw">def</span> <span class="fn">alarm_selesai</span>(<span class="var">chat_id</span>, <span class="var">menit</span>):<br>    <span class="var">pesan</span> = <span class="str">f"""⏰ **WAKTU BELAJAR SELESAI!**<br>🎉 Hebat! Kamu sudah fokus selama {menit} menit.<br>☕ Sekarang istirahat 5 menit dulu bro!"""</span><br>    <span class="var">bot</span>.<span class="fn">send_message</span>(<span class="var">chat_id</span>, <span class="var">pesan</span>, <span class="var">parse_mode</span>=<span class="str">"Markdown"</span>)`,'This function will be triggered by Python automatically when the timer reaches zero!'),

code('green','Step 2: Spawning the Timer',`<span class="kw">@bot.message_handler</span>(<span class="var">commands</span>=[<span class="str">'fokus'</span>])<br><span class="kw">def</span> <span class="fn">handle_focus</span>(<span class="var">message</span>):<br>    <span class="var">parts</span> = <span class="var">message</span>.<span class="var">text</span>.<span class="fn">split</span>()<br>    <span class="kw">if</span> <span class="fn">len</span>(<span class="var">parts</span>) != <span class="numc">2</span>:<br>        <span class="var">bot</span>.<span class="fn">reply_to</span>(<span class="var">message</span>, <span class="str">"⚠️ Format: /fokus [menit]\nContoh: /fokus 25"</span>)<br>        <span class="kw">return</span><br>        <br>    <span class="kw">try</span>:<br>        <span class="var">menit</span> = <span class="fn">float</span>(<span class="var">parts</span>[<span class="numc">1</span>])<br>        <span class="var">detik</span> = <span class="var">menit</span> * <span class="numc">60</span><br>        <br>        <span class="comment"># Pasang alarm di background:</span><br>        <span class="var">timer</span> = <span class="var">threading</span>.<span class="fn">Timer</span>(<span class="var">detik</span>, <span class="var">alarm_selesai</span>, <span class="var">args</span>=[<span class="var">message</span>.<span class="var">chat</span>.<span class="var">id</span>, <span class="var">menit</span>])<br>        <span class="var">timer</span>.<span class="fn">start</span>()<br>        <br>        <span class="var">bot</span>.<span class="fn">reply_to</span>(<span class="var">message</span>, <span class="str">f"🎯 Mode fokus {menit} menit dimulai! Semangat! 🚀"</span>)<br>    <span class="kw">except</span> <span class="var">ValueError</span>:<br>        <span class="var">bot</span>.<span class="fn">reply_to</span>(<span class="var">message</span>, <span class="str">"❌ Error: Masukkan angka menit yang valid!"</span>)`,'args=[message.chat.id, menit] passes the necessary chat room ID into the alarm function!'),

const root=document.getElementById('root');root.innerHTML=slides.map((x,i)=>`<section class="slide${i===0?' active':''}" id="slide-${i+1}">${x}</section>`).join('');
const all=[...document.querySelectorAll('.slide')],prev=document.getElementById('prev'),next=document.getElementById('next'),page=document.getElementById('page'),total=document.getElementById('total'),progress=document.getElementById('progress');let current=0;total.textContent=all.length;
function indexFromHash(){const match=location.hash.match(/^#slide-(\d+)$/);if(!match)return 0;const index=Number(match[1])-1;return index>=0&&index<all.length?index:0}
function update(syncHash=true){all.forEach((x,i)=>x.classList.toggle('active',i===current));page.textContent=current+1;progress.style.width=`${(current+1)/all.length*100}%`;prev.disabled=current===0;const done=current===all.length-1;next.disabled=done;next.textContent=done?'Finish':'Next ➞';next.classList.toggle('primary',!done);if(syncHash&&location.hash!==`#slide-${current+1}`)history.replaceState(null,'',`#slide-${current+1}`)}
function move(d){if(current+d>=0&&current+d<all.length){current+=d;update()}}prev.onclick=()=>move(-1);next.onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.target.matches('textarea,input'))return;if(e.key==='ArrowRight'||e.key==='PageDown')move(1);if(e.key==='ArrowLeft'||e.key==='PageUp')move(-1)});window.addEventListener('hashchange',()=>{current=indexFromHash();update(false)});current=indexFromHash();update();

const run=document.getElementById('run-btn'),out=document.getElementById('python-output'),editor=document.getElementById('python-code');let ready=init();async function init(){try{const p=await loadPyodide();run.disabled=false;run.textContent='Run Simulation ▶';out.textContent='Python engine ready! Click the button above to execute.';return p}catch(e){run.textContent='Failed to load Python';out.textContent='Check internet connection.';out.style.color='var(--pink)';throw e}}
async function execute(){run.disabled=true;run.textContent='Running…';out.textContent='';try{const p=await ready,lines=[];p.setStdout({batched:m=>lines.push(m)});await p.runPythonAsync(editor.value);out.textContent=lines.join('\n')||'Code ran with no output.';out.style.color='#334155'}catch(e){out.textContent=`Oops, found a bug 🐛\n\n${e.message}`;out.style.color='var(--pink)'}finally{run.disabled=false;run.textContent='Run Simulation ▶'}}run.onclick=execute;
</script></body></html>
