const root=document.getElementById('root');root.innerHTML=slides.map((x,i)=>`<section class="slide${i===0?' active':''}" id="slide-${i+1}">${x}</section>`).join('');const all=[...document.querySelectorAll('.slide')],prev=document.getElementById('prev'),next=document.getElementById('next'),page=document.getElementById('page'),total=document.getElementById('total'),progress=document.getElementById('progress');let current=0;total.textContent=all.length;function update(){all.forEach((x,i)=>x.classList.toggle('active',i===current));page.textContent=current+1;progress.style.width=`${(current+1)/all.length*100}%`;prev.disabled=current===0;const done=current===all.length-1;next.disabled=done;next.textContent=done?'Finish':'Next ➞';next.classList.toggle('primary',!done)}function move(d){if(current+d>=0&&current+d<all.length){current+=d;update()}}prev.onclick=()=>move(-1);next.onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.target.matches('textarea,input'))return;if(e.key==='ArrowRight'||e.key==='PageDown')move(1);if(e.key==='ArrowLeft'||e.key==='PageUp')move(-1)});update();
const run=document.getElementById('run-btn'),out=document.getElementById('python-output'),codeInput=document.getElementById('python-code');let ready=init();async function init(){try{const p=await loadPyodide();run.disabled=false;run.textContent='Run Interview ▶';out.textContent='Python is ready! Fill in the answers then run.';return p}catch(e){run.textContent='Failed to load Python';out.textContent='Check your internet connection and reload.';out.style.color='var(--pink)';throw e}}async function execute(){run.disabled=true;run.textContent='Running…';out.textContent='';try{const p=await ready,lines=[],answers=[document.getElementById('answer-1').value,document.getElementById('answer-2').value,document.getElementById('answer-3').value];p.setStdout({batched:m=>lines.push(m)});p.setStdin({stdin:()=>answers.length?answers.shift():''});await p.runPythonAsync(codeInput.value);out.textContent=lines.join('\n')||'Code executed successfully with no output.';out.style.color='#334155'}catch(e){out.textContent=`Oops, there is a bug 🐛\n\n${e.message}`;out.style.color='var(--pink)'}finally{run.disabled=false;run.textContent='Run Interview ▶'}}run.onclick=execute;
