<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pertemuan 03 — Kalkulator Server</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;500;600;800&family=Fira+Code:wght@500&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script><style>
:root{--bg:#F3EFE9;--slide:#FFFDF9;--yellow:#E8AA24;--orange:#EF6C35;--pink:#E0356D;--purple:#9A53E0;--blue:#447EE0;--sky:#4AB2D9;--green:#48A850;--dark:#2A2A35;--muted:#6C6C82;--ide:#1E1E2E}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Poppins,sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}#app{width:96vw;max-width:1600px;display:flex;flex-direction:column;gap:20px}#deck{height:82vh;background:var(--slide);border-radius:40px;position:relative;overflow:hidden;box-shadow:0 25px 50px #2A2A3514}.slide{position:absolute;inset:0;padding:clamp(34px,5vw,70px);display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:scale(.95) translateY(20px);transition:.6s;overflow:auto}.slide.active{opacity:1;visibility:visible;transform:none;z-index:2}.slide::-webkit-scrollbar{width:16px}.slide::-webkit-scrollbar-thumb{background:#D8D8E5;border:5px solid var(--slide);border-radius:20px}h1,h2,h3{font-family:Fredoka,sans-serif;font-weight:700}h1{font-size:clamp(3rem,5.2vw,5.2rem);line-height:1.05}h2{font-size:clamp(2.2rem,3.7vw,3.8rem);line-height:1.12;margin-bottom:22px}h3{font-size:1.65rem;margin-bottom:10px}p,li{font-size:clamp(1rem,1.3vw,1.24rem);line-height:1.7;color:var(--muted);font-weight:500}.lead{font-size:clamp(1.15rem,1.6vw,1.45rem)}strong{color:var(--dark)}code{font-family:'Fira Code';color:var(--purple)}.row{display:flex}.col{display:flex;flex-direction:column}.center{align-items:center;justify-content:center}.half{width:50%}.full{min-height:100%}.gap{gap:clamp(25px,4vw,60px)}.text-center{text-align:center}.tag{align-self:flex-start;padding:9px 22px;border-radius:30px;font:700 1rem Fredoka;text-transform:uppercase;letter-spacing:.8px;margin-bottom:18px}.blue{background:#447EE01A;color:var(--blue)}.pink{background:#E0356D1A;color:var(--pink)}.purple{background:#9A53E01A;color:var(--purple)}.green{background:#48A8501A;color:var(--green)}.orange{background:#EF6C351A;color:var(--orange)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;margin-top:18px}.cards.two{grid-template-columns:repeat(2,1fr)}.card{background:#fff;padding:30px;border-radius:32px;box-shadow:0 15px 40px #0000000A}.icon{width:74px;height:74px;border-radius:24px;display:grid;place-items:center;font-size:2.2rem;margin-bottom:18px}.scene{position:relative;min-height:350px;display:grid;place-items:center}.blob{width:min(320px,80%);animation:float 6s ease-in-out infinite;filter:drop-shadow(0 18px 18px #2A2A351A)}@keyframes float{50%{transform:translateY(-15px) rotate(2deg)}}.bubble{position:absolute;background:#fff;padding:18px 24px;border-radius:26px;box-shadow:0 15px 35px #00000012;font-weight:700;max-width:260px}.top{top:2%;right:0}.bottom{bottom:2%;left:0}.code{background:var(--ide);color:#F8F8F2;border-radius:24px;padding:24px;font:500 1.1rem/1.7 'Fira Code';white-space:pre-wrap;box-shadow:0 16px 36px #1E1E2E29}.fn{color:#50FA7B}.str{color:#F1FA8C}.var{color:#8BE9FD}.numc{color:#BD93F9}.comment{color:#8D93B8}.steps{display:flex;flex-direction:column;gap:16px;margin-top:15px}.step{display:flex;align-items:center;gap:20px;background:#fff;padding:18px 24px;border-radius:50px;box-shadow:0 12px 30px #0000000A}.n{flex:0 0 48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 1.2rem Fredoka}.callout{padding:22px 27px;border-radius:25px;background:#E8AA241A;border-left:8px solid var(--yellow);margin-top:22px}.check{list-style:none}.check li{margin:12px 0;padding-left:34px;position:relative}.check li:before{content:'✓';position:absolute;left:0;color:var(--green);font-weight:800}.formula{font:700 clamp(2rem,4vw,4rem) 'Fira Code';color:var(--blue);text-align:center;padding:35px;background:#447EE00F;border-radius:32px}.ide-wrap{display:flex;gap:24px;min-height:330px;flex:1}.ide-window{flex:1;border-radius:25px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 15px 40px #00000014}.ide-head{height:45px;display:flex;align-items:center;padding:0 18px;gap:8px;font-weight:600;background:#2D2D44;color:#fff}.dot{width:12px;height:12px;border-radius:50%}.editor{background:var(--ide);color:#A6E22E;padding:22px;font:500 1rem/1.55 'Fira Code';flex:1;border:0;outline:0;resize:none}.output{background:#F8F9FA;border:4px dashed #E2E8F0;padding:22px;font:500 1rem/1.55 'Fira Code';flex:1;color:#334155;overflow:auto;white-space:pre-wrap}.run{align-self:center;margin-top:16px;background:var(--green);color:#fff;border:0;padding:14px 34px;border-radius:50px;font:700 1.2rem Fredoka;cursor:pointer;box-shadow:0 10px 25px #48A85055}.run:disabled{background:#CBD5E1;cursor:wait;box-shadow:none}#bar{display:flex;justify-content:space-between;align-items:center;padding:0 36px}.indicator{display:flex;align-items:center;gap:13px;font:700 1.15rem Fredoka}.logo{width:34px;height:34px;background:var(--pink);border-radius:12px;transform:rotate(15deg)}.nav{display:flex;gap:14px}.btn{border:0;border-radius:50px;padding:13px 34px;background:var(--dark);color:#fff;font:600 1.15rem Fredoka;cursor:pointer;box-shadow:0 10px 20px #2A2A3526}.primary{background:var(--blue)}.btn:disabled{background:#D8D8E5;color:#A0A0B5;box-shadow:none}.track{position:absolute;bottom:0;width:100%;height:7px;background:#EEEAF0;z-index:5}.progress{height:100%;background:linear-gradient(90deg,var(--pink),var(--blue));transition:.35s}.badge{display:grid;place-items:center;width:58px;height:58px;border-radius:20px;background:var(--purple);color:#fff;font:700 1.6rem Fredoka;margin-bottom:16px}@media(max-width:800px){#deck{height:80vh;border-radius:25px}.slide{padding:28px}.row{flex-direction:column}.half{width:100%}.scene{min-height:225px}.blob{width:180px}.cards,.cards.two{grid-template-columns:1fr}.card{padding:22px}.ide-wrap{flex-direction:column}.ide-window{min-height:220px}#bar{padding:0 8px}.btn{padding:11px 18px}.bubble{font-size:.8rem}}
</style></head><body><main id="app"><section id="deck"><div id="root"></div><div class="track"><div id="progress" class="progress"></div></div></section><nav id="bar"><div class="indicator"><span class="logo"></span>Hal. <span id="page">1</span> / <span id="total">46</span></div><div class="nav"><button id="prev" class="btn">Kembali</button><button id="next" class="btn primary">Lanjut ➞</button></div></nav></main><script>
const blob=(c='var(--blue)')=>`<svg class="blob" viewBox="0 0 320 320"><path d="M65 82C103 25 225 30 266 88c35 49 23 153-30 190-48 34-154 23-190-28C10 200 27 139 65 82Z" fill="${c}"/><ellipse cx="125" cy="145" rx="24" ry="35" fill="white"/><ellipse cx="205" cy="145" rx="24" ry="35" fill="white"/><circle cx="132" cy="151" r="14" fill="#20202A"/><circle cx="198" cy="151" r="14" fill="#20202A"/><circle cx="127" cy="145" r="4" fill="white"/><circle cx="193" cy="145" r="4" fill="white"/><path d="M135 211q25 22 50 0" fill="none" stroke="#20202A" stroke-width="9" stroke-linecap="round"/></svg>`;
const split=(tag,title,text,art,c='var(--blue)')=>`<div class="row center full gap"><div class="half col"><span class="tag ${tag}">${tag}</span><h2>${title}</h2><p class="lead">${text}</p></div><div class="half scene">${art||blob(c)}</div></div>`;
const cards=(tag,title,intro,items)=>`<span class="tag ${tag}">${tag}</span><h2>${title}</h2><p class="lead">${intro}</p><div class="cards">${items.map(x=>`<article class="card"><div class="icon" style="background:${x[2]}1A;color:${x[2]}">${x[0]}</div><h3>${x[1]}</h3><p>${x[3]}</p></article>`).join('')}</div>`;
const code=(tag,title,body,note)=>`<span class="tag ${tag}">Kode Python</span><h2>${title}</h2><div class="code">${body}</div><div class="callout"><p>${note}</p></div>`;
const slides=[
`<div class="row center full gap"><div class="half"><span class="tag pink">Pertemuan 03</span><h1>Kalkulator<br><span style="color:var(--blue)">Server</span></h1><p class="lead" style="margin-top:22px">Mengenal jenis data dan mengajak Python berhitung cepat tanpa kalkulator genggam.</p></div><div class="half scene">${blob('var(--blue)')}<div class="bubble top">100 + 50 = 150</div><div class="bubble bottom">Python jago hitung! 🔢</div></div></div>`,
cards('blue','Misi Hari Ini','Empat kemampuan baru menanti.',[['🏷️','Mengenali Tipe Data','var(--purple)','String, Integer, dan Float.'],['➕','Memakai Operator','var(--orange)','Tambah, kurang, kali, dan bagi.'],['🧠','Mengatur Perhitungan','var(--blue)','Variabel dan urutan operasi.']]),
split('pink','Byte Kehabisan Jari','Byte ingin menghitung umur semua anggota klub. Sepuluh jari ternyata tidak cukup!',`${blob('var(--pink)')}<div class="bubble top">2026 − 2012 = ?</div>`,'var(--pink)'),
split('blue','Minta Bantuan Server','Komputer cloud dapat menghitung sangat cepat—asal data dan perintah yang kita berikan tepat.',`<div style="font-size:8rem">☁️🧮</div><div class="bubble bottom">Serahkan padaku!</div>`),
`<div class="col center full text-center"><span class="tag purple" style="align-self:center">Subtopik 1</span><h2>Jenis-Jenis Data</h2><p class="lead">Komputer perlu tahu: ini teks, angka bulat, atau angka desimal?</p><div style="font-size:7rem;margin-top:25px">💬 42 3.14</div></div>`,
cards('purple','Tiga Tipe Data Utama','Tipe data menentukan bagaimana Python memperlakukan sebuah nilai.',[['"Abel"','String','var(--yellow)','Teks yang diapit tanda petik.'],['14','Integer','var(--blue)','Bilangan bulat tanpa koma.'],['3.5','Float','var(--green)','Bilangan desimal memakai titik.']]),
split('purple','Analogi: Tiga Laci','Alat tulis, kelereng, dan air disimpan di wadah berbeda. Data pun punya “wadah” sesuai jenisnya.',`<div style="font-size:7rem">🗄️📦🥛</div>`,'var(--purple)'),
code('purple','String = Teks',`<span class="var">nama</span> = <span class="str">"Abel"</span><br><span class="var">kota</span> = <span class="str">'Bandung'</span>`,'String harus memakai tanda petik tunggal atau ganda. Angka di dalam petik juga menjadi teks.'),
code('purple','Integer = Bilangan Bulat',`<span class="var">umur</span> = <span class="numc">14</span><br><span class="var">jumlah_siswa</span> = <span class="numc">20</span><br><span class="var">suhu</span> = <span class="numc">-3</span>`,'Integer tidak memiliki bagian desimal. Nilainya dapat positif, nol, atau negatif.'),
code('purple','Float = Bilangan Desimal',`<span class="var">tinggi</span> = <span class="numc">158.5</span><br><span class="var">harga</span> = <span class="numc">12500.50</span>`,'Python memakai titik sebagai pemisah desimal, bukan koma.'),
`<span class="tag green">Cek Cepat</span><h2>Tebak Tipe Datanya</h2><div class="cards"><div class="card"><h3>"17"</h3><p><strong>String</strong>, karena memakai petik.</p></div><div class="card"><h3>17</h3><p><strong>Integer</strong>, angka bulat.</p></div><div class="card"><h3>17.0</h3><p><strong>Float</strong>, memiliki titik desimal.</p></div></div>`,
code('pink','Mengecek dengan type()',`<span class="fn">print</span>(<span class="fn">type</span>(<span class="str">"Halo"</span>))<br><span class="fn">print</span>(<span class="fn">type</span>(<span class="numc">25</span>))<br><span class="fn">print</span>(<span class="fn">type</span>(<span class="numc">2.5</span>))`,'Fungsi type() membantu kita menanyakan jenis sebuah data kepada Python.'),
split('orange','Angka Siap Beraksi','Setelah memisahkan teks dan angka, Byte dapat memberi perintah matematika.',`${blob('var(--orange)')}<div class="bubble top">Ayo hitung!</div>`,'var(--orange)'),
`<div class="col center full text-center"><span class="tag orange" style="align-self:center">Subtopik 2</span><h2>Operator Matematika</h2><p class="lead">Simbol sederhana yang meminta Python melakukan operasi.</p><div class="formula" style="margin-top:25px">+ &nbsp; − &nbsp; * &nbsp; /</div></div>`,
cards('orange','Empat Operator Dasar','Beberapa simbol berbeda dari tulisan matematika di buku.',[['+','Penjumlahan','var(--green)','Menambahkan dua nilai.'],['−','Pengurangan','var(--pink)','Mengurangi nilai pertama.'],['*','Perkalian','var(--orange)','Bintang berarti kali.']]),
cards('orange','Operator Berikutnya','Pembagian selalu menghasilkan angka Float di Python.',[['/','Pembagian','var(--blue)','10 / 2 menghasilkan 5.0.'],['//','Bagi Bulat','var(--purple)','10 // 3 menghasilkan 3.'],['%','Sisa Bagi','var(--yellow)','10 % 3 menghasilkan 1.']]),
split('orange','Analogi: Berbagi Pizza','Delapan potong dibagi kepada empat orang. Python menghitung setiap orang mendapat dua potong.',`<div style="font-size:8rem">🍕 ÷ 👥</div>`,'var(--orange)'),
code('orange','Python sebagai Kalkulator',`<span class="fn">print</span>(<span class="numc">8</span> + <span class="numc">4</span>)<br><span class="fn">print</span>(<span class="numc">8</span> - <span class="numc">4</span>)<br><span class="fn">print</span>(<span class="numc">8</span> * <span class="numc">4</span>)<br><span class="fn">print</span>(<span class="numc">8</span> / <span class="numc">4</span>)`,'Hasilnya: 12, 4, 32, dan 2.0.'),
code('orange','Simpan Hasilnya',`<span class="var">harga</span> = <span class="numc">12000</span><br><span class="var">jumlah</span> = <span class="numc">3</span><br><span class="var">total</span> = <span class="var">harga</span> * <span class="var">jumlah</span><br><span class="fn">print</span>(<span class="var">total</span>)`,'Hasil perhitungan dapat dimasukkan ke variabel baru untuk digunakan kembali.'),
`<span class="tag green">Latihan Bersama</span><h2>Prediksi Sebelum Run</h2><div class="code"><span class="var">koin</span> = <span class="numc">50</span><br><span class="var">bonus</span> = <span class="numc">25</span><br><span class="var">belanja</span> = <span class="numc">10</span><br><span class="fn">print</span>(<span class="var">koin</span> + <span class="var">bonus</span> - <span class="var">belanja</span>)</div><div class="callout"><p><strong>Prediksi:</strong> 65. Jalankan hanya setelah semua siswa menjelaskan langkahnya.</p></div>`,
code('pink','Bug: Teks Bukan Angka',`<span class="var">umur</span> = <span class="str">"14"</span><br><span class="fn">print</span>(<span class="var">umur</span> + <span class="numc">1</span>)<br><br><span style="color:#FF5555">TypeError</span>`,'String "14" tidak bisa langsung ditambah Integer 1. Periksa petik dan tipe datanya.'),
split('blue','Mana yang Dihitung Dulu?','Byte menemukan soal dengan tambah dan kali bersamaan. Komputer membutuhkan aturan urutan.',`${blob('var(--blue)')}<div class="bubble top">2 + 3 * 4 = ?</div>`),
`<div class="col center full text-center"><span class="tag blue" style="align-self:center">Subtopik 3</span><h2>Urutan Operasi</h2><p class="lead">Kurung lebih dahulu, lalu kali/bagi, kemudian tambah/kurang.</p><div class="formula" style="margin-top:25px">( ) ➜ * / ➜ + −</div></div>`,
split('blue','Analogi: Antrean Wahana','Tamu dengan tiket prioritas masuk lebih dahulu. Dalam matematika, isi kurung mendapat prioritas.',`<div style="font-size:8rem">🎟️🎢</div>`),
code('blue','Tanpa Kurung',`<span class="var">hasil</span> = <span class="numc">2</span> + <span class="numc">3</span> * <span class="numc">4</span><br><span class="fn">print</span>(<span class="var">hasil</span>) <span class="comment"># 14</span>`,'Python mengerjakan 3 × 4 lebih dahulu, kemudian menambahkan 2.'),
code('blue','Dengan Kurung',`<span class="var">hasil</span> = (<span class="numc">2</span> + <span class="numc">3</span>) * <span class="numc">4</span><br><span class="fn">print</span>(<span class="var">hasil</span>) <span class="comment"># 20</span>`,'Kurung mengubah prioritas: 2 + 3 dikerjakan sebelum dikali 4.'),
`<span class="tag green">Cek Pemahaman</span><h2>Dua Kode, Dua Hasil</h2><div class="cards two"><div class="card"><h3>10 + 2 * 5</h3><div class="formula">20</div></div><div class="card"><h3>(10 + 2) * 5</h3><div class="formula">60</div></div></div>`,
code('blue','Rumus dengan Variabel',`<span class="var">panjang</span> = <span class="numc">8</span><br><span class="var">lebar</span> = <span class="numc">5</span><br><span class="var">keliling</span> = <span class="numc">2</span> * (<span class="var">panjang</span> + <span class="var">lebar</span>)`,'Kurung membuat rumus lebih jelas bagi Python dan manusia yang membaca kode.'),
split('green','Misteri Umur Byte','Byte tahu tahun lahir dan tahun sekarang. Bisakah server menghitung umurnya otomatis?',`${blob('var(--green)')}<div class="bubble top">2026 − 2012</div>`,'var(--green)'),
`<div class="col center full text-center"><span class="tag green" style="align-self:center">Subtopik 4</span><h2>Kalkulator Umur</h2><p class="lead">Mengubah cerita sehari-hari menjadi data, rumus, lalu output.</p><div style="font-size:7rem;margin-top:25px">🎂 ➜ 🧮</div></div>`,
`<span class="tag green">Langkah Berpikir</span><h2>Dari Masalah ke Program</h2><div class="steps"><div class="step"><span class="n" style="background:var(--blue)">1</span><p><strong>Data:</strong> tahun sekarang dan tahun lahir.</p></div><div class="step"><span class="n" style="background:var(--orange)">2</span><p><strong>Rumus:</strong> tahun sekarang − tahun lahir.</p></div><div class="step"><span class="n" style="background:var(--green)">3</span><p><strong>Output:</strong> tampilkan perkiraan umur.</p></div></div>`,
code('green','Program Kalkulator Umur',`<span class="var">tahun_sekarang</span> = <span class="numc">2026</span><br><span class="var">tahun_lahir</span> = <span class="numc">2012</span><br><span class="var">umur</span> = <span class="var">tahun_sekarang</span> - <span class="var">tahun_lahir</span><br><span class="fn">print</span>(<span class="str">"Perkiraan umur:"</span>, <span class="var">umur</span>)`,'Hasilnya adalah perkiraan karena ulang tahun pada tahun ini mungkin belum terjadi.'),
cards('green','Bedah Kodenya','Setiap bagian punya peran jelas.',[['📥','Input Data','var(--blue)','Dua variabel tahun menyimpan angka.'],['⚙️','Proses','var(--orange)','Operator minus menghitung selisih.'],['📤','Output','var(--green)','print() menampilkan hasil.']]),
`<span class="tag green">Arena Python</span><h2>Jalankan Kalkulator Server</h2><p style="margin-bottom:14px">Ubah data dan rumus, lalu lihat hasilnya.</p><div class="ide-wrap"><div class="ide-window"><div class="ide-head"><i class="dot" style="background:#FF5F56"></i><i class="dot" style="background:#FFBD2E"></i><i class="dot" style="background:#27C93F"></i><span>main.py</span></div><textarea id="python-code" class="editor" spellcheck="false">tahun_sekarang = 2026

umur = tahun_sekarang - tahun_lahir

print("Perkiraan umur:", umur, "tahun")
print("Umur dalam 5 tahun:", umur + 5)</textarea></div><div class="ide-window"><div class="ide-head" style="background:#E2E8F0;color:#475569">Terminal Output</div><div id="python-output" class="output">Mesin Python sedang disiapkan…</div></div></div><button id="run-btn" class="run" disabled>Memuat Python… ⏳</button>`,
code('pink','Debug: Salah Operator',`<span class="var">umur</span> = <span class="var">tahun_sekarang</span> + <span class="var">tahun_lahir</span> <span class="comment"># 4038?</span>`,'Kode dapat berjalan tanpa error tetapi hasilnya salah. Ini disebut logic error—periksa kembali rumusnya.'),
code('pink','Debug: Nama Tidak Sama',`<span class="var">tahun_lahir</span> = <span class="numc">2012</span><br><span class="fn">print</span>(<span style="color:#FF5555">tahunlahir</span>)`,'tahun_lahir dan tahunlahir adalah dua nama berbeda. Ejaan dan underscore harus konsisten.'),
`<span class="tag green">Checkpoint</span><h2>Kita Sudah Bisa!</h2><ul class="check"><li>Membedakan String, Integer, dan Float.</li><li>Menggunakan +, −, *, /, //, dan %.</li><li>Menyimpan hasil perhitungan dalam variabel.</li><li>Memakai kurung untuk mengatur prioritas.</li><li>Membuat kalkulator umur sederhana.</li></ul>`,

const root=document.getElementById('root');root.innerHTML=slides.map((x,i)=>`<section class="slide${i===0?' active':''}" id="slide-${i+1}">${x}</section>`).join('');const all=[...document.querySelectorAll('.slide')],prev=document.getElementById('prev'),next=document.getElementById('next'),page=document.getElementById('page'),total=document.getElementById('total'),progress=document.getElementById('progress');let current=0;total.textContent=all.length;function update(){all.forEach((x,i)=>x.classList.toggle('active',i===current));page.textContent=current+1;progress.style.width=`${(current+1)/all.length*100}%`;prev.disabled=current===0;const done=current===all.length-1;next.disabled=done;next.textContent=done?'Selesai':'Lanjut ➞';next.classList.toggle('primary',!done)}function move(d){if(current+d>=0&&current+d<all.length){current+=d;update()}}prev.onclick=()=>move(-1);next.onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.target.matches('textarea,input'))return;if(e.key==='ArrowRight'||e.key==='PageDown')move(1);if(e.key==='ArrowLeft'||e.key==='PageUp')move(-1)});update();
const run=document.getElementById('run-btn'),out=document.getElementById('python-output'),input=document.getElementById('python-code');let ready=init();async function init(){try{const p=await loadPyodide();run.disabled=false;run.textContent='Jalankan Kode ▶';out.textContent='Python siap! Tekan tombol Jalankan Kode.';return p}catch(e){run.textContent='Python gagal dimuat';out.textContent='Periksa koneksi internet lalu muat ulang.';out.style.color='var(--pink)';throw e}}async function execute(){run.disabled=true;run.textContent='Menjalankan…';out.textContent='';try{const p=await ready,lines=[];p.setStdout({batched:m=>lines.push(m)});await p.runPythonAsync(input.value);out.textContent=lines.join('\n')||'Kode berhasil tanpa output.';out.style.color='#334155'}catch(e){out.textContent=`Oops, ada bug 🐛\n\n${e.message}`;out.style.color='var(--pink)'}finally{run.disabled=false;run.textContent='Jalankan Kode ▶'}}run.onclick=execute;
</script></body></html>
