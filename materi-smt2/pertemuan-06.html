<html lang="en">
<head>

<title>Meeting 06 — Python Adventure Project</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;500;600;800&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
<style>
:root{--bg:#F3EFE9;--slide:#FFFDF9;--yellow:#E8AA24;--orange:#EF6C35;--pink:#E0356D;--purple:#9A53E0;--blue:#447EE0;--sky:#4AB2D9;--green:#48A850;--dark:#2A2A35;--muted:#6C6C82;--ide:#1E1E2E}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Poppins,sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}#app{width:96vw;max-width:1600px;display:flex;flex-direction:column;gap:20px}#deck{height:82vh;background:var(--slide);border-radius:40px;position:relative;overflow:hidden;box-shadow:0 25px 50px #2A2A3514}.slide{position:absolute;inset:0;padding:clamp(34px,5vw,70px);display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:scale(.95) translateY(20px);transition:opacity .6s,transform .6s cubic-bezier(.34,1.56,.64,1);overflow:auto}.slide.active{opacity:1;visibility:visible;transform:none;z-index:2}.slide::-webkit-scrollbar{width:16px}.slide::-webkit-scrollbar-thumb{background:#D8D8E5;border:5px solid var(--slide);border-radius:20px}h1,h2,h3{font-family:Fredoka,sans-serif;font-weight:700}h1{font-size:clamp(3rem,5.2vw,5.2rem);line-height:1.05}h2{font-size:clamp(2.2rem,3.7vw,3.8rem);line-height:1.12;margin-bottom:22px}h3{font-size:1.65rem;margin-bottom:10px}p,li,label{font-size:clamp(1rem,1.3vw,1.24rem);line-height:1.7;color:var(--muted);font-weight:500}.lead{font-size:clamp(1.15rem,1.6vw,1.45rem)}strong{color:var(--dark)}code{font-family:'Fira Code';color:var(--purple)}.row{display:flex}.col{display:flex;flex-direction:column}.center{align-items:center;justify-content:center}.half{width:50%}.full{min-height:100%}.gap{gap:clamp(25px,4vw,60px)}.text-center{text-align:center}.tag{align-self:flex-start;padding:9px 22px;border-radius:30px;font:700 1rem Fredoka;text-transform:uppercase;letter-spacing:.8px;margin-bottom:18px}.blue{background:#447EE01A;color:var(--blue)}.pink{background:#E0356D1A;color:var(--pink)}.purple{background:#9A53E01A;color:var(--purple)}.green{background:#48A8501A;color:var(--green)}.orange{background:#EF6C351A;color:var(--orange)}.yellow{background:#E8AA241A;color:#A56E00}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;margin-top:18px}.cards.two{grid-template-columns:repeat(2,1fr)}.card{background:#fff;padding:30px;border-radius:32px;box-shadow:0 15px 40px #0000000A;transition:.3s}.card:hover{transform:translateY(-7px)}.icon{width:74px;height:74px;border-radius:24px;display:grid;place-items:center;font-size:2.2rem;margin-bottom:18px}.scene{position:relative;min-height:350px;display:grid;place-items:center}.blob{width:min(320px,80%);animation:float 6s ease-in-out infinite;filter:drop-shadow(0 18px 18px #2A2A351A)}@keyframes float{50%{transform:translateY(-15px) rotate(2deg)}}.bubble{position:absolute;background:#fff;padding:18px 24px;border-radius:26px;box-shadow:0 15px 35px #00000012;font-weight:700;max-width:285px}.top{top:2%;right:0}.bottom{bottom:2%;left:0}.code{background:var(--ide);color:#F8F8F2;border-radius:24px;padding:24px;font:500 1.02rem/1.68 'Fira Code';white-space:pre-wrap;box-shadow:0 16px 36px #1E1E2E29}.fn{color:#50FA7B}.str{color:#F1FA8C}.var{color:#8BE9FD}.numc{color:#BD93F9}.kw{color:#FF79C6}.comment{color:#8D93B8}.steps{display:flex;flex-direction:column;gap:16px;margin-top:15px}.step{display:flex;align-items:center;gap:20px;background:#fff;padding:18px 24px;border-radius:50px;box-shadow:0 12px 30px #0000000A}.n{flex:0 0 48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 1.2rem Fredoka}.callout{padding:22px 27px;border-radius:25px;background:#E8AA241A;border-left:8px solid var(--yellow);margin-top:22px}.check{list-style:none}.check li{margin:12px 0;padding-left:34px;position:relative}.check li:before{content:'✓';position:absolute;left:0;color:var(--green);font-weight:800}.formula{font:700 clamp(2rem,4vw,4rem) Fredoka;color:var(--blue)}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:center;margin-top:25px}.map-node{background:#fff;border-radius:28px;padding:22px;text-align:center;box-shadow:0 12px 30px #0000000A}.map-arrow{text-align:center;font-size:2.2rem;color:var(--orange)}.ide-wrap{display:flex;gap:20px;min-height:285px;flex:1}.ide-window{flex:1;border-radius:25px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 15px 40px #00000014}.ide-head{height:44px;display:flex;align-items:center;padding:0 18px;gap:8px;font-weight:600;background:#2D2D44;color:#fff}.dot{width:12px;height:12px;border-radius:50%}.editor{background:var(--ide);color:#A6E22E;padding:20px;font:500 .88rem/1.45 'Fira Code';flex:1;border:0;outline:0;resize:none}.output{background:#F8F9FA;border:4px dashed #E2E8F0;padding:20px;font:500 .9rem/1.5 'Fira Code';flex:1;color:#334155;overflow:auto;white-space:pre-wrap}.input-panel{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.input-panel label{font-size:.84rem;color:var(--dark)}.answer{width:100%;padding:10px 13px;border:2px solid #D8D8E5;border-radius:14px;font:500 .95rem Poppins;outline:none}.answer:focus{border-color:var(--blue)}.run{align-self:center;margin-top:12px;background:var(--green);color:#fff;border:0;padding:13px 32px;border-radius:50px;font:700 1.15rem Fredoka;cursor:pointer;box-shadow:0 10px 25px #48A85055}.run:disabled{background:#CBD5E1;cursor:wait;box-shadow:none}#bar{display:flex;justify-content:space-between;align-items:center;padding:0 36px}.indicator{display:flex;align-items:center;gap:13px;font:700 1.15rem Fredoka}.logo{width:34px;height:34px;background:var(--pink);border-radius:12px;transform:rotate(15deg)}.nav{display:flex;gap:14px}.btn{border:0;border-radius:50px;padding:13px 34px;background:var(--dark);color:#fff;font:600 1.15rem Fredoka;cursor:pointer;box-shadow:0 10px 20px #2A2A3526}.primary{background:var(--blue)}.btn:disabled{background:#D8D8E5;color:#A0A0B5;box-shadow:none}.track{position:absolute;bottom:0;width:100%;height:7px;background:#EEEAF0;z-index:5}.progress{height:100%;background:linear-gradient(90deg,var(--pink),var(--blue));transition:.35s}.badge{display:grid;place-items:center;width:58px;height:58px;border-radius:20px;background:var(--purple);color:#fff;font:700 1.6rem Fredoka;margin-bottom:16px}@media(max-width:800px){#deck{height:80vh;border-radius:25px}.slide{padding:28px}.row{flex-direction:column}.half{width:100%}.scene{min-height:225px}.blob{width:180px}.cards,.cards.two,.input-panel,.map{grid-template-columns:1fr}.card{padding:22px}.ide-wrap{flex-direction:column}.ide-window{min-height:210px}#bar{padding:0 8px}.btn{padding:11px 18px}.bubble{font-size:.8rem}}
</style></head>
<body><main id="app"><section id="deck"><div id="root"></div><div class="track"><div id="progress" class="progress"></div></div></section><nav id="bar" aria-label="Slide navigation"><div class="indicator"><span class="logo"></span>Page <span id="page">1</span> / <span id="total">52</span></div><div class="nav"><button id="prev" class="btn">Back</button><button id="next" class="btn primary">Next ➞</button></div></nav></main>
<script>
const blob=(c='var(--blue)')=>`<svg class="blob" viewBox="0 0 320 320" aria-label="Friendly Blob character"><path d="M65 82C103 25 225 30 266 88c35 49 23 153-30 190-48 34-154 23-190-28C10 200 27 139 65 82Z" fill="${c}"/><ellipse cx="125" cy="145" rx="24" ry="35" fill="white"/><ellipse cx="205" cy="145" rx="24" ry="35" fill="white"/><circle cx="132" cy="151" r="14" fill="#20202A"/><circle cx="198" cy="151" r="14" fill="#20202A"/><circle cx="127" cy="145" r="4" fill="white"/><circle cx="193" cy="145" r="4" fill="white"/><path d="M135 211q25 22 50 0" fill="none" stroke="#20202A" stroke-width="9" stroke-linecap="round"/></svg>`;
const split=(tag,title,text,art,c='var(--blue)')=>`<div class="row center full gap"><div class="half col"><span class="tag ${tag}">${tag}</span><h2>${title}</h2><p class="lead">${text}</p></div><div class="half scene">${art||blob(c)}</div></div>`;
const cards=(tag,title,intro,items)=>`<span class="tag ${tag}">${tag}</span><h2>${title}</h2><p class="lead">${intro}</p><div class="cards">${items.map(x=>`<article class="card"><div class="icon" style="background:${x[2]}1A;color:${x[2]}">${x[0]}</div><h3>${x[1]}</h3><p>${x[3]}</p></article>`).join('')}</div>`;
const code=(tag,title,body,note)=>`<span class="tag ${tag}">Python Code</span><h2>${title}</h2><div class="code">${body}</div><div class="callout"><p>${note}</p></div>`;
const slides=[
`<div class="row center full gap"><div class="half"><span class="tag pink">Meeting 06</span><h1>The Lost<br><span style="color:var(--blue)">Cloud Key</span></h1><p class="lead" style="margin-top:22px">Review our Python foundations by building a choose-your-own-adventure game.</p></div><div class="half scene">${blob('var(--blue)')}<div class="bubble top">The server door is locked!</div><div class="bubble bottom">Your choices shape the story. 🗝️</div></div></div>`,
cards('blue','Today’s Mission','This is our Phase 1 review and mini project.',[['🧰','Review','var(--purple)','Recall the Python tools we know.'],['🗺️','Plan','var(--orange)','Turn a story into a decision map.'],['🎮','Build','var(--green)','Code, test, debug, and sync a complete game.']]),
split('pink','A Message from Cloud City','Byte finds a locked server door. A note says the Cloud Key is hidden beyond the forest or inside the old tunnel.',`${blob('var(--pink)')}<div class="bubble top">FOREST or TUNNEL?</div>`,'var(--pink)'),
`<div class="col center full text-center"><span class="tag green" style="align-self:center">Learning Goals</span><h2>By the End, You Can…</h2><ul class="check" style="text-align:left"><li>Combine variables, input, conversion, f-strings, and branches.</li><li>Plan a program before coding it.</li><li>Test every path and debug common errors.</li><li>Commit and sync a finished Python project.</li></ul></div>`,
`<div class="col center full text-center"><span class="tag purple" style="align-self:center">Review</span><h2>Our Python Toolbox</h2><p class="lead">Five meetings gave us everything needed for an interactive story.</p><div style="font-size:6.5rem;margin-top:25px">📦 💬 🧮 ❓ 🛤️</div></div>`,
cards('purple','Tool 1: Variables','Named boxes remember data for later.',[['👤','Player Name','var(--blue)','name = "Ari"'],['❤️','Energy','var(--pink)','energy = 3'],['🗝️','Key Status','var(--yellow)','has_key = False']]),
code('purple','Variables in Our Story',`<span class="var">player_name</span> = <span class="str">"Ari"</span><br><span class="var">energy</span> = <span class="numc">3</span><br><span class="var">has_key</span> = <span class="kw">False</span>`,'String stores text, Integer stores a whole number, and Boolean stores True or False.'),
cards('blue','Tool 2: Input and Conversion','The player controls the story by typing answers.',[['⌨️','Text Answer','var(--blue)','input() returns String.'],['🔢','Number Answer','var(--orange)','int(input()) returns Integer.'],['💾','Save It','var(--green)','Assign the answer to a variable.']]),
code('blue','Ask the Player',`<span class="var">name</span> = <span class="fn">input</span>(<span class="str">"Hero name: "</span>)<br><span class="var">door</span> = <span class="fn">int</span>(<span class="fn">input</span>(<span class="str">"Choose door 1 or 2: "</span>))`,'Only convert an answer when the program truly needs a number.'),
cards('orange','Tool 3: Math','Operators update the game state.',[['➖','Lose Energy','var(--pink)','energy = energy - 1'],['➕','Gain Coins','var(--green)','coins = coins + 10'],['🧮','Calculate','var(--orange)','Use clear formulas.']]),
code('orange','Update a Value',`<span class="var">energy</span> = <span class="numc">3</span><br><span class="var">energy</span> = <span class="var">energy</span> - <span class="numc">1</span><br><span class="fn">print</span>(<span class="str">f"Energy: {energy}"</span>) <span class="comment"># Energy: 2</span>`,'The new result replaces the old value stored in energy.'),
cards('pink','Tools 4–5: f-strings and Branches','Personal replies plus choices create an interactive experience.',[['💬','f-string','var(--pink)','Insert variables into text.'],['🔎','Comparison','var(--blue)','Check the player’s answer.'],['🛤️','if / elif / else','var(--green)','Choose the matching story path.']]),
`<div class="col center full text-center"><span class="tag orange" style="align-self:center">Subtopic 1</span><h2>Plan the Adventure</h2><p class="lead">Good projects begin with a small, clear map—not a giant wall of code.</p><div style="font-size:7rem;margin-top:25px">💡 ➜ 🗺️ ➜ 💻</div></div>`,
split('orange','Start with One Goal','The player must recover the Cloud Key. Every scene and choice should move the player toward success or an ending.',`<div style="font-size:8rem">🎯 🗝️</div>`,'var(--orange)'),
cards('orange','Three Story Ingredients','A small game can feel complete with only three pieces.',[['🌆','Setting','var(--blue)','Cloud City and its locked server.'],['🧑‍🚀','Player','var(--pink)','A named hero making choices.'],['🗝️','Goal','var(--yellow)','Find the key and return safely.']]),
`<span class="tag orange">Story Map</span><h2>First Decision</h2><div class="map"><div class="map-node" style="grid-column:2"><h3>Locked Server</h3><p>Choose a route</p></div><div class="map-arrow" style="grid-column:2">↙ &nbsp; ↘</div><div class="map-node"><h3>Forest</h3><p>Follow the lights</p></div><div class="map-node"><h3>Tunnel</h3><p>Follow the sound</p></div><div class="map-node"><h3>Unknown</h3><p>Invalid choice</p></div></div>`,
split('orange','Analogy: Interactive Book','A choose-your-own-adventure book sends the reader to a different page. Our if branches send Python to different code blocks.',`<div style="font-size:8rem">📖 🛤️</div>`,'var(--orange)'),
`<span class="tag yellow">Pseudocode</span><h2>Write Ideas Before Syntax</h2><div class="code">ASK for player name<br>SHOW the mission<br>ASK for forest or tunnel<br><br>IF choice is forest<br>    SHOW the forest scene<br>ELIF choice is tunnel<br>    SHOW the tunnel scene<br>ELSE<br>    SHOW an invalid-choice ending</div><div class="callout"><p>Pseudocode describes logic in plain language. It does not need perfect Python syntax.</p></div>`,
`<span class="tag yellow">Input Design</span><h2>Make Choices Easy to Type</h2><div class="cards two"><div class="card"><h3>Clear Prompt</h3><p>Type <strong>forest</strong> or <strong>tunnel</strong>:</p></div><div class="card"><h3>Clear Rule</h3><p>Use lowercase words exactly as shown.</p></div></div><div class="callout"><p>Simple choice words reduce typing mistakes for beginner players.</p></div>`,
`<span class="tag green">Planning Checkpoint</span><h2>Can Someone Else Follow the Map?</h2><ul class="check"><li>The game has one clear goal.</li><li>Every choice has a visible outcome.</li><li>Prompts show valid answers.</li><li>An else branch handles unexpected input.</li><li>The story is small enough to finish today.</li></ul>`,
`<div class="col center full text-center"><span class="tag blue" style="align-self:center">Subtopic 2</span><h2>Build the Opening</h2><p class="lead">Introduce the player, mission, and first choice.</p><div style="font-size:7rem;margin-top:25px">🎬 💬 ⌨️</div></div>`,
code('blue','Personal Welcome',`<span class="var">name</span> = <span class="fn">input</span>(<span class="str">"What is your hero name? "</span>)<br><br><span class="fn">print</span>(<span class="str">f"Welcome to Cloud City, {name}!"</span>)<br><span class="fn">print</span>(<span class="str">"The main server has been locked."</span>)`,'input() saves the player name. The f-string places that name inside the welcome message.'),
code('blue','Store the First Choice',`<span class="fn">print</span>(<span class="str">"Two routes may lead to the Cloud Key."</span>)<br><span class="var">route</span> = <span class="fn">input</span>(<span class="str">"Type forest or tunnel: "</span>)`,'The route variable will contain the exact String typed by the player.'),
code('blue','First Branch',`<span class="kw">if</span> <span class="var">route</span> == <span class="str">"forest"</span>:<br>    <span class="fn">print</span>(<span class="str">"You enter a forest of glowing trees."</span>)<br><span class="kw">elif</span> <span class="var">route</span> == <span class="str">"tunnel"</span>:<br>    <span class="fn">print</span>(<span class="str">"You enter a tunnel beneath the city."</span>)<br><span class="kw">else</span>:<br>    <span class="fn">print</span>(<span class="str">"That route is not on the map."</span>)`,'Python checks the String choice from top to bottom.'),
`<span class="tag green">Trace a Test</span><h2>Player Types “tunnel”</h2><div class="steps"><div class="step"><span class="n" style="background:var(--pink)">1</span><p><code>route == "forest"</code> is False.</p></div><div class="step"><span class="n" style="background:var(--green)">2</span><p><code>route == "tunnel"</code> is True.</p></div><div class="step"><span class="n" style="background:var(--blue)">3</span><p>The tunnel message runs. Python skips the else branch.</p></div></div>`,
code('pink','Bug: Choice Uses Different Case',`<span class="var">route</span> = <span class="str">"Forest"</span><br><span class="fn">print</span>(<span class="var">route</span> == <span class="str">"forest"</span>) <span class="comment"># False</span>`,'For now, tell players to type lowercase exactly. Later we will learn a tool that normalizes letter case.'),
code('pink','Bug: Branches Are Not Aligned',`<span class="kw">if</span> <span class="var">route</span> == <span class="str">"forest"</span>:<br>    <span class="fn">print</span>(<span class="str">"Forest"</span>)<br>    <span style="color:#FF5555"><span class="kw">elif</span></span> <span class="var">route</span> == <span class="str">"tunnel"</span>:<br>        <span class="fn">print</span>(<span class="str">"Tunnel"</span>)`,'if, elif, and else in one decision chain must line up at the same indentation level.'),
`<span class="tag green">Opening Checkpoint</span><h2>Run Three Tests</h2><div class="cards"><div class="card"><h3>forest</h3><p>Forest scene appears.</p></div><div class="card"><h3>tunnel</h3><p>Tunnel scene appears.</p></div><div class="card"><h3>river</h3><p>Invalid-choice ending appears.</p></div></div>`,
`<div class="col center full text-center"><span class="tag pink" style="align-self:center">Subtopic 3</span><h2>Add a Second Decision</h2><p class="lead">Each valid route gets one more choice and a unique ending.</p><div style="font-size:7rem;margin-top:25px">🛤️ ➜ 🛤️ ➜ 🏁</div></div>`,
split('pink','The Forest Scene','Glowing fireflies circle two objects: a silver bridge and a hidden tree door. Which clue should the hero follow?',`${blob('var(--green)')}<div class="bubble top">bridge or door?</div>`,'var(--green)'),
code('pink','Decision Inside the Forest',`<span class="kw">if</span> <span class="var">route</span> == <span class="str">"forest"</span>:<br>    <span class="var">forest_choice</span> = <span class="fn">input</span>(<span class="str">"Type bridge or door: "</span>)<br><br>    <span class="kw">if</span> <span class="var">forest_choice</span> == <span class="str">"door"</span>:<br>        <span class="fn">print</span>(<span class="str">"You find the Cloud Key!"</span>)<br>    <span class="kw">else</span>:<br>        <span class="fn">print</span>(<span class="str">"The bridge leads back to the city."</span>)`,'A branch inside another branch is called a nested decision. Each level adds four spaces.'),
`<span class="tag pink">Indentation Map</span><h2>See the Levels</h2><div class="code"><span class="kw">if</span> route == <span class="str">"forest"</span>:        <span class="comment"># level 0</span><br>    forest_choice = input(...)  <span class="comment"># level 1</span><br>    <span class="kw">if</span> forest_choice == <span class="str">"door"</span>: <span class="comment"># level 1</span><br>        print(<span class="str">"You win!"</span>)   <span class="comment"># level 2</span></div><div class="callout"><p>Indentation shows which scene owns each line.</p></div>`,
split('purple','The Tunnel Scene','A robot guard asks a number riddle. The answer decides whether it gives the hero the key.',`${blob('var(--purple)')}<div class="bubble top">What is 6 × 7?</div>`,'var(--purple)'),
code('purple','Decision Inside the Tunnel',`<span class="kw">elif</span> <span class="var">route</span> == <span class="str">"tunnel"</span>:<br>    <span class="var">answer</span> = <span class="fn">int</span>(<span class="fn">input</span>(<span class="str">"What is 6 × 7? "</span>))<br><br>    <span class="kw">if</span> <span class="var">answer</span> == <span class="numc">42</span>:<br>        <span class="fn">print</span>(<span class="str">"The robot gives you the Cloud Key!"</span>)<br>    <span class="kw">else</span>:<br>        <span class="fn">print</span>(<span class="str">"The robot asks you to try again tomorrow."</span>)`,'This path reviews input conversion, multiplication knowledge, comparison, and nested branching.'),
`<span class="tag blue">Track the Result</span><h2>Use a Boolean Game State</h2><div class="code"><span class="var">has_key</span> = <span class="kw">False</span><br><br><span class="comment"># inside a winning branch:</span><br><span class="var">has_key</span> = <span class="kw">True</span><br><br><span class="comment"># after all route branches:</span><br><span class="kw">if</span> <span class="var">has_key</span>:<br>    <span class="fn">print</span>(<span class="str">"Cloud City is saved!"</span>)</div><div class="callout"><p>The has_key variable remembers whether any route reached a winning ending.</p></div>`,
code('blue','Final Message with f-string',`<span class="kw">if</span> <span class="var">has_key</span>:<br>    <span class="fn">print</span>(<span class="str">f"Great work, {name}! Cloud City is online again."</span>)<br><span class="kw">else</span>:<br>    <span class="fn">print</span>(<span class="str">f"Good try, {name}. Every explorer learns from a journey."</span>)`,'The final decision uses the Boolean game state to choose a personal closing.'),
`<span class="tag green">Path Checklist</span><h2>Test Every Ending</h2><div class="cards"><div class="card"><h3>Forest Win</h3><p>forest → door</p></div><div class="card"><h3>Tunnel Win</h3><p>tunnel → 42</p></div><div class="card"><h3>Try Again</h3><p>forest → bridge, tunnel → wrong answer, or invalid route</p></div></div>`,
`<span class="tag green">Interactive Python Arena</span><h2>Play the Lost Cloud Key</h2><div class="ide-wrap"><div class="ide-window"><div class="ide-head"><i class="dot" style="background:#FF5F56"></i><i class="dot" style="background:#FFBD2E"></i><i class="dot" style="background:#27C93F"></i><span>main.py</span></div><textarea id="python-code" class="editor" spellcheck="false">name = input("What is your hero name? ")
has_key = False

print(f"Welcome to Cloud City, {name}!")
route = input("Type forest or tunnel: ")

if route == "forest":
    choice = input("Type bridge or door: ")
    if choice == "door":
        print("You find the Cloud Key!")
        has_key = True
    else:
        print("The bridge leads back to the city.")
elif route == "tunnel":
    answer = int(input("What is 6 x 7? "))

const all=[...document.querySelectorAll('.slide')],prev=document.getElementById('prev'),next=document.getElementById('next'),page=document.getElementById('page'),total=document.getElementById('total'),progress=document.getElementById('progress');let current=0;total.textContent=all.length;
function indexFromHash(){const match=location.hash.match(/^#slide-(\d+)$/);if(!match)return 0;const index=Number(match[1])-1;return index>=0&&index<all.length?index:0}
function update(syncHash=true){all.forEach((x,i)=>x.classList.toggle('active',i===current));page.textContent=current+1;progress.style.width=`${(current+1)/all.length*100}%`;prev.disabled=current===0;const done=current===all.length-1;next.disabled=done;next.textContent=done?'Finish':'Next ➞';next.classList.toggle('primary',!done);if(syncHash&&location.hash!==`#slide-${current+1}`)history.replaceState(null,'',`#slide-${current+1}`)}
function move(d){if(current+d>=0&&current+d<all.length){current+=d;update()}}prev.onclick=()=>move(-1);next.onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.target.matches('textarea,input'))return;if(e.key==='ArrowRight'||e.key==='PageDown')move(1);if(e.key==='ArrowLeft'||e.key==='PageUp')move(-1)});window.addEventListener('hashchange',()=>{current=indexFromHash();update(false)});current=indexFromHash();update();

async function execute(){run.disabled=true;run.textContent='Running…';out.textContent='';try{const p=await ready,lines=[],answers=[document.getElementById('answer-1').value,document.getElementById('answer-2').value,document.getElementById('answer-3').value];p.setStdout({batched:m=>lines.push(m)});const setup=`import builtins\n__browser_answers = iter(${JSON.stringify(answers)})\ndef __browser_input(prompt=''):\n    print(prompt, end='')\n    return next(__browser_answers)\nbuiltins.input = __browser_input\n`;await p.runPythonAsync(setup+editor.value);out.textContent=lines.join('\n')||'Code ran successfully with no output.';out.style.color='#334155'}catch(e){out.textContent=`Oops, found a bug 🐛\n\n${e.message}`;out.style.color='var(--pink)'}finally{run.disabled=false;run.textContent='Run Adventure ▶'}}run.onclick=execute;
