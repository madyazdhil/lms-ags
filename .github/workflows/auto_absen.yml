name: Auto Attendance Submission (Airtable)

on:
  schedule:
    # Runs every Wednesday at 13:00 UTC (20:00 WIB) after class
    - cron: '0 13 * * 3'
  workflow_dispatch:
    inputs:
      session_week:
        description: 'Target Week / Pertemuan (Leave empty for all pending active sessions)'
        required: false
        default: ''

# Never let a manual run overlap the scheduled run. The GAS claim is the
# source-of-truth guard, while this prevents unnecessary duplicate runners.
concurrency:
  group: auto-attendance
  cancel-in-progress: false

jobs:
  auto-absen:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Playwright & Dependencies
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: 🔎 Validate Apps Script endpoint
        env:
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL || 'https://script.google.com/macros/s/AKfycbxSze-Gb7Sz7RPb9t-a_1WW887-iVee-hho6bGQ_Tv2zGWsUxiZdPKK4W7TkC7pY1rZ/exec' }}
        run: |
          test -n "$GAS_WEB_APP_URL" || { echo "::error::Missing GAS_WEB_APP_URL repository secret"; exit 1; }
          curl --fail --silent --show-error --location \
            "$GAS_WEB_APP_URL?action=ping" | grep -q '"status":"success"' \
            || { echo "::error::Apps Script endpoint did not return success"; exit 1; }

      - name: 🚀 Run Auto Attendance Script
        env:
          # Secret may override this, but the confirmed production deployment
          # remains a safe default so a missing secret cannot break the run.
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL || 'https://script.google.com/macros/s/AKfycbxSze-Gb7Sz7RPb9t-a_1WW887-iVee-hho6bGQ_Tv2zGWsUxiZdPKK4W7TkC7pY1rZ/exec' }}
          CLASS_CODE: ${{ secrets.CLASS_CODE }}
          TEACHER_NAME: ${{ secrets.TEACHER_NAME }}
          TARGET_WEEK: ${{ github.event.inputs.session_week }}
        run: |
          node automate_absen.js

      - name: 📸 Upload Confirmation Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attendance-screenshots
          path: |
            *.png
            brain/*/*.png
