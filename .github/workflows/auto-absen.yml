name: Auto Absen Playwright Cloud

on:
  schedule:
    # Runs every hour (or adjust cron schedule)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  auto-absen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Auto Absen Script
        env:
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL || 'https://script.google.com/macros/s/AKfycbxSze-Gb7Sz7RPb9t-a_1WW887-iVee-hho6bGQ_Tv2zGWsUxiZdPKK4W7TkC7pY1rZ/exec' }}
          TEACHER_NAME: ${{ secrets.TEACHER_NAME || 'Yazid Hilmi' }}
          CLASS_CODE: ${{ secrets.CLASS_CODE || 'Extracurricular - Coding TA 2026/2027' }}
        run: node automate_absen.js


