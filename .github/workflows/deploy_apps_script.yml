name: Deploy Apps Script backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Configure clasp credentials
        env:
          CLASP_TOKEN: ${{ secrets.CLASP_TOKEN }}
        run: |
          test -n "$CLASP_TOKEN" || { echo "::error::Missing CLASP_TOKEN"; exit 1; }
          printf '%s' "$CLASP_TOKEN" > "$HOME/.clasprc.json"
      - name: Prepare Apps Script entrypoint
        run: cp code.gs Code.js
      - name: Push Apps Script source
        run: clasp push --force
      - name: Update web app deployment
        env:
          CLASP_DEPLOYMENT_ID: ${{ secrets.CLASP_DEPLOYMENT_ID }}
        run: |
          test -n "$CLASP_DEPLOYMENT_ID" || { echo "::error::Missing CLASP_DEPLOYMENT_ID"; exit 1; }
          clasp deploy --deploymentId "$CLASP_DEPLOYMENT_ID" --description "LMS-AGS attendance backend"
