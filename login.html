<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - LMS Alta Global School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="glass-card login-card">
      <div class="login-logo">
        <span>AGS</span>
      </div>
      <h1 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 0.5rem; letter-spacing: -0.02em;">Welcome Back!</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem;">
        Enter your student email address to access your extracurricular dashboard. No password required!
      </p>

      <form id="login-form">
        <div class="input-group">
          <label class="input-label" for="email-input">Student Email Address</label>
          <input 
            type="email" 
            id="email-input" 
            class="form-input" 
            placeholder="e.g. student@altaglobalschool.sch.id" 
            required 
            autocomplete="email"
          />
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; padding: 0.9rem;">
          <span>Enter Dashboard</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
        </button>
      </form>

      <div style="margin-top: 1.75rem; font-size: 0.825rem; color: var(--text-muted);">
        Alta Global School Extracurricular Platform &bull; v1.0
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If user is already logged in, redirect to index
      if (Auth.getUser()) {
        window.location.href = "index.html";
        return;
      }

      gsap.from(".login-card", { duration: 0.9, y: 30, opacity: 0, ease: "power3.out" });

      const loginForm = document.getElementById('login-form');
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const emailInput = document.getElementById('email-input').value.trim();
        const submitBtn = document.getElementById('submit-btn');

        if (!emailInput) return;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>Verifying Email...</span>';

        const response = await fetchAPI('login', { email: emailInput });

        if (response.status === 'success' && response.data) {
          Auth.setUser(response.data);
          showToast('Login successful! Redirecting...');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 800);
        } else {
          showToast(response.message || 'Login failed. Please check your email.', true);
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Enter Dashboard</span>';
        }
      });
    });
  </script>
</body>
</html>
